name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Run tests without LAME
        run: cargo test --no-default-features

      - name: Run tests with static Opus support
        run: cargo test --features opus-encoding

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests with FFmpeg AAC, ALAC, and Vorbis support
        run: cargo test --features ffmpeg-encoding

      - name: Install LAME
        run: sudo apt-get install -y libmp3lame-dev

      - name: Run tests with MP3 encoding
        run: cargo test --features mp3-encoding

  rust-api:
    name: Rust API compatibility
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Select the latest released API baseline
        id: baseline
        shell: bash
        run: |
          baseline=
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              baseline=$tag
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)
          if [[ -z "$baseline" ]]; then
            echo "No released vMAJOR.MINOR.PATCH tag is reachable from HEAD" >&2
            exit 1
          fi
          git rev-parse --verify "${baseline}^{commit}"
          echo "tag=$baseline" >> "$GITHUB_OUTPUT"

      - name: Install optional native API dependencies
        run: sudo apt-get update && sudo apt-get install -y libmp3lame-dev

      - name: Build all-feature API documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Reject public Rust API breakage
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9.0
        with:
          package: forge-normalizer
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          feature-group: all-features
          release-type: patch

  c-api:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Check Rust and C header contracts
        run: cargo test --locked --target ${{ matrix.target }} --test c_api --test c_header

      - name: Link and run a C consumer
        if: runner.os != 'Windows'
        shell: bash
        run: tools/test-c-api.sh "${{ matrix.target }}"

      - name: Link and run a C consumer
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/test-c-api.ps1 -Target "${{ matrix.target }}"

  plugin-parity:
    name: Plugin parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Compare CLI, CLAP, and LV2 output with the live processor
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace
        run: |
          cargo test --locked --target ${{ matrix.target }} --features clap-plugin,lv2-plugin --lib plugin_parity
          cargo test --locked --target ${{ matrix.target }} --features clap-plugin,lv2-plugin --test live_cli plugin_parity

  ebu-conformance:
    name: EBU conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache official EBU v5 test set
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer
          key: ebu-v5-9cc500b4df83f7c21855c74dce795ef5209a752bf884253ae57d0ce512efb062

      - name: Run official EBU Tech 3341/3342 conformance tests
        run: tools/test-ebu-conformance.sh

  itu-conformance:
    name: ITU BS.2217 conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache official ITU-R BS.2217-2 material
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer/bs2217-2
          key: itu-bs2217-2-core-v1

      - name: Run official ITU-R BS.2217-2 conformance tests
        run: tools/test-itu-conformance.sh

  aaf-interoperability:
    name: AAF effect and MetaDictionary interoperability
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned public AAF fixtures
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer/aaf-08dcc3dfe823ea5781db1cb657d9c2606557fcdc
          key: aaf-pyaaf2-08dcc3dfe823ea5781db1cb657d9c2606557fcdc-v3

      - name: Run AAF effect, MetaDictionary, object-model, and Edit Protocol checks
        run: tools/test-aaf-fixtures.sh

  iamf-interoperability:
    name: AOMedia OAR/IAMF interoperability matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned AOMedia libiamf vectors
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer/iamf-f06e919e2ad5502a2adc4bdd4e146f2e7e7ffb63
          key: iamf-libiamf-v1.1.0-oar-matrix-v2

      - name: Run OAR/IAMF interoperability matrix
        run: tools/test-iamf-conformance.sh
