name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate crates.io package metadata and contents
        run: tools/check-release-readiness.sh

      - name: Run Clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Run tests without LAME
        run: cargo test --no-default-features

      - name: Check optional CUDA true-peak build and CPU fallback
        run: |
          cargo clippy --locked --features cuda-truepeak --lib --bin forge -- -D warnings
          cargo test --locked --features cuda-truepeak --lib cuda_truepeak::tests
          cargo test --locked --features cuda-truepeak --lib cuda_cpu_recovery

      - name: Run immersive downmix QC contract tests
        run: |
          cargo test --locked --no-default-features --lib downmix --bin forge-downmix-qc
          cargo test --locked --no-default-features --test downmix_qc_cli

      - name: Run binaural QC contract tests
        run: |
          cargo test --locked --no-default-features --lib binaural_qc --bin forge-binaural-qc
          cargo test --locked --no-default-features --test binaural_qc_cli

      - name: Run smart remediation contract tests
        run: |
          cargo test --locked --no-default-features --lib remediation --bin forge-remediate
          cargo test --locked --no-default-features --test remediation_cli

      - name: Run metadata repair contract tests
        run: |
          cargo test --locked --no-default-features --lib metadata_repair --bin forge-metadata-repair
          cargo test --locked --no-default-features --test metadata_repair_cli

      - name: Run opt-in ONNX provider contract tests
        run: cargo test --locked --features onnx-provider --lib onnx_provider --bin forge-onnx-provider

      - name: Run bounded remote Range and probe tests
        run: cargo test --locked --lib remote_range --test remote_qc_cli --bin forge-remote-qc

      - name: Run bounded REST service tests
        run: cargo test --locked --lib service --test service_api --bin forge-service

      - name: Run service metrics and OpenTelemetry bridge tests
        run: cargo test --locked --lib service_metrics

      - name: Run optional gRPC service and cancellation tests
        run: cargo test --locked --features grpc-service --lib service_grpc --bin forge-service

      - name: Run tests with static Opus support
        run: cargo test --features opus-encoding

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests with FFmpeg AAC, ALAC, and Vorbis support
        run: cargo test --features ffmpeg-encoding

      - name: Install LAME
        run: sudo apt-get install -y libmp3lame-dev

      - name: Run tests with MP3 encoding
        run: cargo test --features mp3-encoding

  wasm:
    name: Browser WASM analysis
    needs: rust
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0 and the WebAssembly target
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Check WASM formatting and lints
        run: |
          cargo fmt --manifest-path wasm/Cargo.toml -- --check
          cargo clippy --locked --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Build the browser package
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tools/build-wasm-package.sh "$version" dist

      - name: Run the generated ES module in Node.js
        run: node wasm/test/smoke.mjs

  rust-api:
    name: Rust API compatibility
    needs: rust
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Select the latest released API baseline
        id: baseline
        shell: bash
        run: |
          baseline=
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              baseline=$tag
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)
          if [[ -z "$baseline" ]]; then
            echo "No released vMAJOR.MINOR.PATCH tag is reachable from HEAD" >&2
            exit 1
          fi
          git rev-parse --verify "${baseline}^{commit}"
          echo "tag=$baseline" >> "$GITHUB_OUTPUT"

      - name: Install optional native API dependencies
        run: sudo apt-get update && sudo apt-get install -y libmp3lame-dev

      - name: Build all-feature API documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Reject public Rust API breakage
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9.0
        with:
          package: forge-normalizer
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          feature-group: all-features
          release-type: patch

  c-api:
    name: C/Python ABI (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            python: "3.14"
            library: libforge_normalizer.so
          - os: macos-latest
            target: aarch64-apple-darwin
            rustflags: -Ctarget-feature=+neon,+aes,+sha2
            python: "3.10"
            library: libforge_normalizer.dylib
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: ""
            python: "3.10"
            library: forge_normalizer.dll

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Initialize the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Check Rust and C header contracts
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --locked --target ${{ matrix.target }} --test c_api --test c_header

      - name: Check AArch64 stereo K-weighting equivalence
        if: matrix.os == 'macos-latest'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --no-default-features --lib
          pair_kweight_is_bit_exact_including_exceptional_samples

      - name: Check AArch64 stereo PCM16 decode equivalence
        if: matrix.os == 'macos-latest'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --no-default-features --lib
          s16_stereo_streaming_simd_matches_scalar_for_all_codes_and_tails

      - name: Link and run a C consumer
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: tools/test-c-api.sh "${{ matrix.target }}"

      - name: Link and run a C consumer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: tools/test-c-api.ps1 -Target "${{ matrix.target }}"

      - name: Test the Python source binding against the built library
        env:
          FORGE_NORMALIZER_LIBRARY: ${{ github.workspace }}/target/${{ matrix.target }}/debug/${{ matrix.library }}
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: |
          python -m compileall -q python/src python/tests tools/build-python-wheel.py
          python -c "from pathlib import Path; assert Path('LICENSE').read_bytes() == Path('python/LICENSE').read_bytes()"
          python -m unittest discover -s python/tests -p "test_*.py" -v

  host-adapters:
    name: FFmpeg/GStreamer host adapters
    needs: rust
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install host development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libavutil-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Compile and smoke-test host adapters
        run: tools/test-host-adapters.sh

  vst3-adapter:
    name: VST3 adapter
    needs: rust
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install VST3 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git ca-certificates

      - name: Compile and validate VST3 bundle
        run: tools/test-vst3-adapter.sh

  au-adapter:
    name: Audio Unit adapter
    needs: rust
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Compile and validate Audio Unit component
        env:
          FORGE_BUILD_JOBS: "2"
        run: tools/test-au-adapter.sh

  plugin-parity:
    name: Plugin parity (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Compare CLI, CLAP, and LV2 output with the live processor
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace
        run: |
          cargo test --locked --target ${{ matrix.target }} --features clap-plugin,lv2-plugin --lib plugin_parity
          cargo test --locked --target ${{ matrix.target }} --features clap-plugin,lv2-plugin --test live_cli plugin_parity

  ebu-conformance:
    name: EBU conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache official EBU v5 test set
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer
          key: ebu-v5-9cc500b4df83f7c21855c74dce795ef5209a752bf884253ae57d0ce512efb062

      - name: Run official EBU Tech 3341/3342 conformance tests
        run: tools/test-ebu-conformance.sh

  itu-conformance:
    name: ITU BS.2217 conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache official ITU-R BS.2217-2 material
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer/bs2217-2
          key: itu-bs2217-2-core-v1

      - name: Run official ITU-R BS.2217-2 conformance tests
        run: tools/test-itu-conformance.sh

  aaf-interoperability:
    name: AAF effect and MetaDictionary interoperability
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned public AAF fixtures
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer/aaf-08dcc3dfe823ea5781db1cb657d9c2606557fcdc
          key: aaf-pyaaf2-08dcc3dfe823ea5781db1cb657d9c2606557fcdc-v3

      - name: Run AAF effect, MetaDictionary, object-model, and Edit Protocol checks
        run: tools/test-aaf-fixtures.sh

  iamf-interoperability:
    name: AOMedia OAR/IAMF interoperability matrix
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned AOMedia libiamf vectors
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer/iamf-f06e919e2ad5502a2adc4bdd4e146f2e7e7ffb63
          key: iamf-libiamf-v1.1.0-oar-matrix-v2

      - name: Run OAR/IAMF interoperability matrix
        run: tools/test-iamf-conformance.sh
