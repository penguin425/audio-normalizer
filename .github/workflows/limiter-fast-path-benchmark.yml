name: Limiter fast-path benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/limiter-fast-path-benchmark.yml"
      - "src/dsp/limiter.rs"
      - "tools/benchmark.py"
      - "tools/test_benchmark.py"
      - "schema/performance-benchmark-v1.schema.json"

permissions:
  contents: read

concurrency:
  group: limiter-fast-path-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Test limiter semantics and benchmark contract
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '' }}
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib dsp::limiter::tests -- --nocapture
          python3 -m unittest candidate/tools/test_benchmark.py

      - name: Build exact baseline and candidate
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --no-default-features --bin forge
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --no-default-features --bin forge

      - name: Verify byte-exact idle and active limiter output
        shell: bash
        run: |
          set -euo pipefail
          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "${exact_dir}"
          EXACT_DIR="${exact_dir}" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import write_pcm16_wave

          write_pcm16_wave(Path(os.environ["EXACT_DIR"]) / "stereo.wav", 30, 48_000, 2)
          PY

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          "${baseline}" "${exact_dir}/stereo.wav" --jobs 1 --limiter --verify \
            --overwrite -o "${exact_dir}/base-idle.wav"
          "${candidate}" "${exact_dir}/stereo.wav" --jobs 1 --limiter --verify \
            --overwrite -o "${exact_dir}/candidate-idle.wav"
          cmp "${exact_dir}/base-idle.wav" "${exact_dir}/candidate-idle.wav"

          "${baseline}" "${exact_dir}/stereo.wav" --jobs 1 --target=-6 --ceiling=-3 \
            --limiter --verify --overwrite -o "${exact_dir}/base-active.wav"
          "${candidate}" "${exact_dir}/stereo.wav" --jobs 1 --target=-6 --ceiling=-3 \
            --limiter --verify --overwrite -o "${exact_dir}/candidate-active.wav"
          cmp "${exact_dir}/base-active.wav" "${exact_dir}/candidate-active.wav"

      - name: Run limiter benchmarks in both orders
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          common=(
            --duration-seconds 300
            --iterations 5
            --case wav-stereo-limiter-idle
            --case wav-stereo-limiter-active
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/base-first" \
            --output base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/candidate-second" \
            --output candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/candidate-first" \
            --output candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/base-second" \
            --output base-second.json "${common[@]}"

      - name: Summarize pooled and per-order medians
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          names = ("base-first", "candidate-second", "candidate-first", "base-second")
          documents = {
              name: json.loads(Path(f"{name}.json").read_text())
              for name in names
          }
          assert all(document["passed"] for document in documents.values())
          indexed = {
              name: {item["id"]: item for item in document["results"]}
              for name, document in documents.items()
          }
          summary = {"method": "two execution orders; ten samples per binary", "cases": []}
          for case_id in indexed["base-first"]:
              row = {"id": case_id, "samples_per_binary": 10}
              for metric in ("wall", "cpu", "rss"):
                  def values(name):
                      samples = indexed[name][case_id]["samples"]
                      if metric == "wall":
                          return [sample["wall_seconds"] for sample in samples]
                      if metric == "cpu":
                          return [
                              sample["user_cpu_seconds"] + sample["system_cpu_seconds"]
                              for sample in samples
                          ]
                      return [sample["peak_rss_bytes"] for sample in samples]

                  base_first = values("base-first")
                  candidate_second = values("candidate-second")
                  candidate_first = values("candidate-first")
                  base_second = values("base-second")
                  baseline = base_first + base_second
                  candidate = candidate_first + candidate_second
                  reducer = max if metric == "rss" else statistics.median
                  base_value = reducer(baseline)
                  candidate_value = reducer(candidate)
                  row[metric] = {
                      "base_first": reducer(base_first),
                      "candidate_second": reducer(candidate_second),
                      "candidate_first": reducer(candidate_first),
                      "base_second": reducer(base_second),
                      "baseline_pooled": base_value,
                      "candidate_pooled": candidate_value,
                      "change_percent": (candidate_value / base_value - 1.0) * 100.0,
                  }
              assert row["wall"]["change_percent"] <= 3.0, row
              summary["cases"].append(row)

          Path("limiter-fast-path-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: limiter-fast-path-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: |
            base-*.json
            candidate-*.json
            limiter-fast-path-summary.json
          if-no-files-found: error
          retention-days: 30
