name: Apple Silicon PGO candidate benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/apple-pgo-benchmark.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tools/benchmark.py"
      - "tools/build-pgo-forge.sh"
      - "tools/canonicalize-pgo-profile.py"
      - "tools/train-pgo.py"

permissions:
  contents: read

concurrency:
  group: apple-pgo-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (macos-aarch64)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust 1.97.0 and matching LLVM PGO tools
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: aarch64-apple-darwin
          components: llvm-tools-preview

      - name: Build the portable baseline and PGO candidate
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-baseline
          FORGE_PGO_FEATURES: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service
          FORGE_PGO_ROOT: ${{ runner.temp }}/forge-pgo
          FORGE_PGO_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -Ctarget-feature=+neon,+aes,+sha2
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -Ctarget-feature=+neon,+aes,+sha2
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin \
            --features "$FORGE_PGO_FEATURES" --bin forge
          tools/build-pgo-forge.sh aarch64-apple-darwin
          baseline="${RUNNER_TEMP}/target-baseline/aarch64-apple-darwin/release/forge"
          candidate="${RUNNER_TEMP}/forge-pgo/optimized/aarch64-apple-darwin/release/forge"
          test -x "$baseline"
          test -x "$candidate"
          shasum -a 256 "$baseline" "$candidate"
          size "$baseline" "$candidate"

      - name: Verify byte-exact analysis and output
        shell: bash
        run: |
          set -euo pipefail
          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "$exact_dir"
          EXACT_DIR="$exact_dir" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from benchmark import write_pcm16_wave

          write_pcm16_wave(Path(os.environ["EXACT_DIR"]) / "stereo.wav", 30, 48_000, 2)
          PY

          baseline="${RUNNER_TEMP}/target-baseline/aarch64-apple-darwin/release/forge"
          candidate="${RUNNER_TEMP}/forge-pgo/optimized/aarch64-apple-darwin/release/forge"
          "$baseline" "$exact_dir/stereo.wav" --analyze --json > "$exact_dir/base.json"
          "$candidate" "$exact_dir/stereo.wav" --analyze --json > "$exact_dir/candidate.json"
          cmp "$exact_dir/base.json" "$exact_dir/candidate.json"

          "$baseline" "$exact_dir/stereo.wav" --overwrite -o "$exact_dir/base.wav"
          "$candidate" "$exact_dir/stereo.wav" --overwrite -o "$exact_dir/candidate.wav"
          cmp "$exact_dir/base.wav" "$exact_dir/candidate.wav"

          "$baseline" "$exact_dir/stereo.wav" --verify --overwrite -o "$exact_dir/base-verify.wav"
          "$candidate" "$exact_dir/stereo.wav" --verify --overwrite -o "$exact_dir/candidate-verify.wav"
          cmp "$exact_dir/base-verify.wav" "$exact_dir/candidate-verify.wav"

      - name: Run end-to-end benchmarks in both orders
        shell: bash
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/target-baseline/aarch64-apple-darwin/release/forge"
          candidate="${RUNNER_TEMP}/forge-pgo/optimized/aarch64-apple-darwin/release/forge"
          common=(
            --duration-seconds 300
            --iterations 5
            --case wav-stereo-analyze
            --case wav-stereo-normalize
            --case wav-stereo-verify
            --case wav-to-flac-verify
            --case wav-stereo-resample-normalize
            --case wav-7.1-normalize
          )
          python3 tools/benchmark.py \
            --forge "$baseline" \
            --work-dir "${RUNNER_TEMP}/bench-base-first" \
            --output apple-pgo-base-first.json "${common[@]}"
          python3 tools/benchmark.py \
            --forge "$candidate" \
            --work-dir "${RUNNER_TEMP}/bench-candidate-first" \
            --output apple-pgo-candidate-first.json "${common[@]}"
          python3 tools/benchmark.py \
            --forge "$candidate" \
            --work-dir "${RUNNER_TEMP}/bench-candidate-second" \
            --output apple-pgo-candidate-second.json "${common[@]}"
          python3 tools/benchmark.py \
            --forge "$baseline" \
            --work-dir "${RUNNER_TEMP}/bench-base-second" \
            --output apple-pgo-base-second.json "${common[@]}"

      - name: Summarize pooled medians
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import statistics
          from pathlib import Path

          files = {
              "baseline": [Path("apple-pgo-base-first.json"), Path("apple-pgo-base-second.json")],
              "candidate": [Path("apple-pgo-candidate-first.json"), Path("apple-pgo-candidate-second.json")],
          }

          def indexed(paths):
              documents = [json.loads(path.read_text()) for path in paths]
              assert all(document["passed"] for document in documents)
              return [{item["id"]: item for item in document["results"]} for document in documents]

          results = {name: indexed(paths) for name, paths in files.items()}
          assert [*results["baseline"][0]] == [*results["candidate"][0]]
          summary = {"workloads": []}
          aggregate = {"baseline_wall": 0.0, "candidate_wall": 0.0,
                       "baseline_cpu": 0.0, "candidate_cpu": 0.0}

          for case_id in results["baseline"][0]:
              base_samples = [
                  sample for document in results["baseline"]
                  for sample in document[case_id]["samples"]
              ]
              candidate_samples = [
                  sample for document in results["candidate"]
                  for sample in document[case_id]["samples"]
              ]
              base_wall = statistics.median(sample["wall_seconds"] for sample in base_samples)
              candidate_wall = statistics.median(sample["wall_seconds"] for sample in candidate_samples)
              base_cpu = statistics.median(
                  sample["user_cpu_seconds"] + sample["system_cpu_seconds"]
                  for sample in base_samples
              )
              candidate_cpu = statistics.median(
                  sample["user_cpu_seconds"] + sample["system_cpu_seconds"]
                  for sample in candidate_samples
              )
              summary["workloads"].append({
                  "id": case_id,
                  "samples": len(base_samples),
                  "baseline_wall_seconds": base_wall,
                  "candidate_wall_seconds": candidate_wall,
                  "wall_change_percent": (candidate_wall / base_wall - 1.0) * 100.0,
                  "baseline_cpu_seconds": base_cpu,
                  "candidate_cpu_seconds": candidate_cpu,
                  "cpu_change_percent": (candidate_cpu / base_cpu - 1.0) * 100.0,
              })
              aggregate["baseline_wall"] += base_wall
              aggregate["candidate_wall"] += candidate_wall
              aggregate["baseline_cpu"] += base_cpu
              aggregate["candidate_cpu"] += candidate_cpu

          summary["aggregate"] = {
              **aggregate,
              "wall_change_percent":
                  (aggregate["candidate_wall"] / aggregate["baseline_wall"] - 1.0) * 100.0,
              "cpu_change_percent":
                  (aggregate["candidate_cpu"] / aggregate["baseline_cpu"] - 1.0) * 100.0,
          }
          for name in ("canonical-profile.txt", "merged.profdata", "training.json"):
              path = Path("${{ runner.temp }}") / "forge-pgo" / name
              summary.setdefault("pgo_evidence", {})[name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          Path("apple-pgo-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: apple-pgo-benchmark-macOS-ARM64
          path: |
            apple-pgo-*.json
            ${{ runner.temp }}/forge-pgo/training.json
            ${{ runner.temp }}/forge-pgo/canonical-profile.txt
          if-no-files-found: error
          retention-days: 30
