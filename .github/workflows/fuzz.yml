name: Parser fuzzing

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "fuzz/**"
      - "src/adm.rs"
      - "src/audio_compare.rs"
      - "src/anomaly_provider.rs"
      - "src/onnx_provider.rs"
      - "src/remote_range.rs"
      - "src/compare.rs"
      - "src/container_qc.rs"
      - "src/decoder.rs"
      - "src/dsd.rs"
      - "src/dash_patch.rs"
      - "src/dash_observe.rs"
      - "src/dash_qc.rs"
      - "src/hls_qc.rs"
      - "src/isobmff_qc.rs"
      - "src/nmos_qc.rs"
      - "src/rtp_qc.rs"
      - "src/wav/reader.rs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "fuzz/**"
      - "src/adm.rs"
      - "src/audio_compare.rs"
      - "src/anomaly_provider.rs"
      - "src/onnx_provider.rs"
      - "src/remote_range.rs"
      - "src/compare.rs"
      - "src/container_qc.rs"
      - "src/decoder.rs"
      - "src/dsd.rs"
      - "src/dash_patch.rs"
      - "src/dash_observe.rs"
      - "src/dash_qc.rs"
      - "src/hls_qc.rs"
      - "src/isobmff_qc.rs"
      - "src/nmos_qc.rs"
      - "src/rtp_qc.rs"
      - "src/wav/reader.rs"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo fuzz build

      - name: Run bounded parser fuzzing
        shell: bash
        run: |
          set -euo pipefail
          for target in wave_reader container_qc adm_profile manifest_compare audio_compare dsd hls_qc dash_qc imf_qc rtp_qc nmos_qc anomaly_provider anomaly_audit onnx_provider remote_range; do
            cargo fuzz run "$target" -- -runs=1000
          done
