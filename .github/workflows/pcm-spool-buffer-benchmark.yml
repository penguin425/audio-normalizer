name: PCM spool storage benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/pcm-spool-buffer-benchmark.yml"
      - "src/decoder.rs"
      - "src/dsd.rs"
      - "src/normalize.rs"
      - "src/opus.rs"
      - "src/pcm_spool.rs"
      - "tools/benchmark.py"
      - "tools/test_benchmark.py"

permissions:
  contents: read

concurrency:
  group: pcm-spool-buffer-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          elif ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Test PCM spool and benchmark contracts
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
        run: |
          set -euo pipefail
          python3 candidate/tools/test_benchmark.py
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib pcm_spool::tests -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            pcm_spool_estimate_uses_reliable_output_domain_lengths -- --nocapture

      - name: Build exact baseline and candidate
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '-Ctarget-cpu=native' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc

      - name: Verify byte-exact FLAC and resampled output
        shell: bash
        run: |
          set -euo pipefail
          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "${exact_dir}"
          EXACT_DIR="${exact_dir}" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import write_pcm16_wave

          write_pcm16_wave(Path(os.environ["EXACT_DIR"]) / "input.wav", 60, 48_000, 2)
          PY
          ffmpeg -hide_banner -loglevel error \
            -i "${exact_dir}/input.wav" -map_metadata -1 -c:a flac \
            "${exact_dir}/input.flac"

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          "${baseline}" "${exact_dir}/input.flac" --overwrite \
            -o "${exact_dir}/base-flac.wav"
          "${candidate}" "${exact_dir}/input.flac" --overwrite \
            -o "${exact_dir}/candidate-flac.wav"
          "${candidate}" "${exact_dir}/input.flac" --jobs 1 --overwrite \
            -o "${exact_dir}/candidate-flac-one.wav"
          cmp "${exact_dir}/base-flac.wav" "${exact_dir}/candidate-flac.wav"
          cmp "${exact_dir}/candidate-flac.wav" "${exact_dir}/candidate-flac-one.wav"

          "${baseline}" "${exact_dir}/input.wav" --sample-rate 44100 --overwrite \
            -o "${exact_dir}/base-resampled.wav"
          "${candidate}" "${exact_dir}/input.wav" --sample-rate 44100 --overwrite \
            -o "${exact_dir}/candidate-resampled.wav"
          "${candidate}" "${exact_dir}/input.wav" --sample-rate 44100 --jobs 1 --overwrite \
            -o "${exact_dir}/candidate-resampled-one.wav"
          cmp "${exact_dir}/base-resampled.wav" "${exact_dir}/candidate-resampled.wav"
          cmp "${exact_dir}/candidate-resampled.wav" "${exact_dir}/candidate-resampled-one.wav"

      - name: Run interleaved short benchmarks
        shell: bash
        run: |
          set -euo pipefail
          run_benchmark() {
            local mode="$1"
            local label="$2"
            local forge="$3"
            local common=(
              --forge "${forge}"
              --ffmpeg "$(command -v ffmpeg)"
              --duration-seconds 300
              --iterations 2
              --case flac-stereo-normalize
              --case wav-stereo-resample-normalize
              --work-dir "${RUNNER_TEMP}/${label}"
              --output "${label}.json"
            )
            if [[ "${mode}" == "one" ]]; then
              RAYON_NUM_THREADS=1 python3 candidate/tools/benchmark.py "${common[@]}"
            else
              python3 candidate/tools/benchmark.py "${common[@]}"
            fi
          }

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          for mode in default one; do
            # Fine-grained B-C-C-B / C-B-B-C blocks balance runner drift while
            # preserving the strict per-case and aggregate regression gates.
            for round in 1 2 3 4; do
              if (( round % 2 == 1 )); then
                order=(base-a candidate-a candidate-b base-b)
              else
                order=(candidate-a base-a base-b candidate-b)
              fi
              for slot in "${order[@]}"; do
                if [[ "${slot}" == base-* ]]; then
                  forge="${baseline}"
                else
                  forge="${candidate}"
                fi
                run_benchmark \
                  "${mode}" "short-${mode}-${round}-${slot}" "${forge}"
              done
            done
          done

      - name: Run interleaved over-budget controls
        shell: bash
        run: |
          set -euo pipefail
          run_benchmark() {
            local mode="$1"
            local label="$2"
            local forge="$3"
            local common=(
              --forge "${forge}"
              --ffmpeg "$(command -v ffmpeg)"
              --duration-seconds 600
              --iterations 2
              --case flac-stereo-normalize
              --case wav-stereo-resample-normalize
              --work-dir "${RUNNER_TEMP}/${label}"
              --output "${label}.json"
            )
            if [[ "${mode}" == "one" ]]; then
              RAYON_NUM_THREADS=1 python3 candidate/tools/benchmark.py "${common[@]}"
            else
              python3 candidate/tools/benchmark.py "${common[@]}"
            fi
          }

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          for mode in default one; do
            # Keep the file-backed controls interleaved for the same reason as
            # the in-budget measurements above.
            for round in 1 2 3 4; do
              if (( round % 2 == 1 )); then
                order=(base-a candidate-a candidate-b base-b)
              else
                order=(candidate-a base-a base-b candidate-b)
              fi
              for slot in "${order[@]}"; do
                if [[ "${slot}" == base-* ]]; then
                  forge="${baseline}"
                else
                  forge="${candidate}"
                fi
                run_benchmark \
                  "${mode}" "long-${mode}-${round}-${slot}" "${forge}"
              done
            done
          done

      - name: Summarize pooled medians
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          summary = {"system": {}, "modes": {}, "complete": True}
          expected_reports = 16
          for mode in ("default", "one"):
              paths = sorted(Path(".").glob(f"short-{mode}-*.json"))
              if len(paths) != expected_reports:
                  summary["complete"] = False
                  summary["modes"][mode] = {
                      "missing": [
                          f"expected {expected_reports} interleaved reports, "
                          f"found {len(paths)}"
                      ]
                  }
                  continue
              documents = [
                  (path, json.loads(path.read_text(encoding="utf-8")))
                  for path in paths
              ]
              if not all(document["passed"] for _, document in documents):
                  summary["complete"] = False
              if not summary["system"]:
                  summary["system"] = documents[0][1]["system"]
              indexed = [
                  (path, {result["id"]: result for result in document["results"]})
                  for path, document in documents
              ]
              case_ids = list(indexed[0][1])
              if any(set(results) != set(case_ids) for _, results in indexed):
                  summary["complete"] = False
                  summary["modes"][mode] = {
                      "missing": ["interleaved reports contain different cases"]
                  }
                  continue
              baseline_documents = [
                  results for path, results in indexed if "-base-" in path.name
              ]
              candidate_documents = [
                  results for path, results in indexed if "-candidate-" in path.name
              ]
              if len(baseline_documents) != 8 or len(candidate_documents) != 8:
                  summary["complete"] = False
                  summary["modes"][mode] = {
                      "missing": ["interleaved binary labels are incomplete"]
                  }
                  continue
              rows = {}
              for case_id in case_ids:
                  baseline = [
                      sample
                      for results in baseline_documents
                      for sample in results[case_id]["samples"]
                  ]
                  candidate = [
                      sample
                      for results in candidate_documents
                      for sample in results[case_id]["samples"]
                  ]
                  row = {"samples_per_binary": len(baseline), "metrics": {}}
                  for metric in ("wall_seconds", "peak_rss_bytes"):
                      reducer = max if metric == "peak_rss_bytes" else statistics.median
                      base_value = reducer(sample[metric] for sample in baseline)
                      candidate_value = reducer(sample[metric] for sample in candidate)
                      row["metrics"][metric] = {
                          "baseline": base_value,
                          "candidate": candidate_value,
                          "change_percent": (candidate_value / base_value - 1.0) * 100.0,
                      }
                  base_cpu = statistics.median(
                      sample["user_cpu_seconds"] + sample["system_cpu_seconds"]
                      for sample in baseline
                  )
                  candidate_cpu = statistics.median(
                      sample["user_cpu_seconds"] + sample["system_cpu_seconds"]
                      for sample in candidate
                  )
                  row["metrics"]["total_cpu_seconds"] = {
                      "baseline": base_cpu,
                      "candidate": candidate_cpu,
                      "change_percent": (candidate_cpu / base_cpu - 1.0) * 100.0,
                  }
                  rows[case_id] = row
              summary["modes"][mode] = rows

          Path("pcm-spool-buffer-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2))
          with Path("pcm-spool-buffer-summary.md").open("w", encoding="utf-8") as output:
              output.write("## PCM spool buffer benchmark\n\n")
              if not summary["complete"]:
                  output.write("Benchmark evidence is incomplete.\n")
              for mode, cases in summary["modes"].items():
                  if "missing" in cases:
                      output.write(f"\n`{mode}` missing: {', '.join(cases['missing'])}\n")
                      continue
                  output.write(f"\n### {mode}\n\n")
                  output.write("| Case | Samples | Wall | CPU | RSS |\n")
                  output.write("|---|---:|---:|---:|---:|\n")
                  for case_id, row in cases.items():
                      metrics = row["metrics"]
                      output.write(
                          f"| {case_id} | {row['samples_per_binary']} "
                          f"| {metrics['wall_seconds']['change_percent']:+.3f}% "
                          f"| {metrics['total_cpu_seconds']['change_percent']:+.3f}% "
                          f"| {metrics['peak_rss_bytes']['change_percent']:+.3f}% |\n"
                      )
          PY
          cat pcm-spool-buffer-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pcm-spool-buffer-${{ matrix.os }}-${{ runner.arch }}
          path: |
            short-*.json
            long-*.json
            pcm-spool-buffer-summary.json
            pcm-spool-buffer-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce performance and memory gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          summary = json.loads(
              Path("pcm-spool-buffer-summary.json").read_text(encoding="utf-8")
          )
          assert summary["complete"], summary
          wall_changes = []
          cpu_changes = []
          for mode in ("default", "one"):
              for case_id, row in summary["modes"][mode].items():
                  assert row["samples_per_binary"] == 16, (
                      mode,
                      case_id,
                      "samples per binary",
                      row["samples_per_binary"],
                  )
                  metrics = row["metrics"]
                  wall = metrics["wall_seconds"]["change_percent"]
                  cpu = metrics["total_cpu_seconds"]["change_percent"]
                  rss = metrics["peak_rss_bytes"]
                  rss_delta = rss["candidate"] - rss["baseline"]
                  assert wall <= 3.0, (mode, case_id, "wall", wall)
                  assert cpu <= 3.0, (mode, case_id, "cpu", cpu)
                  assert rss_delta <= 132 * 1024 * 1024, (
                      mode,
                      case_id,
                      "RSS delta",
                      rss_delta,
                  )
                  wall_changes.append(wall)
                  cpu_changes.append(cpu)
          assert len(wall_changes) == 4, wall_changes
          assert len(cpu_changes) == 4, cpu_changes
          average_wall = statistics.fmean(wall_changes)
          average_cpu = statistics.fmean(cpu_changes)
          assert average_wall <= -2.0, ("average wall improvement", average_wall)
          assert average_cpu <= -2.0, ("average CPU improvement", average_cpu)
          print(f"average wall change: {average_wall:+.3f}%")
          print(f"average CPU change: {average_cpu:+.3f}%")
          PY

      - name: Enforce over-budget regression gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          changes = []
          for mode in ("default", "one"):
              paths = sorted(Path(".").glob(f"long-{mode}-*.json"))
              assert len(paths) == 16, (mode, "report count", len(paths))
              documents = [
                  (path, json.loads(path.read_text(encoding="utf-8")))
                  for path in paths
              ]
              assert all(document["passed"] for _, document in documents)
              indexed = [
                  (path, {result["id"]: result for result in document["results"]})
                  for path, document in documents
              ]
              case_ids = list(indexed[0][1])
              assert all(set(results) == set(case_ids) for _, results in indexed)
              baseline_documents = [
                  results for path, results in indexed if "-base-" in path.name
              ]
              candidate_documents = [
                  results for path, results in indexed if "-candidate-" in path.name
              ]
              assert len(baseline_documents) == 8
              assert len(candidate_documents) == 8
              for case_id in case_ids:
                  baseline = [
                      sample
                      for results in baseline_documents
                      for sample in results[case_id]["samples"]
                  ]
                  candidate = [
                      sample
                      for results in candidate_documents
                      for sample in results[case_id]["samples"]
                  ]
                  assert len(baseline) == 16, (mode, case_id, "baseline samples")
                  assert len(candidate) == 16, (mode, case_id, "candidate samples")
                  for metric, getter in (
                      ("wall", lambda sample: sample["wall_seconds"]),
                      (
                          "cpu",
                          lambda sample: sample["user_cpu_seconds"]
                          + sample["system_cpu_seconds"],
                      ),
                  ):
                      base_value = statistics.median(map(getter, baseline))
                      candidate_value = statistics.median(map(getter, candidate))
                      change = (candidate_value / base_value - 1.0) * 100.0
                      assert change <= 5.0, (mode, case_id, metric, change)
                      changes.append(change)
                  rss_delta = max(
                      sample["peak_rss_bytes"] for sample in candidate
                  ) - max(sample["peak_rss_bytes"] for sample in baseline)
                  assert rss_delta <= 4 * 1024 * 1024, (
                      mode,
                      case_id,
                      "RSS delta",
                      rss_delta,
                  )
          assert len(changes) == 8, changes
          average = statistics.fmean(changes)
          assert average <= 3.0, ("over-budget average regression", average)
          print(f"over-budget wall/CPU average change: {average:+.3f}%")
          PY
