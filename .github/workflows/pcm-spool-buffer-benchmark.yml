name: PCM spool and analysis pipeline benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/pcm-spool-buffer-benchmark.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/decoder.rs"
      - "src/bound_analysis.rs"
      - "src/dsd.rs"
      - "src/dsp/kwfilter.rs"
      - "src/dsp/lufs.rs"
      - "src/dsp/resample.rs"
      - "src/dsp/truepeak.rs"
      - "src/normalize.rs"
      - "src/opus.rs"
      - "src/pcm_spool.rs"
      - "tools/benchmark.py"
      - "tools/paired_benchmark.py"
      - "tools/pcm_benchmark_gate.py"
      - "tools/test_benchmark.py"
      - "tools/test_pcm_benchmark_gate.py"

permissions:
  contents: read

concurrency:
  group: pcm-spool-buffer-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  initial:
    name: initial benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: X64
          - os: macos-latest
            arch: ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          elif ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Test PCM spool, analysis pipeline, and benchmark contracts
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
        run: |
          set -euo pipefail
          python3 candidate/tools/test_benchmark.py
          python3 candidate/tools/test_pcm_benchmark_gate.py
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib pcm_spool::tests -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            pcm_spool_estimate_uses_reliable_output_domain_lengths -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            analysis_pipeline_matches_sequential_measurements_and_pcm -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            owned_streaming_is_bit_exact_and_recycles_output_storage -- --nocapture

      - name: Build exact baseline and candidate
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '-Ctarget-cpu=native' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc

      - name: Verify revision-aware byte-exact FLAC and resampled output
        shell: bash
        run: |
          set -euo pipefail
          baseline_revision="$(
            sed -n 's/^pub const MEASUREMENT_ALGORITHM_REVISION: &str = "\(.*\)";$/\1/p' \
              baseline/src/bound_analysis.rs
          )"
          candidate_revision="$(
            sed -n 's/^pub const MEASUREMENT_ALGORITHM_REVISION: &str = "\(.*\)";$/\1/p' \
              candidate/src/bound_analysis.rs
          )"
          test -n "${baseline_revision}"
          test -n "${candidate_revision}"
          require_baseline_identity=true
          if [[ "${baseline_revision}" != "${candidate_revision}" ]]; then
            if [[ "${baseline_revision}" != "forge-bs1770-5-r3" || \
                  "${candidate_revision}" != "forge-bs1770-5-r4" ]]; then
              echo "Unapproved measurement migration: ${baseline_revision} -> ${candidate_revision}" >&2
              exit 1
            fi
            require_baseline_identity=false
            echo "Using approved r3 -> r4 fixed-oracle migration fixture"
          fi

          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "${exact_dir}"
          EXACT_DIR="${exact_dir}" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import write_pcm16_wave

          write_pcm16_wave(Path(os.environ["EXACT_DIR"]) / "input.wav", 60, 48_000, 2)
          PY
          ffmpeg -hide_banner -loglevel error \
            -i "${exact_dir}/input.wav" -map_metadata -1 -c:a flac \
            "${exact_dir}/input.flac"

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          "${baseline}" "${exact_dir}/input.flac" --overwrite \
            -o "${exact_dir}/base-flac.wav"
          "${candidate}" "${exact_dir}/input.flac" --overwrite \
            -o "${exact_dir}/candidate-flac.wav"
          "${candidate}" "${exact_dir}/input.flac" --jobs 1 --overwrite \
            -o "${exact_dir}/candidate-flac-one.wav"
          cmp "${exact_dir}/candidate-flac.wav" "${exact_dir}/candidate-flac-one.wav"
          if [[ "${require_baseline_identity}" == true ]]; then
            cmp "${exact_dir}/base-flac.wav" "${exact_dir}/candidate-flac.wav"
          fi

          "${baseline}" "${exact_dir}/input.wav" --sample-rate 44100 --overwrite \
            -o "${exact_dir}/base-resampled.wav"
          "${candidate}" "${exact_dir}/input.wav" --sample-rate 44100 --overwrite \
            -o "${exact_dir}/candidate-resampled.wav"
          "${candidate}" "${exact_dir}/input.wav" --sample-rate 44100 --jobs 1 --overwrite \
            -o "${exact_dir}/candidate-resampled-one.wav"
          cmp "${exact_dir}/candidate-resampled.wav" "${exact_dir}/candidate-resampled-one.wav"
          if [[ "${require_baseline_identity}" == true ]]; then
            cmp "${exact_dir}/base-resampled.wav" "${exact_dir}/candidate-resampled.wav"
          fi

      - name: Run paired short benchmarks
        shell: bash
        run: |
          set -euo pipefail
          run_benchmark() {
            local mode="$1"
            local common=(
              --baseline-forge "${RUNNER_TEMP}/target-baseline/release/forge"
              --candidate-forge "${RUNNER_TEMP}/target-candidate/release/forge"
              --ffmpeg "$(command -v ffmpeg)"
              --duration-seconds 300
              --rounds 8
              --work-dir "${RUNNER_TEMP}/paired-short-${mode}"
              --output "short-${mode}.json"
            )
            if [[ "${mode}" == "one" ]]; then
              RAYON_NUM_THREADS=1 \
                python3 candidate/tools/paired_benchmark.py "${common[@]}"
            else
              python3 candidate/tools/paired_benchmark.py "${common[@]}"
            fi
          }

          for mode in default one; do
            run_benchmark "${mode}"
          done

      - name: Run paired over-budget controls
        shell: bash
        run: |
          set -euo pipefail
          run_benchmark() {
            local mode="$1"
            local common=(
              --baseline-forge "${RUNNER_TEMP}/target-baseline/release/forge"
              --candidate-forge "${RUNNER_TEMP}/target-candidate/release/forge"
              --ffmpeg "$(command -v ffmpeg)"
              --duration-seconds 600
              --rounds 8
              --work-dir "${RUNNER_TEMP}/paired-long-${mode}"
              --output "long-${mode}.json"
            )
            if [[ "${mode}" == "one" ]]; then
              RAYON_NUM_THREADS=1 \
                python3 candidate/tools/paired_benchmark.py "${common[@]}"
            else
              python3 candidate/tools/paired_benchmark.py "${common[@]}"
            fi
          }

          for mode in default one; do
            run_benchmark "${mode}"
          done


      - name: Plan fresh-runner timing confirmations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "${BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${HEAD_SHA}"
          test "${RUNNER_ARCH}" = "${{ matrix.arch }}"
          python3 candidate/tools/pcm_benchmark_gate.py plan \
            --initial-dir . \
            --baseline-root baseline \
            --candidate-root candidate \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --output pcm-spool-buffer-fresh-plan.json \
            --summary-json pcm-spool-buffer-summary.json \
            --summary-markdown pcm-spool-buffer-summary.md
          cat pcm-spool-buffer-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload initial benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pcm-spool-buffer-initial-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            short-*.json
            long-*.json
            pcm-spool-buffer-fresh-plan.json
            pcm-spool-buffer-summary.json
            pcm-spool-buffer-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce initial-runner memory gates
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 candidate/tools/pcm_benchmark_gate.py enforce-initial \
            --plan pcm-spool-buffer-fresh-plan.json \
            --initial-dir . \
            --baseline-root baseline \
            --candidate-root candidate \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}"

  fresh:
    # Use a workflow-specific final check name so it cannot be confused with
    # another benchmark workflow if branch protection is expanded later. The
    # initial job remains an immediate, non-confirmed RSS gate and a producer
    # of SHA-bound raw evidence.
    name: PCM spool benchmark (${{ matrix.os }})
    needs: initial
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: X64
          - os: macos-latest
            arch: ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Download initial benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: pcm-spool-buffer-initial-${{ matrix.os }}-${{ matrix.arch }}
          path: initial-evidence

      - name: Validate bound confirmation plan
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "${BASE_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${HEAD_SHA}"
          test "${RUNNER_ARCH}" = "${{ matrix.arch }}"
          python3 candidate/tools/pcm_benchmark_gate.py validate-plan \
            --plan initial-evidence/pcm-spool-buffer-fresh-plan.json \
            --initial-dir initial-evidence \
            --baseline-root baseline \
            --candidate-root candidate \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Install Rust 1.97.0 for requested confirmation
        if: steps.plan.outputs.required == 'true'
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install ffmpeg for requested confirmation
        if: steps.plan.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          elif ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Build exact baseline and candidate for requested confirmation
        if: steps.plan.outputs.required == 'true'
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '-Ctarget-cpu=native' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc

      - name: Run requested fresh-runner confirmations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ffmpeg_path="$(command -v ffmpeg || command -v false)"
          python3 candidate/tools/pcm_benchmark_gate.py run-confirmations \
            --plan initial-evidence/pcm-spool-buffer-fresh-plan.json \
            --initial-dir initial-evidence \
            --baseline-root baseline \
            --candidate-root candidate \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --paired-script candidate/tools/paired_benchmark.py \
            --baseline-forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --candidate-forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --ffmpeg "${ffmpeg_path}" \
            --work-dir "${RUNNER_TEMP}/pcm-fresh-confirmation" \
            --confirmation-dir fresh-evidence \
            --evidence-output fresh-evidence/pcm-spool-buffer-fresh-confirmation.json \
            --summary-markdown fresh-evidence/pcm-spool-buffer-fresh-confirmation.md

      - name: Summarize fresh-runner confirmation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="fresh-evidence/pcm-spool-buffer-fresh-confirmation.md"
          if [[ -f "${summary}" ]]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Fresh-runner confirmation evidence is missing." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload fresh-runner confirmation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pcm-spool-buffer-fresh-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            initial-evidence/pcm-spool-buffer-fresh-plan.json
            fresh-evidence/*.json
            fresh-evidence/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce fresh-runner timing gates
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 candidate/tools/pcm_benchmark_gate.py enforce-fresh \
            --plan initial-evidence/pcm-spool-buffer-fresh-plan.json \
            --initial-dir initial-evidence \
            --baseline-root baseline \
            --candidate-root candidate \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --confirmation-dir fresh-evidence \
            --evidence fresh-evidence/pcm-spool-buffer-fresh-confirmation.json
