      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install checksum-pinned Rust 1.97.0 and LLVM PGO tools
        env:
          RUSTUP_INIT_SHA256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
          RUSTUP_INIT_VERSION: 1.28.2
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          test "$(uname -m)" = aarch64
          rustup_init="${RUNNER_TEMP}/rustup-init"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$rustup_init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/aarch64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${rustup_init}" | sha256sum --check --strict -
          chmod 0755 "$rustup_init"
          "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain 1.97.0
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          "${CARGO_HOME}/bin/rustup" component add llvm-tools-preview
          "${CARGO_HOME}/bin/rustc" --version | grep -Fx 'rustc 1.97.0 (2d8144b78 2026-07-07)'

      - name: Download published ARM64 build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-aarch64
          path: actual

      - name: Download ARM64 PGO profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-pgo-profile-linux-aarch64
          path: actual-profile

      - name: Rebuild from the recorded ARM64 PGO input and compare
        env:
          FORGE_PGO_FEATURES: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
          FORGE_PGO_RUSTFLAGS: -C target-cpu=generic --remap-path-prefix=${{ github.workspace }}=/workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --target aarch64-unknown-linux-gnu \
            --features opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
          FORGE_PGO_PROFILE_INPUT="$GITHUB_WORKSPACE/actual-profile/forge-v${{ needs.validate.outputs.version }}-linux-aarch64.pgo-profile.txt" \
            tools/build-pgo-forge.sh aarch64-unknown-linux-gnu
          cp \
            target/forge-pgo-aarch64-unknown-linux-gnu/optimized/aarch64-unknown-linux-gnu/release/forge \
            target/aarch64-unknown-linux-gnu/release/forge
          mkdir reproduced reproduced-extracted
          tools/package-linux-release.sh \
            "${{ needs.validate.outputs.version }}" \
            aarch64-unknown-linux-gnu \
            "${{ needs.validate.outputs.source-date-epoch }}" \
            reproduced \
            aarch64
          archive="reproduced/forge-v${{ needs.validate.outputs.version }}-linux-aarch64.tar.gz"
          python3 tools/check-linux-native-abi.py \
            --architecture aarch64 \
            --archive "$archive" \
            --extract-to reproduced-extracted \
            --expected-root "forge-v${{ needs.validate.outputs.version }}-linux-aarch64"
          cmp \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-aarch64.tar.gz" \
            "$archive"
          sha256sum \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-aarch64.tar.gz" \
            "$archive"

  reproducible-macos-aarch64:
    name: Reproduce macOS ARM64 PGO CLI
    needs: [validate, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0 and matching LLVM PGO tools
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: aarch64-apple-darwin
          components: llvm-tools-preview

      - name: Download published Apple Silicon candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-macos-aarch64
          path: actual

      - name: Download published Apple Silicon PGO profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: apple-pgo-profile-macos-aarch64
          path: actual-profile

      - name: Independently rebuild and compare the PGO CLI
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          FORGE_PGO_FEATURES: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service
          FORGE_PGO_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -Ctarget-feature=+neon,+aes,+sha2
        shell: bash
        run: |
          set -euo pipefail
          tools/build-pgo-forge.sh aarch64-apple-darwin
          mkdir -p actual/extracted
          tar -xzf \
            "actual/forge-v${{ needs.validate.outputs.version }}-macos-aarch64.tar.gz" \
            -C actual/extracted
          actual_forge="actual/extracted/forge-v${{ needs.validate.outputs.version }}-macos-aarch64/forge"
          reproduced_forge="target/forge-pgo-aarch64-apple-darwin/optimized/aarch64-apple-darwin/release/forge"
          reproduced_profile="target/forge-pgo-aarch64-apple-darwin/canonical-profile.txt"
          cmp "$actual_forge" "$reproduced_forge"
          cmp actual-profile/canonical-profile.txt "$reproduced_profile"
          shasum -a 256 \
            "$actual_forge" \
            "$reproduced_forge" \
            actual-profile/canonical-profile.txt \
            "$reproduced_profile"

  package-crate:
    name: Package the crates.io source archive
    needs: validate
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Create and validate the exact Cargo registry package
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          crate="target/package/forge-normalizer-${{ needs.validate.outputs.version }}.crate"
          python3 tools/verify-registry-artifacts.py \
            --verify-crate "$crate" \
            --version "${{ needs.validate.outputs.version }}" >/dev/null
          cp "$crate" .

      - name: Upload the exact Cargo registry package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-rust-crate
          path: forge-normalizer-${{ needs.validate.outputs.version }}.crate
          if-no-files-found: error
          retention-days: 7

  wasm:
    name: Build browser and npm WASM packages
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install the pinned Node and npm release toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Verify the npm trusted-publishing CLI floor
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0

      - name: Install Rust 1.97.0 and the WebAssembly target
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build and test the browser package
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        run: |
          mkdir first second
          tools/build-wasm-package.sh "${{ needs.validate.outputs.version }}" first
          node wasm/test/smoke.mjs
          tools/build-wasm-package.sh "${{ needs.validate.outputs.version }}" second
          cmp \
            "first/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz" \
            "second/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz"
          cmp \
            "first/forge-normalizer-wasm-${{ needs.validate.outputs.version }}.tgz" \
            "second/forge-normalizer-wasm-${{ needs.validate.outputs.version }}.tgz"
          mv "first/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz" .
          mv "first/forge-normalizer-wasm-${{ needs.validate.outputs.version }}.tgz" .

      - name: Upload browser and npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-wasm-packages
          path: |
            forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz
            forge-normalizer-wasm-${{ needs.validate.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    name: Assemble the exact release bundle
    needs:
      - validate
      - build
      - build-linux
      - build-linux-wheel
      - smoke-linux-wheel-floor
      - reproducible-linux-wheel
      - build-linux-v3
      - reproducible-linux
      - reproducible-linux-aarch64
      - reproducible-macos-aarch64
      - package-crate
      - wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Download Linux x86-64 native archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-x86_64
          path: incoming/linux-x86_64

      - name: Download Linux ARM64 native archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-aarch64
          path: incoming/linux-aarch64

      - name: Download supplemental Linux x86-64-v3 archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-x86_64-v3
          path: incoming/linux-x86_64-v3

      - name: Download Windows release pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-windows-x86_64
          path: incoming/windows-x86_64

      - name: Download macOS Intel release pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-macos-x86_64
          path: incoming/macos-x86_64

      - name: Download macOS ARM64 release pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-macos-aarch64
          path: incoming/macos-aarch64

      - name: Download Linux x86-64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-python-linux-x86_64
          path: incoming/python-linux-x86_64

      - name: Download Linux ARM64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-python-linux-aarch64
          path: incoming/python-linux-aarch64

      - name: Download browser and npm WASM packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-wasm-packages
          path: incoming/wasm

      - name: Download Cargo registry package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-rust-crate
          path: incoming/crate

      - name: Stage only the exact producer file sets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          version = os.environ["VERSION"]
          incoming = Path("incoming")
          output = Path("dist")
          output.mkdir()
          groups = {
              "linux-x86_64": [f"forge-v{version}-linux-x86_64.tar.gz"],
              "linux-aarch64": [f"forge-v{version}-linux-aarch64.tar.gz"],
              "linux-x86_64-v3": [f"forge-v{version}-linux-x86_64-v3.tar.gz"],
              "windows-x86_64": [
                  f"forge-v{version}-windows-x86_64.zip",
                  f"forge_normalizer-{version}-py3-none-win_amd64.whl",
              ],
              "macos-x86_64": [
                  f"forge-v{version}-macos-x86_64.tar.gz",
                  f"forge_normalizer-{version}-py3-none-macosx_10_12_x86_64.whl",
              ],
              "macos-aarch64": [
                  f"forge-v{version}-macos-aarch64.tar.gz",
                  f"forge_normalizer-{version}-py3-none-macosx_11_0_arm64.whl",
              ],
              "python-linux-x86_64": [
                  f"forge_normalizer-{version}-py3-none-manylinux_2_34_x86_64.whl",
              ],
              "python-linux-aarch64": [
                  f"forge_normalizer-{version}-py3-none-manylinux_2_34_aarch64.whl",
              ],
              "wasm": [
                  f"forge-v{version}-wasm-web.tar.gz",
                  f"forge-normalizer-wasm-{version}.tgz",
              ],
              "crate": [f"forge-normalizer-{version}.crate"],
          }
          for group, expected in groups.items():
              root = incoming / group
              root_metadata = root.lstat()
              if stat.S_ISLNK(root_metadata.st_mode) or not stat.S_ISDIR(root_metadata.st_mode):
                  raise SystemExit(f"producer {group} root is not a real directory")
              entries = sorted(root.iterdir(), key=lambda item: item.name)
              actual = [entry.name for entry in entries]
              if actual != sorted(expected):
                  raise SystemExit(
                      f"producer {group} file set mismatch: "
                      f"expected={sorted(expected)!r}, actual={actual!r}"
                  )
              for entry in entries:
                  metadata = entry.lstat()
                  if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                      raise SystemExit(f"producer {group} contains a non-regular file: {entry.name}")
                  destination = output / entry.name
                  if destination.exists():
                      raise SystemExit(f"duplicate release filename: {entry.name}")
                  shutil.copyfile(entry, destination, follow_symlinks=False)
          PY

      - name: Generate package-manager manifests
        shell: bash
        run: tools/generate-package-metadata.sh "${{ needs.validate.outputs.version }}" dist

      - name: Validate local registry payload metadata
        shell: bash
        run: >-
          python3 tools/verify-registry-artifacts.py
          --artifact-dir dist
          --version "${{ needs.validate.outputs.version }}"
          --state local

      - name: Install checksum-pinned Syft
        env:
          SYFT_VERSION: "1.49.0"
          SYFT_ARCHIVE_SHA256: "7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe"
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/syft-${SYFT_VERSION}"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" syft
          chmod 0755 "$install_dir/syft"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Generate normalized SPDX and CycloneDX SBOMs per artifact
        shell: bash
        run: >-
          python3 tools/release_manifest.py generate-sboms
          --input-dir dist
          --version "${{ needs.validate.outputs.version }}"
          --source-date-epoch "${{ needs.validate.outputs.source-date-epoch }}"

      - name: Finalize and verify the pre-attestation manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_manifest.py finalize \
            --input-dir dist \
            --version "${{ needs.validate.outputs.version }}" \
            --source-date-epoch "${{ needs.validate.outputs.source-date-epoch }}"
          python3 tools/release_manifest.py verify \
            --input-dir dist \
            --version "${{ needs.validate.outputs.version }}"

      - name: Upload the read-only assembled bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-release-assembled
          path: dist
          if-no-files-found: error
          retention-days: 90

  attest-release:
    name: Attest the exact release subject set
    needs: [validate, assemble-release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the assembled bundle by exact producer name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-release-assembled
          path: dist

      - name: Verify the pre-attestation bundle
        run: >-
          python3 tools/release_manifest.py verify
          --input-dir dist
          --version "${{ needs.validate.outputs.version }}"

      - name: Generate one SLSA statement for the exact subject set
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Bind and cryptographically verify the SLSA bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          provenance="forge-v${{ needs.validate.outputs.version }}.slsa.jsonl"
          cp "${{ steps.provenance.outputs.bundle-path }}" "dist/${provenance}"
          python3 tools/release_manifest.py finalize \
            --input-dir dist \
            --version "${{ needs.validate.outputs.version }}" \
            --source-date-epoch "${{ needs.validate.outputs.source-date-epoch }}" \
            --slsa-bundle "$provenance"
          python3 tools/release_manifest.py verify \
            --input-dir dist \
            --version "${{ needs.validate.outputs.version }}"
          while read -r _ artifact; do
            gh attestation verify "dist/${artifact#./}" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "dist/${provenance}" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done < dist/SHA256SUMS

      - name: Upload the fully attested release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-release-final
          path: dist
          if-no-files-found: error
          retention-days: 90

  publish-github:
    name: Publish the immutable GitHub Release
    needs: [validate, attest-release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: forge-release-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Bind the release bundle outside the checkout
        shell: bash
        run: printf 'RELEASE_DIST=%s/release-dist\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - id: release-policy-token
        name: Acquire a short-lived fail-closed release-policy token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FORGE_RELEASE_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORGE_RELEASE_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          # GitHub discloses ruleset bypass actors only to a caller with
          # ruleset write access. The helper uses this token for GET requests
          # only; release mutations continue to use the built-in token.
          permission-administration: write

      - name: Download the fully attested bundle by exact producer name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-release-final
          path: ${{ runner.temp }}/release-dist

      - name: Revalidate and publish through the one-way state machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_POLICY_TOKEN: ${{ steps.release-policy-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_manifest.py verify \
            --input-dir "$RELEASE_DIST" \
            --version "${{ needs.validate.outputs.version }}"
          python3 tools/publish-github-release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA" \
            --release-dir "$RELEASE_DIST" \
            --manifest "$RELEASE_DIST/RELEASE-MANIFEST.json" \
            --title "Forge $GITHUB_REF_NAME" \
            --timeout 300

  publish-pypi:
    name: Publish exact wheels to PyPI with OIDC
    needs: [validate, publish-github]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: pypi
    concurrency:
      group: forge-pypi-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Bind the release bundle outside the checkout
        shell: bash
        run: printf 'RELEASE_DIST=%s/release-dist\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Download the exact attested registry source bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-release-final
          path: ${{ runner.temp }}/release-dist

      - id: registry-preflight
        name: Verify the manifest and reconcile PyPI before mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_manifest.py verify \
            --input-dir "$RELEASE_DIST" \
            --version "${{ needs.validate.outputs.version }}"
          python3 tools/verify-registry-artifacts.py \
            --artifact-dir "$RELEASE_DIST" \
            --version "${{ needs.validate.outputs.version }}" \
            --registry pypi \
            --state pre > "$RUNNER_TEMP/registry-preflight.json"
          state="$(jq -r '.registries.pypi.state' "$RUNNER_TEMP/registry-preflight.json")"
          test "$state" = absent || test "$state" = exact
          echo "state=$state" >> "$GITHUB_OUTPUT"
          mkdir pypi-dist
          jq -r '.assets[] | select(.kind == "python-wheel") | .name' \
            "$RELEASE_DIST/RELEASE-MANIFEST.json" |
            while IFS= read -r wheel; do
              cp "$RELEASE_DIST/${wheel}" pypi-dist/
            done
          test "$(find pypi-dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Publish the previously absent wheel set
        if: steps.registry-preflight.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist
          skip-existing: false
          attestations: true
          print-hash: true

      - name: Require the exact PyPI post-state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 tools/verify-registry-artifacts.py \
              --artifact-dir "$RELEASE_DIST" \
              --version "${{ needs.validate.outputs.version }}" \
              --registry pypi \
              --state post > "$RUNNER_TEMP/registry-post.json"; then
              exit 0
            fi
            if [[ "$attempt" != 6 ]]; then sleep 10; fi
          done
          exit 1

  publish-npm:
    name: Publish the exact WASM package to npm with OIDC
    needs: [validate, publish-github]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: npm
    concurrency:
      group: forge-npm-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Bind the release bundle outside the checkout
        shell: bash
        run: printf 'RELEASE_DIST=%s/release-dist\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install the pinned npm trusted-publishing toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download the exact attested registry source bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-release-final
          path: ${{ runner.temp }}/release-dist

      - id: registry-preflight
        name: Verify the manifest and reconcile npm before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          python3 tools/release_manifest.py verify \
            --input-dir "$RELEASE_DIST" \
            --version "${{ needs.validate.outputs.version }}"
          python3 tools/verify-registry-artifacts.py \
            --artifact-dir "$RELEASE_DIST" \
            --version "${{ needs.validate.outputs.version }}" \
            --registry npm \
            --state pre > "$RUNNER_TEMP/registry-preflight.json"
          state="$(jq -r '.registries.npm.state' "$RUNNER_TEMP/registry-preflight.json")"
          test "$state" = absent || test "$state" = exact
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish the previously absent npm package
        if: steps.registry-preflight.outputs.state == 'absent'
        shell: bash
        run: >-
          npm publish
          "$RELEASE_DIST/forge-normalizer-wasm-${{ needs.validate.outputs.version }}.tgz"
          --access public
          --provenance

      - name: Require the exact npm post-state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 tools/verify-registry-artifacts.py \
              --artifact-dir "$RELEASE_DIST" \
              --version "${{ needs.validate.outputs.version }}" \
              --registry npm \
              --state post > "$RUNNER_TEMP/registry-post.json"; then
              exit 0
            fi
            if [[ "$attempt" != 6 ]]; then sleep 10; fi
          done
          exit 1

  publish-crates:
    name: Publish the exact Rust crate with short-lived OIDC
    needs: [validate, publish-github]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: crates-io
    concurrency:
      group: forge-crates-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Bind the release bundle outside the checkout
        shell: bash
        run: printf 'RELEASE_DIST=%s/release-dist\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Download the exact attested registry source bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-release-final
          path: ${{ runner.temp }}/release-dist

      - id: registry-preflight
        name: Verify the manifest, package bytes, and crates.io pre-state
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_manifest.py verify \
            --input-dir "$RELEASE_DIST" \
            --version "${{ needs.validate.outputs.version }}"
          python3 tools/verify-registry-artifacts.py \
            --artifact-dir "$RELEASE_DIST" \
            --version "${{ needs.validate.outputs.version }}" \
            --registry crates \
            --state pre > "$RUNNER_TEMP/registry-preflight.json"
          state="$(jq -r '.registries.crates.state' "$RUNNER_TEMP/registry-preflight.json")"
          test "$state" = absent || test "$state" = exact
          if [[ "$state" == absent ]]; then
            cargo package --locked --no-verify
            cmp \
              "target/package/forge-normalizer-${{ needs.validate.outputs.version }}.crate" \
              "$RELEASE_DIST/forge-normalizer-${{ needs.validate.outputs.version }}.crate"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - id: crates-auth
        name: Acquire a crate-scoped short-lived token
        if: steps.registry-preflight.outputs.state == 'absent'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the previously absent crate
        if: steps.registry-preflight.outputs.state == 'absent'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        shell: bash
        run: |
          set -euo pipefail
          cargo publish --locked --no-verify
          cmp \
            "target/package/forge-normalizer-${{ needs.validate.outputs.version }}.crate" \
            "$RELEASE_DIST/forge-normalizer-${{ needs.validate.outputs.version }}.crate"

      - name: Require the exact crates.io post-state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 tools/verify-registry-artifacts.py \
              --artifact-dir "$RELEASE_DIST" \
              --version "${{ needs.validate.outputs.version }}" \
              --registry crates \
              --state post > "$RUNNER_TEMP/registry-post.json"; then
              exit 0
            fi
            if [[ "$attempt" != 6 ]]; then sleep 10; fi
          done
          exit 1
