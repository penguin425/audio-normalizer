      - "schema/multi-delivery-report-v1.schema.json"
      - "schema/segment-normalization-request-v1.schema.json"
      - "schema/segment-normalization-plan-v1.schema.json"
      - "schema/segment-normalization-report-v1.schema.json"
      - "schema/ac4-adapter-request-v1.schema.json"
      - "schema/ac4-adapter-response-v1.schema.json"
      - "schema/ac4-adapter-report-v1.schema.json"
      - "schema/mpegh-adapter-request-v1.schema.json"
      - "schema/mpegh-adapter-response-v1.schema.json"
      - "schema/mpegh-adapter-report-v1.schema.json"
      - "schema/dts-adapter-request-v1.schema.json"
      - "schema/dts-adapter-response-v1.schema.json"
      - "schema/dts-adapter-report-v1.schema.json"
