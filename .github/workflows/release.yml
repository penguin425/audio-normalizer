name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/release.yml"
      - "README.md"
      - "PERFORMANCE.md"
      - "LICENSE"
      - "include/forge_normalizer.h"
      - "C-API.md"
