name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Match tag to Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            archive: tar
            library: libforge_normalizer.so
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            archive: zip
            library: forge_normalizer.dll
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            archive: tar
            library: libforge_normalizer.dylib
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
            archive: tar
            library: libforge_normalizer.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --locked --release --target ${{ matrix.target }} --features opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin

      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          staging="forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/forge" \
             "target/${{ matrix.target }}/release/forge-live" \
             "target/${{ matrix.target }}/release/forge-compare" \
             "target/${{ matrix.target }}/release/forge-container-qc" \
             "target/${{ matrix.target }}/release/forge-presentation-qc" \
             "target/${{ matrix.target }}/release/forge-sadm-qc" \
             "target/${{ matrix.target }}/release/forge-dialogue-provider" "$staging/"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/forge-live.clap"
          if [[ "${{ matrix.asset }}" == "linux-x86_64" ]]; then
            cp -R plugins/forge-live.lv2 "$staging/"
            cp "target/${{ matrix.target }}/release/libforge_normalizer.so" \
               "$staging/forge-live.lv2/forge_live.so"
          fi
          cp README.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forge.exe","target/${{ matrix.target }}/release/forge-live.exe","target/${{ matrix.target }}/release/forge-compare.exe","target/${{ matrix.target }}/release/forge-container-qc.exe","target/${{ matrix.target }}/release/forge-presentation-qc.exe","target/${{ matrix.target }}/release/forge-sadm-qc.exe","target/${{ matrix.target }}/release/forge-dialogue-provider.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/forge-live.clap"
          Copy-Item README.md, LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: forge-${{ matrix.asset }}
          path: forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: forge-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        shell: bash
        run: sha256sum forge-* > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/forge-*
            dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Forge $TAG"
