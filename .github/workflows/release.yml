      - "tests/fixtures/ffmpeg_bridge_consumer.c"
      - "tools/test-host-adapters.sh"
      - "tools/test-vst3-adapter.sh"
      - "tools/test-au-adapter.sh"
      - "python/**"
      - "wasm/**"
      - "src/c_api.rs"
