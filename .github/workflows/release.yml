      - "src/isobmff_loudness_repair.rs"
      - "src/bin/forge-metadata-repair.rs"
      - "schema/metadata-repair-request-v1.schema.json"
      - "schema/metadata-repair-report-v1.schema.json"
      - "METADATA-REPAIR.md"
      - "src/anomaly_provider.rs"
      - "src/bin/forge-anomaly-provider.rs"
      - "src/bin/forge-onnx-provider.rs"
