      # Rust source, dependency, and build-script changes intentionally run the
      # Linux wheel ABI, baseline-CPU, and reproducibility release gates.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never interrupt an immutable tag release. A newer pull-request head makes
  # an older dry-run obsolete, so release its scarce macOS runners promptly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-date-epoch: ${{ steps.version.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Select Python 3.12 for workflow structure checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-locked workflow structure checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          workflow_check_root="${RUNNER_TEMP}/forge-workflow-check"
          python3 -m venv "$workflow_check_root"
          workflow_check_python="$workflow_check_root/bin/python"
          "$workflow_check_python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --require-hashes \
            --only-binary=:all: \
            -r tools/workflow-check-requirements.lock
          echo "FORGE_WORKFLOW_CHECK_PYTHON=$workflow_check_python" >> "$GITHUB_ENV"

      - id: version
        name: Match tag to Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Native release metadata requires numeric MAJOR.MINOR.PATCH without leading zeros: ${version}"
            exit 1
          fi
          python_version="$(
            python3 -c \
              "import runpy; print(runpy.run_path('python/src/forge_normalizer/_version.py')['__version__'])"
          )"
          if [[ "$python_version" != "$version" ]]; then
            echo "::error::Python package version ${python_version} does not match Cargo.toml version ${version}"
            exit 1
          fi
          wasm_version="$(
            cargo metadata --manifest-path wasm/Cargo.toml --no-deps --format-version 1 |
              jq -r '.packages[0].version'
          )"
          if [[ "$wasm_version" != "$version" ]]; then
            echo "::error::WASM package version ${wasm_version} does not match Cargo.toml version ${version}"
            exit 1
          fi
          npm_version="$(jq -r '.version' wasm/package/package.json)"
          if [[ "$npm_version" != "$version" ]]; then
            echo "::error::npm package version ${npm_version} does not match Cargo.toml version ${version}"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
              echo "::error::Release ${GITHUB_REF_NAME} must be an annotated tag"
              exit 1
            fi
            if [[ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Release ${GITHUB_REF_NAME} does not resolve to the checked-out commit"
              exit 1
            fi
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::Release ${GITHUB_REF_NAME} must point to a commit on protected main"
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate crates.io package metadata and contents
        run: tools/check-release-readiness.sh "${{ steps.version.outputs.version }}"

      - name: Test the native-package and Linux ABI release gates
        run: |
          "$FORGE_WORKFLOW_CHECK_PYTHON" -m unittest \
            tools/test_workflow_pins.py \
            tools/test_linux_wheel_abi.py \
            tools/test_linux_native_abi.py \
            tools/test_native_package_metadata.py \
            tools/test_publish_github_release.py \
            tools/test_registry_artifacts.py \
            tools/test_release_content.py \
            tools/test_release_manifest.py
          "$FORGE_WORKFLOW_CHECK_PYTHON" -m compileall -q \
            tools/build-python-wheel.py \
            tools/check-linux-native-abi.py \
            tools/check-linux-wheel-abi.py \
            tools/check-workflow-pins.py \
            tools/native_package_metadata.py \
            tools/publish-github-release.py \
            tools/release_manifest.py \
            tools/verify-registry-artifacts.py \
            tools/run-pinned-container.py

  build-linux:
    name: Build portable linux-${{ matrix.architecture }} archive
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
            cflags: -O2 -march=x86-64 -mtune=generic
            target_cpu: x86-64
            rustup_host: x86_64-unknown-linux-gnu
            rustup_sha256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:ad74e53b713f3b07d8c889c526dc0c6500da9827b45e38739570875fef52e28f
            cflags: -O2 -march=armv8-a -mtune=generic
            target_cpu: generic
            rustup_host: aarch64-unknown-linux-gnu
            rustup_sha256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
    runs-on: ${{ matrix.runner }}
    container:
      # Build below the published glibc 2.34 runtime floor and retain the
      # architecture's baseline CPU contract. Runtime acceptance is separate.
      image: ${{ matrix.image }}
    env:
      CARGO_HOME: /tmp/forge-cargo
      CARGO_INCREMENTAL: "0"
      CFLAGS: ${{ matrix.cflags }}
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/manylinux-cmake-toolchain.cmake
      CXXFLAGS: ${{ matrix.cflags }}
      LC_ALL: C.UTF-8
      RUSTFLAGS: -C target-cpu=${{ matrix.target_cpu }} --remap-path-prefix=${{ github.workspace }}=/workspace
      RUSTUP_HOME: /tmp/forge-rustup
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Verify the pinned build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          test "$(uname -m)" = "${{ matrix.architecture }}"
          command -v cc cmake pkg-config python3 readelf >/dev/null

      - name: Install checksum-pinned Rust 1.97.0 and LLVM PGO tools
        env:
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_sha256 }}
          RUSTUP_INIT_VERSION: 1.28.2
        shell: bash
        run: |
          set -euo pipefail
          rustup_init="${RUNNER_TEMP}/rustup-init"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$rustup_init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/${{ matrix.rustup_host }}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${rustup_init}" | sha256sum --check --strict -
          chmod 0755 "$rustup_init"
          "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain 1.97.0
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          "${CARGO_HOME}/bin/rustup" component add llvm-tools-preview
          "${CARGO_HOME}/bin/rustc" --version | grep -Fx 'rustc 1.97.0 (2d8144b78 2026-07-07)'

      - name: Build the portable release set
        shell: bash
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --features opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak

      - name: Apply reproducible PGO to the portable normalizer CLI
        env:
          FORGE_PGO_FEATURES: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
          FORGE_PGO_RUSTFLAGS: -C target-cpu=${{ matrix.target_cpu }} --remap-path-prefix=${{ github.workspace }}=/workspace
        shell: bash
        run: |
          set -euo pipefail
          tools/build-pgo-forge.sh "${{ matrix.target }}"
          cp \
            "target/forge-pgo-${{ matrix.target }}/optimized/${{ matrix.target }}/release/forge" \
            "target/${{ matrix.target }}/release/forge"
          cp \
            "target/forge-pgo-${{ matrix.target }}/canonical-profile.txt" \
            "forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.pgo-profile.txt"
          cp \
            "target/forge-pgo-${{ matrix.target }}/training.json" \
            "forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.pgo-training.json"

      - name: Upload portable Linux PGO build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-pgo-profile-linux-${{ matrix.architecture }}
          path: |
            forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.pgo-profile.txt
            forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.pgo-training.json
          if-no-files-found: error
          retention-days: 7

      - name: Package and verify the portable native archive
        shell: bash
        run: |
          set -euo pipefail
          tools/package-linux-release.sh \
            "${{ needs.validate.outputs.version }}" \
            "${{ matrix.target }}" \
            "${{ needs.validate.outputs.source-date-epoch }}" \
            . \
            "${{ matrix.architecture }}"
          mkdir extracted
          root_name="forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}"
          prefix="extracted/${root_name}"
          python3 tools/check-linux-native-abi.py \
            --architecture "${{ matrix.architecture }}" \
            --archive "${root_name}.tar.gz" \
            --extract-to extracted \
            --expected-root "$root_name"
          tools/test-native-package.sh "$prefix" "${{ needs.validate.outputs.version }}"

      - name: Upload packaged portable Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-linux-${{ matrix.architecture }}
          path: forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            archive: zip
            library: forge_normalizer.dll
            wheel-platform: win_amd64
            features: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            archive: tar
            library: libforge_normalizer.dylib
            wheel-platform: macosx_10_12_x86_64
            features: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service
            rustflags: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
            archive: tar
            library: libforge_normalizer.dylib
            wheel-platform: macosx_11_0_arm64
            features: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service
            rustflags: -Ctarget-feature=+neon,+aes,+sha2
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Initialize the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install matching LLVM PGO tools
        if: matrix.asset == 'macos-aarch64'
        run: rustup component add llvm-tools-preview

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-locked Python wheel build tools
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r tools/python-wheel-build-requirements.lock

      - name: Build release binary
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace ${{ matrix.rustflags }}
        run: cargo build --locked --release --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Apply reproducible PGO to the normalizer CLI
        if: matrix.asset == 'macos-aarch64'
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          FORGE_PGO_FEATURES: ${{ matrix.features }}
          FORGE_PGO_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          tools/build-pgo-forge.sh "${{ matrix.target }}"
          cp \
            "target/forge-pgo-${{ matrix.target }}/optimized/${{ matrix.target }}/release/forge" \
            "target/${{ matrix.target }}/release/forge"

      - name: Upload Apple Silicon PGO profile evidence
        if: matrix.asset == 'macos-aarch64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: apple-pgo-profile-macos-aarch64
          path: |
            target/forge-pgo-${{ matrix.target }}/canonical-profile.txt
            target/forge-pgo-${{ matrix.target }}/training.json
          if-no-files-found: error
          retention-days: 7

      - name: Build the self-contained Python platform wheel
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        run: >-
          python tools/build-python-wheel.py
          --library target/${{ matrix.target }}/release/${{ matrix.library }}
          --library-name ${{ matrix.library }}
          --platform ${{ matrix.wheel-platform }}
          --outdir .
          --version ${{ needs.validate.outputs.version }}

      - name: Install and smoke-test the platform wheel
        shell: bash
        run: |
          set -euo pipefail
          unset FORGE_NORMALIZER_LIBRARY
          python -m pip install forge_normalizer-*.whl
          python -m pip check
          python python/tests/wheel_smoke.py

      - name: Package macOS binary
        if: startsWith(matrix.asset, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          staging="forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/forge" \
             "target/${{ matrix.target }}/release/forge-live" \
             "target/${{ matrix.target }}/release/forge-doctor" \
             "target/${{ matrix.target }}/release/forge-compare" \
             "target/${{ matrix.target }}/release/forge-audio-compare" \
             "target/${{ matrix.target }}/release/forge-container-qc" \
             "target/${{ matrix.target }}/release/forge-streaming-qc" \
             "target/${{ matrix.target }}/release/forge-presentation-qc" \
             "target/${{ matrix.target }}/release/forge-adm-presentation-qc" \
             "target/${{ matrix.target }}/release/forge-adm-interactivity-qc" \
             "target/${{ matrix.target }}/release/forge-adm-semantics-qc" \
             "target/${{ matrix.target }}/release/forge-downmix-qc" \
             "target/${{ matrix.target }}/release/forge-binaural-qc" \
             "target/${{ matrix.target }}/release/forge-remediate" \
             "target/${{ matrix.target }}/release/forge-metadata-repair" \
             "target/${{ matrix.target }}/release/forge-sadm-qc" \
             "target/${{ matrix.target }}/release/forge-dialogue-provider" \
             "target/${{ matrix.target }}/release/forge-anomaly-provider" \
             "target/${{ matrix.target }}/release/forge-onnx-provider" \
             "target/${{ matrix.target }}/release/forge-provenance-qc" \
             "target/${{ matrix.target }}/release/forge-imf-qc" \
             "target/${{ matrix.target }}/release/forge-aes31-qc" \
             "target/${{ matrix.target }}/release/forge-rtp-qc" \
             "target/${{ matrix.target }}/release/forge-nmos-qc" \
             "target/${{ matrix.target }}/release/forge-st2022-7-qc" \
             "target/${{ matrix.target }}/release/forge-report" \
             "target/${{ matrix.target }}/release/forge-multi-delivery" \
             "target/${{ matrix.target }}/release/forge-segment-normalize" \
             "target/${{ matrix.target }}/release/forge-ac4-qc" \
             "target/${{ matrix.target }}/release/forge-mpegh-qc" \
             "target/${{ matrix.target }}/release/forge-dts-qc" \
             "target/${{ matrix.target }}/release/forge-remote-qc" \
             "target/${{ matrix.target }}/release/forge-service" "$staging/"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/forge-live.clap"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/${{ matrix.library }}"
          mkdir "$staging/include" "$staging/lib"
          cp include/forge_normalizer.h "$staging/include/"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/lib/${{ matrix.library }}"
          python3 tools/native_package_metadata.py \
            --root "$staging" \
            --version "${{ needs.validate.outputs.version }}" \
            --platform macos
          mkdir -p "$staging/integrations/ffmpeg" "$staging/integrations/gstreamer"
          cp integrations/ffmpeg/forge_ffmpeg_bridge.c \
             integrations/ffmpeg/forge_ffmpeg_bridge.h "$staging/integrations/ffmpeg/"
          cp integrations/gstreamer/gstforge.c "$staging/integrations/gstreamer/"
          mkdir -p "$staging/integrations/au"
          cp integrations/au/CMakeLists.txt integrations/au/au-info.plist \
             "$staging/integrations/au/"
          mkdir -p "$staging/integrations/vst3/external/vst3sdk"
          cp integrations/vst3/CMakeLists.txt integrations/vst3/*.h \
             integrations/vst3/*.cpp "$staging/integrations/vst3/"
          cp integrations/vst3/external/CMakeLists.txt \
             "$staging/integrations/vst3/external/"
          cp integrations/vst3/external/vst3sdk/CMakeLists.txt \
             "$staging/integrations/vst3/external/vst3sdk/"
          mkdir "$staging/tools" "$staging/schema" "$staging/proto"
          cp proto/* "$staging/proto/"
          cp tools/benchmark.py tools/test-vst3-adapter.sh tools/test-au-adapter.sh "$staging/tools/"
          cp schema/*.json "$staging/schema/"
          cp -R schema/ebu-qc-2026-04 "$staging/schema/"
          cp ./*.md LICENSE "$staging/"
          python3 tools/check-release-content.py "$staging" \
            --native-platform macos \
            --version "${{ needs.validate.outputs.version }}"
          tools/test-native-package.sh \
            "$staging" "${{ needs.validate.outputs.version }}"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forge.exe","target/${{ matrix.target }}/release/forge-live.exe","target/${{ matrix.target }}/release/forge-doctor.exe","target/${{ matrix.target }}/release/forge-compare.exe","target/${{ matrix.target }}/release/forge-audio-compare.exe","target/${{ matrix.target }}/release/forge-container-qc.exe","target/${{ matrix.target }}/release/forge-streaming-qc.exe","target/${{ matrix.target }}/release/forge-presentation-qc.exe","target/${{ matrix.target }}/release/forge-adm-presentation-qc.exe","target/${{ matrix.target }}/release/forge-adm-interactivity-qc.exe","target/${{ matrix.target }}/release/forge-adm-semantics-qc.exe","target/${{ matrix.target }}/release/forge-downmix-qc.exe","target/${{ matrix.target }}/release/forge-binaural-qc.exe","target/${{ matrix.target }}/release/forge-remediate.exe","target/${{ matrix.target }}/release/forge-metadata-repair.exe","target/${{ matrix.target }}/release/forge-sadm-qc.exe","target/${{ matrix.target }}/release/forge-dialogue-provider.exe","target/${{ matrix.target }}/release/forge-anomaly-provider.exe","target/${{ matrix.target }}/release/forge-onnx-provider.exe","target/${{ matrix.target }}/release/forge-remote-qc.exe","target/${{ matrix.target }}/release/forge-service.exe","target/${{ matrix.target }}/release/forge-provenance-qc.exe","target/${{ matrix.target }}/release/forge-imf-qc.exe","target/${{ matrix.target }}/release/forge-aes31-qc.exe","target/${{ matrix.target }}/release/forge-rtp-qc.exe","target/${{ matrix.target }}/release/forge-nmos-qc.exe","target/${{ matrix.target }}/release/forge-st2022-7-qc.exe","target/${{ matrix.target }}/release/forge-report.exe","target/${{ matrix.target }}/release/forge-multi-delivery.exe","target/${{ matrix.target }}/release/forge-segment-normalize.exe","target/${{ matrix.target }}/release/forge-ac4-qc.exe","target/${{ matrix.target }}/release/forge-mpegh-qc.exe","target/${{ matrix.target }}/release/forge-dts-qc.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/forge-live.clap"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/${{ matrix.library }}"
          $importLibraries = @(Get-ChildItem "target/${{ matrix.target }}/release" -File -Filter "forge_normalizer*.lib")
          if ($importLibraries.Count -ne 1) { throw "Expected one Forge import library, found $($importLibraries.Count)" }
          $importLibrary = $importLibraries[0]
          Copy-Item $importLibrary.FullName "$staging/forge_normalizer.lib"
          New-Item -ItemType Directory -Path "$staging/include","$staging/bin","$staging/lib" | Out-Null
          Copy-Item include/forge_normalizer.h "$staging/include/"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/bin/forge_normalizer.dll"
          Copy-Item $importLibrary.FullName "$staging/lib/forge_normalizer.lib"
          python tools/native_package_metadata.py --root $staging --version "${{ needs.validate.outputs.version }}" --platform windows
          New-Item -ItemType Directory -Path "$staging/integrations/ffmpeg","$staging/integrations/gstreamer" | Out-Null
          Copy-Item "integrations/ffmpeg/forge_ffmpeg_bridge.c","integrations/ffmpeg/forge_ffmpeg_bridge.h" "$staging/integrations/ffmpeg/"
          Copy-Item integrations/gstreamer/gstforge.c "$staging/integrations/gstreamer/"
          New-Item -ItemType Directory -Path "$staging/integrations/au" | Out-Null
          Copy-Item "integrations/au/CMakeLists.txt","integrations/au/au-info.plist" "$staging/integrations/au/"
          New-Item -ItemType Directory -Path "$staging/integrations/vst3/external/vst3sdk" -Force | Out-Null
          Copy-Item "integrations/vst3/CMakeLists.txt","integrations/vst3/forge_vst3_ids.h","integrations/vst3/forge_vst3_processor.h","integrations/vst3/forge_vst3_processor.cpp","integrations/vst3/forge_vst3_controller.h","integrations/vst3/forge_vst3_controller.cpp","integrations/vst3/forge_vst3_entry.cpp","integrations/vst3/version.h" "$staging/integrations/vst3/"
          Copy-Item integrations/vst3/external/CMakeLists.txt "$staging/integrations/vst3/external/"
          Copy-Item integrations/vst3/external/vst3sdk/CMakeLists.txt "$staging/integrations/vst3/external/vst3sdk/"
          New-Item -ItemType Directory -Path "$staging/tools","$staging/schema","$staging/proto" | Out-Null
          Copy-Item "proto/*" "$staging/proto/"
          Copy-Item @("tools/benchmark.py","tools/test-vst3-adapter.sh","tools/test-au-adapter.sh") "$staging/tools/"
          Copy-Item "schema/*.json" "$staging/schema/"
          Copy-Item schema/ebu-qc-2026-04 "$staging/schema/" -Recurse
          Copy-Item "*.md","LICENSE" $staging
          python tools/check-release-content.py "$staging" --native-platform windows --version "${{ needs.validate.outputs.version }}"
          tools/test-native-package.ps1 -Root $staging -ExpectedVersion "${{ needs.validate.outputs.version }}"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-${{ matrix.asset }}
          path: |
            forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}.*
            forge_normalizer-${{ needs.validate.outputs.version }}-*.whl
          if-no-files-found: error
          retention-days: 7

  build-linux-wheel:
    name: Build and verify manylinux_2_34_${{ matrix.architecture }} wheel
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
            cflags: -O2 -march=x86-64 -mtune=generic
            target_cpu: x86-64
            rustup_host: x86_64-unknown-linux-gnu
            rustup_sha256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:ad74e53b713f3b07d8c889c526dc0c6500da9827b45e38739570875fef52e28f
            cflags: -O2 -march=armv8-a -mtune=generic
            target_cpu: generic
            rustup_host: aarch64-unknown-linux-gnu
            rustup_sha256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
    runs-on: ${{ matrix.runner }}
    container:
      # AlmaLinux 8 retains each architecture's baseline. The published wheel
      # tag remains manylinux_2_34 and is set only by auditwheel below.
      image: ${{ matrix.image }}
    env:
      AUDITWHEEL: /tmp/forge-wheel-tools/bin/auditwheel
      CARGO_HOME: /tmp/forge-cargo
      CARGO_INCREMENTAL: "0"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CFLAGS: ${{ matrix.cflags }}
      CXXFLAGS: ${{ matrix.cflags }}
      LC_ALL: C.UTF-8
      PYTHON: /opt/python/cp310-cp310/bin/python
      PYTHONHASHSEED: "0"
      RUSTFLAGS: -C target-cpu=${{ matrix.target_cpu }} --remap-path-prefix=${{ github.workspace }}=/workspace
      RUSTUP_HOME: /tmp/forge-rustup
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
      TZ: UTC
      WHEEL_PYTHON: /tmp/forge-wheel-tools/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Verify the pinned build floor and Python 3.10
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          test "$(uname -m)" = "${{ matrix.architecture }}"
          "$PYTHON" -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'

      - name: Install checksum-pinned Rust 1.97.0
        env:
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_sha256 }}
          RUSTUP_INIT_VERSION: 1.28.2
        shell: bash
        run: |
          set -euo pipefail
          rustup_init="${RUNNER_TEMP}/rustup-init"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$rustup_init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/${{ matrix.rustup_host }}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${rustup_init}" | sha256sum --check --strict -
          chmod 0755 "$rustup_init"
          "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain 1.97.0
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          "${CARGO_HOME}/bin/rustc" --version | grep -Fx 'rustc 1.97.0 (2d8144b78 2026-07-07)'

      - name: Materialize and install the hash-locked tool wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" -m venv /tmp/forge-wheel-tools
          mkdir /tmp/forge-wheelhouse
          "$WHEEL_PYTHON" -m pip download \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --dest /tmp/forge-wheelhouse \
            -r tools/python-wheel-build-requirements.lock
          "$WHEEL_PYTHON" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links /tmp/forge-wheelhouse \
            --require-hashes \
            --only-binary=:all: \
            -r tools/python-wheel-build-requirements.lock

      - name: Build the dedicated generic Linux cdylib
        shell: bash
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/manylinux-cmake-toolchain.cmake
        run: >-
          cargo build --locked --release --lib
          --target ${{ matrix.target }} --no-default-features
          --features opus-encoding

      - name: Build an unclaimed Linux wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir raw-wheel repaired-wheel
          "$WHEEL_PYTHON" tools/build-python-wheel.py \
            --library target/${{ matrix.target }}/release/libforge_normalizer.so \
            --library-name libforge_normalizer.so \
            --platform linux_${{ matrix.architecture }} \
            --outdir raw-wheel \
            --version "${{ needs.validate.outputs.version }}"

      - name: Repair to the published manylinux contract
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t raw_wheels < <(find raw-wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          if (( ${#raw_wheels[@]} != 1 )); then
            echo "expected exactly one raw Linux wheel, found ${#raw_wheels[@]}" >&2
            exit 1
          fi
          "$WHEEL_PYTHON" -m auditwheel repair \
            --plat manylinux_2_34_${{ matrix.architecture }} \
            --only-plat \
            --wheel-dir repaired-wheel \
            "${raw_wheels[0]}"

      - name: Verify every repaired wheel ELF and compatibility tag
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find repaired-wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one repaired Linux wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          "$WHEEL_PYTHON" -m auditwheel show "${wheels[0]}" | tee auditwheel-show.txt
          "$WHEEL_PYTHON" tools/check-linux-wheel-abi.py \
            --architecture "${{ matrix.architecture }}" \
            --auditwheel "$AUDITWHEEL" \
            "${wheels[0]}"

      - name: Upload only the repaired Linux wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-python-linux-${{ matrix.architecture }}
          path: repaired-wheel/forge_normalizer-*.whl
          if-no-files-found: error
          retention-days: 7

  smoke-linux-wheel-floor:
    name: Smoke-test Linux ${{ matrix.architecture }} at runtime and CPU floors
    needs: [validate, build-linux, build-linux-wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            manylinux_2_28: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
            manylinux_2_34: quay.io/pypa/manylinux_2_34_x86_64@sha256:934419fa742ff922855f464203cc0ad5afe3317a8541712a00cf3dc7fb893fc8
            qemu_cpu: qemu64,-lahf-lm,-pni,-ssse3,-sse4.1,-sse4.2,-popcnt,-cx16,-avx,-avx2
            qemu_deb_sha256: c3e3ba2bd87f8c5b9a5da5ef21b5a3b82d7c63b89dd448d9ddaa4eabc5b6e402
            qemu_deb_url: https://snapshot.debian.org/archive/debian/20260526T203455Z/pool/main/q/qemu/qemu-user-static_7.2%2bdfsg-7%2bdeb12u18%2bb3_amd64.deb
            qemu_binary: qemu-x86_64-static
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            manylinux_2_28: quay.io/pypa/manylinux_2_28_aarch64@sha256:ad74e53b713f3b07d8c889c526dc0c6500da9827b45e38739570875fef52e28f
            manylinux_2_34: quay.io/pypa/manylinux_2_34_aarch64@sha256:effc0e17319a56b2c7eaff0cb5dd81a2d2c2850410841d3f017378f52ead6442
            qemu_cpu: cortex-a53
            qemu_deb_sha256: e420c417c12b42ca774795b62888d5388da0e08c1ef263dea1490e5ce4e32a0b
            qemu_deb_url: https://snapshot.debian.org/archive/debian/20260526T203455Z/pool/main/q/qemu/qemu-user-static_7.2%2bdfsg-7%2bdeb12u18%2bb3_arm64.deb
            qemu_binary: qemu-aarch64-static
    runs-on: ${{ matrix.runner }}
    env:
      MANYLINUX_2_28_IMAGE: ${{ matrix.manylinux_2_28 }}
      MANYLINUX_2_34_IMAGE: ${{ matrix.manylinux_2_34 }}
      QEMU_CPU: ${{ matrix.qemu_cpu }}
      # QEMU 8.2 regressed x86-64 /proc/self/maps emulation (upstream #2170)
      # and crashes programs that inspect their own thread mappings. Use the
      # immutable Debian Bookworm 7.2 build for both release architectures.
      QEMU_DEB_SHA256: ${{ matrix.qemu_deb_sha256 }}
      QEMU_DEB_URL: ${{ matrix.qemu_deb_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Download the verified wheel candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-python-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/linux-wheel

      - name: Download the portable native archive candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/linux-native

      - name: Extract safely and verify every native ELF
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/linux-native/forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.tar.gz"
          extraction="${RUNNER_TEMP}/linux-native-extracted"
          mkdir "$extraction"
          root_name="forge-v${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}"
          native_root="${extraction}/${root_name}"
          python3 tools/check-linux-native-abi.py \
            --architecture "${{ matrix.architecture }}" \
            --archive "$archive" \
            --extract-to "$extraction" \
            --expected-root "$root_name"
          echo "FORGE_NATIVE_ROOT=$(realpath "$native_root")" >> "$GITHUB_ENV"

      - name: Install checksum-pinned QEMU and prove the baseline CPU model
        shell: bash
        run: |
          set -euo pipefail
          qemu_deb="${RUNNER_TEMP}/qemu-user-static.deb"
          qemu_root="${RUNNER_TEMP}/qemu-user-static"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$qemu_deb" \
            "$QEMU_DEB_URL"
          echo "${QEMU_DEB_SHA256}  ${qemu_deb}" | sha256sum --check --strict -
          mkdir "$qemu_root"
          dpkg-deb --extract "$qemu_deb" "$qemu_root"
          qemu="${qemu_root}/usr/bin/${{ matrix.qemu_binary }}"
          test -x "$qemu"
          echo "QEMU_PATH=${qemu}" >> "$GITHUB_ENV"
          if [[ "${{ matrix.architecture }}" == x86_64 ]]; then
            python3 tools/test_linux_wheel_abi.py \
              --architecture x86_64 \
              --qemu-x86-64 "$qemu" \
              --qemu-cpu "$QEMU_CPU"
          else
            python3 tools/test_linux_wheel_abi.py \
              --architecture aarch64 \
              --qemu-aarch64 "$qemu" \
              --qemu-cpu "$QEMU_CPU"
          fi

      - name: Install, load, and analyze WAV in network-isolated containers
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/linux-wheel"
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' -print | sort)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one verified Linux wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          source_root="$(realpath "$GITHUB_WORKSPACE")"
          wheel_root="$(realpath "$wheel_dir")"
          native_root="$(realpath "$FORGE_NATIVE_ROOT")"
          python3 tools/run-pinned-container.py pull "$MANYLINUX_2_34_IMAGE"
          python3 tools/run-pinned-container.py pull "$MANYLINUX_2_28_IMAGE"

          python3 tools/run-pinned-container.py run "$MANYLINUX_2_34_IMAGE" \
            --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --mount "type=bind,src=${source_root},dst=/source,readonly" \
            --mount "type=bind,src=${wheel_root},dst=/wheel,readonly" \
            --mount "type=bind,src=${native_root},dst=/native,readonly" \
            --workdir /source \
            --env FORGE_VERSION="${{ needs.validate.outputs.version }}" \
            --env FORGE_ARCHITECTURE="${{ matrix.architecture }}" \
            -- \
            /bin/bash -lc '
              set -euo pipefail
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.34"
              test "$(uname -m)" = "$FORGE_ARCHITECTURE"
              py=/opt/python/cp310-cp310/bin/python
              "$py" -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"
              mkdir /tmp/home /tmp/site
              HOME=/tmp/home "$py" -m pip install \
                --disable-pip-version-check --no-cache-dir --no-index --no-deps \
                --target /tmp/site /wheel/*.whl
              unset FORGE_NORMALIZER_LIBRARY
              PYTHONPATH=/tmp/site "$py" -m pip check
              PYTHONPATH=/tmp/site "$py" /source/python/tests/wheel_smoke.py
              test "$(/native/forge --version)" = "forge ${FORGE_VERSION}"
              /native/forge --help >/dev/null
              /source/tools/test-native-package.sh /native "$FORGE_VERSION"
            '

          python3 tools/run-pinned-container.py run "$MANYLINUX_2_28_IMAGE" \
            --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --mount "type=bind,src=${source_root},dst=/source,readonly" \
            --mount "type=bind,src=${wheel_root},dst=/wheel,readonly" \
            --mount "type=bind,src=${native_root},dst=/native,readonly" \
            --mount "type=bind,src=${QEMU_PATH},dst=/qemu-static,readonly" \
            --workdir /source \
            --env FORGE_VERSION="${{ needs.validate.outputs.version }}" \
            --env FORGE_ARCHITECTURE="${{ matrix.architecture }}" \
            --env QEMU_CPU="$QEMU_CPU" \
            -- \
            /bin/bash -lc '
              set -euo pipefail
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              test "$(uname -m)" = "$FORGE_ARCHITECTURE"
              py=/opt/python/cp310-cp310/bin/python
              mkdir /tmp/home /tmp/site
              HOME=/tmp/home "$py" -m pip install \
                --disable-pip-version-check --no-cache-dir --no-index --no-deps \
                --only-binary=:all: --platform "manylinux_2_34_${FORGE_ARCHITECTURE}" \
                --target /tmp/site /wheel/*.whl
              unset FORGE_NORMALIZER_LIBRARY
              PYTHONPATH=/tmp/site /qemu-static \
                -cpu "$QEMU_CPU" "$py" /source/python/tests/wheel_smoke.py
              test "$(/qemu-static -cpu "$QEMU_CPU" /native/forge --version)" \
                = "forge ${FORGE_VERSION}"
              PKG_CONFIG_PATH=/native/lib/pkgconfig \
                cc -std=c11 -Wall -Wextra -Werror \
                  /source/tests/fixtures/c_api_consumer.c \
                  $(PKG_CONFIG_PATH=/native/lib/pkgconfig \
                    pkg-config --cflags --libs forge-normalizer) \
                  -o /tmp/forge-native-consumer
              LD_LIBRARY_PATH=/native/lib /qemu-static \
                -cpu "$QEMU_CPU" /tmp/forge-native-consumer
            '

  reproducible-linux-wheel:
    name: Reproduce the repaired Linux ${{ matrix.architecture }} wheel
    needs: [validate, build-linux-wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
            cflags: -O2 -march=x86-64 -mtune=generic
            target_cpu: x86-64
            rustup_host: x86_64-unknown-linux-gnu
            rustup_sha256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:ad74e53b713f3b07d8c889c526dc0c6500da9827b45e38739570875fef52e28f
            cflags: -O2 -march=armv8-a -mtune=generic
            target_cpu: generic
            rustup_host: aarch64-unknown-linux-gnu
            rustup_sha256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      AUDITWHEEL: /tmp/forge-wheel-tools/bin/auditwheel
      CARGO_HOME: /tmp/forge-cargo
      CARGO_INCREMENTAL: "0"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CFLAGS: ${{ matrix.cflags }}
      CXXFLAGS: ${{ matrix.cflags }}
      LC_ALL: C.UTF-8
      PYTHON: /opt/python/cp310-cp310/bin/python
      PYTHONHASHSEED: "0"
      RUSTFLAGS: -C target-cpu=${{ matrix.target_cpu }} --remap-path-prefix=${{ github.workspace }}=/workspace
      RUSTUP_HOME: /tmp/forge-rustup
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
      TZ: UTC
      WHEEL_PYTHON: /tmp/forge-wheel-tools/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Download the independently built candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-python-linux-${{ matrix.architecture }}
          path: candidate-wheel

      - name: Verify the pinned reproduction floor and Python 3.10
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          test "$(uname -m)" = "${{ matrix.architecture }}"
          "$PYTHON" -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'

      - name: Install checksum-pinned Rust 1.97.0
        env:
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_sha256 }}
          RUSTUP_INIT_VERSION: 1.28.2
        shell: bash
        run: |
          set -euo pipefail
          rustup_init="${RUNNER_TEMP}/rustup-init"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$rustup_init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/${{ matrix.rustup_host }}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${rustup_init}" | sha256sum --check --strict -
          chmod 0755 "$rustup_init"
          "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain 1.97.0
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          "${CARGO_HOME}/bin/rustc" --version | grep -Fx 'rustc 1.97.0 (2d8144b78 2026-07-07)'

      - name: Materialize and install the hash-locked tool wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" -m venv /tmp/forge-wheel-tools
          mkdir /tmp/forge-wheelhouse
          "$WHEEL_PYTHON" -m pip download \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --dest /tmp/forge-wheelhouse \
            -r tools/python-wheel-build-requirements.lock
          "$WHEEL_PYTHON" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links /tmp/forge-wheelhouse \
            --require-hashes \
            --only-binary=:all: \
            -r tools/python-wheel-build-requirements.lock

      - name: Rebuild and repair independently
        shell: bash
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/manylinux-cmake-toolchain.cmake
        run: |
          set -euo pipefail
          cargo build --locked --release --lib \
            --target ${{ matrix.target }} --no-default-features \
            --features opus-encoding
          mkdir raw-wheel reproduced-wheel
          "$WHEEL_PYTHON" tools/build-python-wheel.py \
            --library target/${{ matrix.target }}/release/libforge_normalizer.so \
            --library-name libforge_normalizer.so \
            --platform linux_${{ matrix.architecture }} \
            --outdir raw-wheel \
            --version "${{ needs.validate.outputs.version }}"
          mapfile -t raw_wheels < <(find raw-wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          if (( ${#raw_wheels[@]} != 1 )); then
            echo "expected exactly one reproduced raw wheel, found ${#raw_wheels[@]}" >&2
            exit 1
          fi
          "$WHEEL_PYTHON" -m auditwheel repair \
            --plat manylinux_2_34_${{ matrix.architecture }} \
            --only-plat \
            --wheel-dir reproduced-wheel \
            "${raw_wheels[0]}"

      - name: Verify ABI and compare the repaired wheel byte for byte
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find candidate-wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          mapfile -t reproduced < <(find reproduced-wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          if (( ${#candidates[@]} != 1 || ${#reproduced[@]} != 1 )); then
            echo "expected one candidate and one reproduced wheel" >&2
            exit 1
          fi
          for wheel in "${candidates[0]}" "${reproduced[0]}"; do
            "$WHEEL_PYTHON" tools/check-linux-wheel-abi.py \
              --architecture "${{ matrix.architecture }}" \
              --auditwheel "$AUDITWHEEL" \
              "$wheel"
          done
          cmp "${candidates[0]}" "${reproduced[0]}"
          sha256sum "${candidates[0]}" "${reproduced[0]}"

  build-linux-v3:
    name: Build linux-x86_64-v3
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
    env:
