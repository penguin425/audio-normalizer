name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "include/forge_normalizer.h"
      - "python/**"
      - "wasm/**"
      - "src/c_api.rs"
      - "src/lib.rs"
      - "PYTHON-API.md"
      - "BENCHMARKS.md"
      - "tools/benchmark.py"
      - "schema/performance-benchmark-v1.schema.json"
      - "tools/build-python-wheel.py"
      - "tools/build-wasm-package.sh"
      - "tools/package-linux-release.sh"
      - "tools/generate-package-metadata.sh"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-date-epoch: ${{ steps.version.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - id: version
        name: Match tag to Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          python_version="$(
            python3 -c \
              "import runpy; print(runpy.run_path('python/src/forge_normalizer/_version.py')['__version__'])"
          )"
          if [[ "$python_version" != "$version" ]]; then
            echo "::error::Python package version ${python_version} does not match Cargo.toml version ${version}"
            exit 1
          fi
          wasm_version="$(
            cargo metadata --manifest-path wasm/Cargo.toml --no-deps --format-version 1 |
              jq -r '.packages[0].version'
          )"
          if [[ "$wasm_version" != "$version" ]]; then
            echo "::error::WASM package version ${wasm_version} does not match Cargo.toml version ${version}"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            archive: tar
            library: libforge_normalizer.so
            wheel-platform: manylinux_2_34_x86_64
            rustflags: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            archive: zip
            library: forge_normalizer.dll
            wheel-platform: win_amd64
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            archive: tar
            library: libforge_normalizer.dylib
            wheel-platform: macosx_10_12_x86_64
            rustflags: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
            archive: tar
            library: libforge_normalizer.dylib
            wheel-platform: macosx_11_0_arm64
            rustflags: -Ctarget-feature=+neon,+aes,+sha2
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install pinned Python wheel build tools
        run: python -m pip install --disable-pip-version-check build==1.5.0 setuptools==83.0.0 wheel==0.47.0

      - name: Build release binary
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace ${{ matrix.rustflags }}
        run: cargo build --locked --release --target ${{ matrix.target }} --features opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin

      - name: Build the self-contained Python platform wheel
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        run: >-
          python tools/build-python-wheel.py
          --library target/${{ matrix.target }}/release/${{ matrix.library }}
          --library-name ${{ matrix.library }}
          --platform ${{ matrix.wheel-platform }}
          --outdir .
          --version ${{ needs.validate.outputs.version }}

      - name: Check Linux wheel policy
        if: matrix.asset == 'linux-x86_64'
        run: |
          python -m pip install --disable-pip-version-check auditwheel==6.7.0
          python -m auditwheel show forge_normalizer-*.whl

      - name: Install and smoke-test the platform wheel
        shell: bash
        run: |
          set -euo pipefail
          unset FORGE_NORMALIZER_LIBRARY
          python -m pip install forge_normalizer-*.whl
          python -m pip check
          python python/tests/wheel_smoke.py

      - name: Package reproducible Linux binary
        if: matrix.asset == 'linux-x86_64'
        shell: bash
        run: tools/package-linux-release.sh "${{ needs.validate.outputs.version }}" "${{ matrix.target }}" "${{ needs.validate.outputs.source-date-epoch }}" .

      - name: Package macOS binary
        if: startsWith(matrix.asset, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          staging="forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/forge" \
             "target/${{ matrix.target }}/release/forge-live" \
             "target/${{ matrix.target }}/release/forge-compare" \
             "target/${{ matrix.target }}/release/forge-audio-compare" \
             "target/${{ matrix.target }}/release/forge-container-qc" \
             "target/${{ matrix.target }}/release/forge-streaming-qc" \
             "target/${{ matrix.target }}/release/forge-presentation-qc" \
             "target/${{ matrix.target }}/release/forge-sadm-qc" \
             "target/${{ matrix.target }}/release/forge-dialogue-provider" \
             "target/${{ matrix.target }}/release/forge-provenance-qc" \
             "target/${{ matrix.target }}/release/forge-imf-qc" \
             "target/${{ matrix.target }}/release/forge-aes31-qc" \
             "target/${{ matrix.target }}/release/forge-rtp-qc" \
             "target/${{ matrix.target }}/release/forge-nmos-qc" \
             "target/${{ matrix.target }}/release/forge-st2022-7-qc" \
             "target/${{ matrix.target }}/release/forge-report" "$staging/"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/forge-live.clap"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/${{ matrix.library }}"
          mkdir "$staging/include"
          cp include/forge_normalizer.h "$staging/include/"
          mkdir "$staging/tools" "$staging/schema"
          cp tools/benchmark.py "$staging/tools/"
          cp schema/performance-benchmark-v1.schema.json "$staging/schema/"
          cp README.md BATCH-JOBS.md WATCH-FOLDERS.md ANALYSIS-CACHE.md CATALOGUE.md BENCHMARKS.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forge.exe","target/${{ matrix.target }}/release/forge-live.exe","target/${{ matrix.target }}/release/forge-compare.exe","target/${{ matrix.target }}/release/forge-audio-compare.exe","target/${{ matrix.target }}/release/forge-container-qc.exe","target/${{ matrix.target }}/release/forge-streaming-qc.exe","target/${{ matrix.target }}/release/forge-presentation-qc.exe","target/${{ matrix.target }}/release/forge-sadm-qc.exe","target/${{ matrix.target }}/release/forge-dialogue-provider.exe","target/${{ matrix.target }}/release/forge-provenance-qc.exe","target/${{ matrix.target }}/release/forge-imf-qc.exe","target/${{ matrix.target }}/release/forge-aes31-qc.exe","target/${{ matrix.target }}/release/forge-rtp-qc.exe","target/${{ matrix.target }}/release/forge-nmos-qc.exe","target/${{ matrix.target }}/release/forge-st2022-7-qc.exe","target/${{ matrix.target }}/release/forge-report.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/forge-live.clap"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/${{ matrix.library }}"
          $importLibrary = Get-ChildItem "target/${{ matrix.target }}/release" -Filter "forge_normalizer*.lib" | Select-Object -First 1
          if ($null -eq $importLibrary) { throw "Forge import library was not produced" }
          Copy-Item $importLibrary.FullName "$staging/forge_normalizer.lib"
          New-Item -ItemType Directory -Path "$staging/include" | Out-Null
          Copy-Item include/forge_normalizer.h "$staging/include/"
          New-Item -ItemType Directory -Path "$staging/tools","$staging/schema" | Out-Null
          Copy-Item tools/benchmark.py "$staging/tools/"
          Copy-Item schema/performance-benchmark-v1.schema.json "$staging/schema/"
          Copy-Item "README.md","BATCH-JOBS.md","WATCH-FOLDERS.md","ANALYSIS-CACHE.md","CATALOGUE.md","BENCHMARKS.md","LICENSE" $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-${{ matrix.asset }}
          path: |
            forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}.*
            forge_normalizer-${{ needs.validate.outputs.version }}-*.whl
          if-no-files-found: error
          retention-days: 7

  reproducible-linux:
    name: Reproduce Linux release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install pinned Python wheel build tools
        run: python -m pip install --disable-pip-version-check build==1.5.0 setuptools==83.0.0 wheel==0.47.0

      - name: Download published build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-x86_64
          path: actual

      - name: Independently rebuild and compare
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-gnu --features opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin
          mkdir reproduced
          tools/package-linux-release.sh "${{ needs.validate.outputs.version }}" x86_64-unknown-linux-gnu "${{ needs.validate.outputs.source-date-epoch }}" reproduced
          python tools/build-python-wheel.py \
            --library target/x86_64-unknown-linux-gnu/release/libforge_normalizer.so \
            --library-name libforge_normalizer.so \
            --platform manylinux_2_34_x86_64 \
            --outdir reproduced \
            --version "${{ needs.validate.outputs.version }}"
          cmp \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" \
            "reproduced/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz"
          cmp \
            "actual/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl" \
            "reproduced/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl"
          sha256sum \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" \
            "reproduced/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" \
            "actual/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl" \
            "reproduced/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl"

  wasm:
    name: Build browser WASM package
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0 and the WebAssembly target
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build and test the browser package
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        run: |
          mkdir first second
          tools/build-wasm-package.sh "${{ needs.validate.outputs.version }}" first
          node wasm/test/smoke.mjs
          tools/build-wasm-package.sh "${{ needs.validate.outputs.version }}" second
          cmp \
            "first/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz" \
            "second/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz"
          mv "first/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz" .

      - name: Upload browser package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-wasm-web
          path: forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build, reproducible-linux, wasm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: forge-*
          path: dist
          merge-multiple: true

      - name: Generate package-manager manifests
        shell: bash
        run: tools/generate-package-metadata.sh "${{ needs.validate.outputs.version }}" dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/forge-v${{ needs.validate.outputs.version }}.spdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/forge-v${{ needs.validate.outputs.version }}.cdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate evidence and create checksums
        shell: bash
        run: |
          set -euo pipefail
          jq -e . "dist/forge-v${{ needs.validate.outputs.version }}.spdx.json" >/dev/null
          jq -e . "dist/forge-v${{ needs.validate.outputs.version }}.cdx.json" >/dev/null
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Verify SLSA provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          provenance="dist/forge-v${{ needs.validate.outputs.version }}.slsa.jsonl"
          cp "${{ steps.provenance.outputs.bundle-path }}" "$provenance"
          while read -r _ artifact; do
            gh attestation verify "dist/${artifact#./}" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$provenance" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done < dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Forge $TAG"
