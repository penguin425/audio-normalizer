      - "schema/anomaly-provider-audit-v1.schema.json"
      - "schema/model-qc-v1.schema.json"
      - "schema/onnx-anomaly-model-v1.schema.json"
      - "schema/onnx-feature-frames-v1.schema.json"
      - "schema/remote-range-v1.schema.json"
      - "schema/remote-qc-v1.schema.json"
      - "schema/service-analysis-v1.schema.json"
      - "schema/service-error-v1.schema.json"
      - "schema/service-health-v1.schema.json"
      - "schema/delivery-manifest-v3.schema.json"
      - "schema/rule-explanations-v2.schema.json"
      - "ANOMALY-ADAPTER.md"
      - "SERVICE-METRICS.md"
      - "fuzz/fuzz_targets/onnx_provider.rs"
      - "fuzz/fuzz_targets/remote_range.rs"
      - "NEXT-GENERATION-PLAN.md"
      - "ROADMAP.md"
      - "tools/build-python-wheel.py"
      - "tools/build-wasm-package.sh"
      - "tools/package-linux-release.sh"
      - "tools/package-linux-v3-release.sh"
      - "tools/generate-package-metadata.sh"
      # Cargo-only dependency updates are covered by the full-feature CI jobs.
      # Release dry-runs still run whenever packaging, public interfaces,
      # release documentation, or release tooling changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never interrupt an immutable tag release. A newer pull-request head makes
  # an older dry-run obsolete, so release its scarce macOS runners promptly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-date-epoch: ${{ steps.version.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - id: version
        name: Match tag to Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          python_version="$(
            python3 -c \
              "import runpy; print(runpy.run_path('python/src/forge_normalizer/_version.py')['__version__'])"
          )"
          if [[ "$python_version" != "$version" ]]; then
            echo "::error::Python package version ${python_version} does not match Cargo.toml version ${version}"
            exit 1
          fi
          wasm_version="$(
            cargo metadata --manifest-path wasm/Cargo.toml --no-deps --format-version 1 |
              jq -r '.packages[0].version'
          )"
          if [[ "$wasm_version" != "$version" ]]; then
            echo "::error::WASM package version ${wasm_version} does not match Cargo.toml version ${version}"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            archive: tar
            library: libforge_normalizer.so
            wheel-platform: manylinux_2_34_x86_64
            features: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
            rustflags: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            archive: zip
            library: forge_normalizer.dll
            wheel-platform: win_amd64
            features: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            archive: tar
            library: libforge_normalizer.dylib
            wheel-platform: macosx_10_12_x86_64
            features: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service
            rustflags: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
            archive: tar
            library: libforge_normalizer.dylib
            wheel-platform: macosx_11_0_arm64
            features: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service
            rustflags: -Ctarget-feature=+neon,+aes,+sha2
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install matching LLVM PGO tools
        if: matrix.asset == 'linux-x86_64' || matrix.asset == 'macos-aarch64'
        run: rustup component add llvm-tools-preview

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned Python wheel build tools
        run: python -m pip install --disable-pip-version-check build==1.5.0 setuptools==83.0.0 wheel==0.47.0

      - name: Build release binary
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace ${{ matrix.rustflags }}
        run: cargo build --locked --release --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Apply reproducible PGO to the normalizer CLI
        if: matrix.asset == 'linux-x86_64' || matrix.asset == 'macos-aarch64'
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          FORGE_PGO_FEATURES: ${{ matrix.features }}
          FORGE_PGO_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          tools/build-pgo-forge.sh "${{ matrix.target }}"
          cp \
            "target/forge-pgo-${{ matrix.target }}/optimized/${{ matrix.target }}/release/forge" \
            "target/${{ matrix.target }}/release/forge"

      - name: Upload Apple Silicon PGO profile evidence
        if: matrix.asset == 'macos-aarch64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: apple-pgo-profile-macos-aarch64
          path: |
            target/forge-pgo-${{ matrix.target }}/canonical-profile.txt
            target/forge-pgo-${{ matrix.target }}/training.json
          if-no-files-found: error
          retention-days: 7

      - name: Stage Linux PGO build inputs
        if: matrix.asset == 'linux-x86_64'
        shell: bash
        run: |
          cp \
            "target/forge-pgo-${{ matrix.target }}/canonical-profile.txt" \
            "forge-v${{ needs.validate.outputs.version }}-linux-x86_64.pgo-profile.txt"
          cp \
            "target/forge-pgo-${{ matrix.target }}/training.json" \
            "forge-v${{ needs.validate.outputs.version }}-linux-x86_64.pgo-training.json"

      - name: Upload Linux PGO build inputs
        if: matrix.asset == 'linux-x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-pgo-profile-linux-x86_64
          path: |
            forge-v${{ needs.validate.outputs.version }}-linux-x86_64.pgo-profile.txt
            forge-v${{ needs.validate.outputs.version }}-linux-x86_64.pgo-training.json
          if-no-files-found: error
          retention-days: 7

      - name: Build the self-contained Python platform wheel
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        run: >-
          python tools/build-python-wheel.py
          --library target/${{ matrix.target }}/release/${{ matrix.library }}
          --library-name ${{ matrix.library }}
          --platform ${{ matrix.wheel-platform }}
          --outdir .
          --version ${{ needs.validate.outputs.version }}

      - name: Check Linux wheel policy
        if: matrix.asset == 'linux-x86_64'
        run: |
          python -m pip install --disable-pip-version-check auditwheel==6.7.0
          python -m auditwheel show forge_normalizer-*.whl

      - name: Install and smoke-test the platform wheel
        shell: bash
        run: |
          set -euo pipefail
          unset FORGE_NORMALIZER_LIBRARY
          python -m pip install forge_normalizer-*.whl
          python -m pip check
          python python/tests/wheel_smoke.py

      - name: Package reproducible Linux binary
        if: matrix.asset == 'linux-x86_64'
        shell: bash
        run: tools/package-linux-release.sh "${{ needs.validate.outputs.version }}" "${{ matrix.target }}" "${{ needs.validate.outputs.source-date-epoch }}" .

      - name: Package macOS binary
        if: startsWith(matrix.asset, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          staging="forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/forge" \
             "target/${{ matrix.target }}/release/forge-live" \
             "target/${{ matrix.target }}/release/forge-doctor" \
             "target/${{ matrix.target }}/release/forge-compare" \
             "target/${{ matrix.target }}/release/forge-audio-compare" \
             "target/${{ matrix.target }}/release/forge-container-qc" \
             "target/${{ matrix.target }}/release/forge-streaming-qc" \
             "target/${{ matrix.target }}/release/forge-presentation-qc" \
             "target/${{ matrix.target }}/release/forge-adm-presentation-qc" \
             "target/${{ matrix.target }}/release/forge-downmix-qc" \
             "target/${{ matrix.target }}/release/forge-binaural-qc" \
             "target/${{ matrix.target }}/release/forge-remediate" \
             "target/${{ matrix.target }}/release/forge-metadata-repair" \
             "target/${{ matrix.target }}/release/forge-sadm-qc" \
             "target/${{ matrix.target }}/release/forge-dialogue-provider" \
             "target/${{ matrix.target }}/release/forge-anomaly-provider" \
             "target/${{ matrix.target }}/release/forge-onnx-provider" \
             "target/${{ matrix.target }}/release/forge-provenance-qc" \
             "target/${{ matrix.target }}/release/forge-imf-qc" \
             "target/${{ matrix.target }}/release/forge-aes31-qc" \
             "target/${{ matrix.target }}/release/forge-rtp-qc" \
             "target/${{ matrix.target }}/release/forge-nmos-qc" \
             "target/${{ matrix.target }}/release/forge-st2022-7-qc" \
             "target/${{ matrix.target }}/release/forge-report" \
             "target/${{ matrix.target }}/release/forge-multi-delivery" \
             "target/${{ matrix.target }}/release/forge-segment-normalize" \
             "target/${{ matrix.target }}/release/forge-ac4-qc" \
             "target/${{ matrix.target }}/release/forge-mpegh-qc" \
             "target/${{ matrix.target }}/release/forge-dts-qc" \
             "target/${{ matrix.target }}/release/forge-remote-qc" \
             "target/${{ matrix.target }}/release/forge-service" "$staging/"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/forge-live.clap"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
             "$staging/${{ matrix.library }}"
          mkdir "$staging/include"
          cp include/forge_normalizer.h "$staging/include/"
          mkdir -p "$staging/integrations/ffmpeg" "$staging/integrations/gstreamer"
          cp integrations/ffmpeg/forge_ffmpeg_bridge.c \
             integrations/ffmpeg/forge_ffmpeg_bridge.h "$staging/integrations/ffmpeg/"
          cp integrations/gstreamer/gstforge.c "$staging/integrations/gstreamer/"
          mkdir -p "$staging/integrations/au"
          cp integrations/au/CMakeLists.txt integrations/au/au-info.plist \
             "$staging/integrations/au/"
          mkdir -p "$staging/integrations/vst3/external/vst3sdk"
          cp integrations/vst3/CMakeLists.txt integrations/vst3/*.h \
             integrations/vst3/*.cpp "$staging/integrations/vst3/"
          cp integrations/vst3/external/CMakeLists.txt \
             "$staging/integrations/vst3/external/"
          cp integrations/vst3/external/vst3sdk/CMakeLists.txt \
             "$staging/integrations/vst3/external/vst3sdk/"
          mkdir "$staging/tools" "$staging/schema" "$staging/proto"
          cp proto/forge_service.proto "$staging/proto/"
          cp tools/benchmark.py tools/test-vst3-adapter.sh tools/test-au-adapter.sh "$staging/tools/"
          cp schema/performance-benchmark-v1.schema.json "$staging/schema/"
          cp schema/doctor-report-v1.schema.json "$staging/schema/"
          cp schema/multi-delivery-request-v1.schema.json \
             schema/multi-delivery-report-v1.schema.json "$staging/schema/"
          cp schema/segment-normalization-request-v1.schema.json \
             schema/segment-normalization-plan-v1.schema.json \
             schema/segment-normalization-report-v1.schema.json "$staging/schema/"
          cp schema/ac4-adapter-request-v1.schema.json \
             schema/ac4-adapter-response-v1.schema.json \
             schema/ac4-adapter-report-v1.schema.json "$staging/schema/"
          cp schema/mpegh-adapter-request-v1.schema.json \
             schema/mpegh-adapter-response-v1.schema.json \
             schema/mpegh-adapter-report-v1.schema.json "$staging/schema/"
          cp schema/dts-adapter-request-v1.schema.json \
             schema/dts-adapter-response-v1.schema.json \
             schema/dts-adapter-report-v1.schema.json "$staging/schema/"
          cp schema/adm-presentation-report-v1.schema.json "$staging/schema/"
          cp schema/downmix-qc-request-v1.schema.json \
             schema/downmix-qc-report-v1.schema.json "$staging/schema/"
          cp schema/binaural-qc-request-v1.schema.json \
             schema/binaural-qc-report-v1.schema.json "$staging/schema/"
          cp schema/remediation-request-v1.schema.json \
             schema/remediation-report-v1.schema.json "$staging/schema/"
          cp schema/metadata-repair-request-v1.schema.json \
             schema/metadata-repair-report-v1.schema.json "$staging/schema/"
          cp schema/audio-anomaly-provider-v1.schema.json \
             schema/anomaly-provider-audit-v1.schema.json \
             schema/model-qc-v1.schema.json \
             schema/onnx-anomaly-model-v1.schema.json \
             schema/onnx-feature-frames-v1.schema.json \
             schema/remote-range-v1.schema.json \
             schema/remote-qc-v1.schema.json \
             schema/service-analysis-v1.schema.json \
             schema/service-error-v1.schema.json \
             schema/service-health-v1.schema.json "$staging/schema/"
          cp README.md PERFORMANCE.md BATCH-JOBS.md WATCH-FOLDERS.md ANALYSIS-CACHE.md CATALOGUE.md BENCHMARKS.md MULTI-DELIVERY.md SEGMENT-NORMALIZATION.md AC4-ADAPTER.md MPEGH-ADAPTER.md DTS-ADAPTER.md ADM-PRESENTATION-QC.md ANOMALY-ADAPTER.md SERVICE-METRICS.md C-API.md HOST-ADAPTERS.md VST3-ADAPTER.md AU-ADAPTER.md IMMERSIVE-DOWNMIX.md BINAURAL-QC.md REMEDIATION.md METADATA-REPAIR.md NEXT-GENERATION-PLAN.md ROADMAP.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forge.exe","target/${{ matrix.target }}/release/forge-live.exe","target/${{ matrix.target }}/release/forge-doctor.exe","target/${{ matrix.target }}/release/forge-compare.exe","target/${{ matrix.target }}/release/forge-audio-compare.exe","target/${{ matrix.target }}/release/forge-container-qc.exe","target/${{ matrix.target }}/release/forge-streaming-qc.exe","target/${{ matrix.target }}/release/forge-presentation-qc.exe","target/${{ matrix.target }}/release/forge-adm-presentation-qc.exe","target/${{ matrix.target }}/release/forge-downmix-qc.exe","target/${{ matrix.target }}/release/forge-binaural-qc.exe","target/${{ matrix.target }}/release/forge-remediate.exe","target/${{ matrix.target }}/release/forge-metadata-repair.exe","target/${{ matrix.target }}/release/forge-sadm-qc.exe","target/${{ matrix.target }}/release/forge-dialogue-provider.exe","target/${{ matrix.target }}/release/forge-anomaly-provider.exe","target/${{ matrix.target }}/release/forge-onnx-provider.exe","target/${{ matrix.target }}/release/forge-remote-qc.exe","target/${{ matrix.target }}/release/forge-service.exe","target/${{ matrix.target }}/release/forge-provenance-qc.exe","target/${{ matrix.target }}/release/forge-imf-qc.exe","target/${{ matrix.target }}/release/forge-aes31-qc.exe","target/${{ matrix.target }}/release/forge-rtp-qc.exe","target/${{ matrix.target }}/release/forge-nmos-qc.exe","target/${{ matrix.target }}/release/forge-st2022-7-qc.exe","target/${{ matrix.target }}/release/forge-report.exe","target/${{ matrix.target }}/release/forge-multi-delivery.exe","target/${{ matrix.target }}/release/forge-segment-normalize.exe","target/${{ matrix.target }}/release/forge-ac4-qc.exe","target/${{ matrix.target }}/release/forge-mpegh-qc.exe","target/${{ matrix.target }}/release/forge-dts-qc.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/forge-live.clap"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.library }}" "$staging/${{ matrix.library }}"
          $importLibrary = Get-ChildItem "target/${{ matrix.target }}/release" -Filter "forge_normalizer*.lib" | Select-Object -First 1
          if ($null -eq $importLibrary) { throw "Forge import library was not produced" }
          Copy-Item $importLibrary.FullName "$staging/forge_normalizer.lib"
          New-Item -ItemType Directory -Path "$staging/include" | Out-Null
          Copy-Item include/forge_normalizer.h "$staging/include/"
          New-Item -ItemType Directory -Path "$staging/integrations/ffmpeg","$staging/integrations/gstreamer" | Out-Null
          Copy-Item "integrations/ffmpeg/forge_ffmpeg_bridge.c","integrations/ffmpeg/forge_ffmpeg_bridge.h" "$staging/integrations/ffmpeg/"
          Copy-Item integrations/gstreamer/gstforge.c "$staging/integrations/gstreamer/"
          New-Item -ItemType Directory -Path "$staging/integrations/au" | Out-Null
          Copy-Item "integrations/au/CMakeLists.txt","integrations/au/au-info.plist" "$staging/integrations/au/"
          New-Item -ItemType Directory -Path "$staging/integrations/vst3/external/vst3sdk" -Force | Out-Null
          Copy-Item "integrations/vst3/CMakeLists.txt","integrations/vst3/forge_vst3_ids.h","integrations/vst3/forge_vst3_processor.h","integrations/vst3/forge_vst3_processor.cpp","integrations/vst3/forge_vst3_controller.h","integrations/vst3/forge_vst3_controller.cpp","integrations/vst3/forge_vst3_entry.cpp","integrations/vst3/version.h" "$staging/integrations/vst3/"
          Copy-Item integrations/vst3/external/CMakeLists.txt "$staging/integrations/vst3/external/"
          Copy-Item integrations/vst3/external/vst3sdk/CMakeLists.txt "$staging/integrations/vst3/external/vst3sdk/"
          New-Item -ItemType Directory -Path "$staging/tools","$staging/schema","$staging/proto" | Out-Null
          Copy-Item proto/forge_service.proto "$staging/proto/"
          Copy-Item @("tools/benchmark.py","tools/test-vst3-adapter.sh","tools/test-au-adapter.sh") "$staging/tools/"
          Copy-Item schema/performance-benchmark-v1.schema.json "$staging/schema/"
          Copy-Item schema/doctor-report-v1.schema.json "$staging/schema/"
          Copy-Item "schema/multi-delivery-request-v1.schema.json","schema/multi-delivery-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/segment-normalization-request-v1.schema.json","schema/segment-normalization-plan-v1.schema.json","schema/segment-normalization-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/ac4-adapter-request-v1.schema.json","schema/ac4-adapter-response-v1.schema.json","schema/ac4-adapter-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/mpegh-adapter-request-v1.schema.json","schema/mpegh-adapter-response-v1.schema.json","schema/mpegh-adapter-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/dts-adapter-request-v1.schema.json","schema/dts-adapter-response-v1.schema.json","schema/dts-adapter-report-v1.schema.json" "$staging/schema/"
          Copy-Item schema/adm-presentation-report-v1.schema.json "$staging/schema/"
          Copy-Item "schema/downmix-qc-request-v1.schema.json","schema/downmix-qc-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/binaural-qc-request-v1.schema.json","schema/binaural-qc-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/remediation-request-v1.schema.json","schema/remediation-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/metadata-repair-request-v1.schema.json","schema/metadata-repair-report-v1.schema.json" "$staging/schema/"
          Copy-Item "schema/audio-anomaly-provider-v1.schema.json","schema/anomaly-provider-audit-v1.schema.json","schema/model-qc-v1.schema.json","schema/onnx-anomaly-model-v1.schema.json","schema/onnx-feature-frames-v1.schema.json","schema/remote-range-v1.schema.json","schema/remote-qc-v1.schema.json","schema/service-analysis-v1.schema.json","schema/service-error-v1.schema.json","schema/service-health-v1.schema.json" "$staging/schema/"
          Copy-Item "README.md","PERFORMANCE.md","BATCH-JOBS.md","WATCH-FOLDERS.md","ANALYSIS-CACHE.md","CATALOGUE.md","BENCHMARKS.md","MULTI-DELIVERY.md","SEGMENT-NORMALIZATION.md","AC4-ADAPTER.md","MPEGH-ADAPTER.md","DTS-ADAPTER.md","ADM-PRESENTATION-QC.md","ANOMALY-ADAPTER.md","SERVICE-METRICS.md","C-API.md","HOST-ADAPTERS.md","VST3-ADAPTER.md","AU-ADAPTER.md","IMMERSIVE-DOWNMIX.md","BINAURAL-QC.md","REMEDIATION.md","METADATA-REPAIR.md","NEXT-GENERATION-PLAN.md","ROADMAP.md","LICENSE" $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-${{ matrix.asset }}
          path: |
            forge-v${{ needs.validate.outputs.version }}-${{ matrix.asset }}.*
            forge_normalizer-${{ needs.validate.outputs.version }}-*.whl
          if-no-files-found: error
          retention-days: 7

  build-linux-v3:
    name: Build linux-x86_64-v3
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: x86_64-unknown-linux-gnu
          components: llvm-tools-preview

      - name: Build the reproducible PGO x86-64-v3 CLI
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          FORGE_PGO_FEATURES: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
          FORGE_PGO_ROOT: ${{ github.workspace }}/target/forge-pgo-x86_64-v3
          FORGE_PGO_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -Ctarget-cpu=x86-64-v3
        shell: bash
        run: tools/build-pgo-forge.sh x86_64-unknown-linux-gnu

      - name: Stage x86-64-v3 PGO build inputs
        shell: bash
        run: |
          cp \
            target/forge-pgo-x86_64-v3/canonical-profile.txt \
            "forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.pgo-profile.txt"
          cp \
            target/forge-pgo-x86_64-v3/training.json \
            "forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.pgo-training.json"

      - name: Upload x86-64-v3 PGO build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-pgo-profile-linux-x86_64-v3
          path: |
            forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.pgo-profile.txt
            forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.pgo-training.json
          if-no-files-found: error
          retention-days: 7

      - name: Package the supplemental x86-64-v3 CLI
        shell: bash
        run: >-
          tools/package-linux-v3-release.sh
          "${{ needs.validate.outputs.version }}"
          target/forge-pgo-x86_64-v3/optimized/x86_64-unknown-linux-gnu/release/forge
          "${{ needs.validate.outputs.source-date-epoch }}"
          .

      - name: Upload the x86-64-v3 CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-linux-x86_64-v3
          path: forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.tar.gz
          if-no-files-found: error
          retention-days: 7

  reproducible-linux:
    name: Reproduce Linux release
    needs: [validate, build, build-linux-v3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install matching LLVM PGO tools
        run: rustup component add llvm-tools-preview

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned Python wheel build tools
        run: python -m pip install --disable-pip-version-check build==1.5.0 setuptools==83.0.0 wheel==0.47.0

      - name: Download published build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-x86_64
          path: actual

      - name: Download published x86-64-v3 candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-linux-x86_64-v3
          path: actual

      - name: Download generic Linux PGO profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-pgo-profile-linux-x86_64
          path: actual-profile

      - name: Download x86-64-v3 PGO profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-pgo-profile-linux-x86_64-v3
          path: actual-v3-profile

      - name: Rebuild from recorded PGO inputs and compare
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          FORGE_PGO_FEATURES: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
          FORGE_PGO_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace
          FORGE_PGO_V3_ROOT: ${{ github.workspace }}/target/forge-pgo-x86_64-v3
          FORGE_PGO_V3_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -Ctarget-cpu=x86-64-v3
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-gnu --features opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service,cuda-truepeak
          FORGE_PGO_PROFILE_INPUT="$GITHUB_WORKSPACE/actual-profile/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.pgo-profile.txt" \
            tools/build-pgo-forge.sh x86_64-unknown-linux-gnu
          cp \
            target/forge-pgo-x86_64-unknown-linux-gnu/optimized/x86_64-unknown-linux-gnu/release/forge \
            target/x86_64-unknown-linux-gnu/release/forge
          FORGE_PGO_ROOT="$FORGE_PGO_V3_ROOT" \
            FORGE_PGO_RUSTFLAGS="$FORGE_PGO_V3_RUSTFLAGS" \
            FORGE_PGO_PROFILE_INPUT="$GITHUB_WORKSPACE/actual-v3-profile/forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.pgo-profile.txt" \
            tools/build-pgo-forge.sh x86_64-unknown-linux-gnu
          mkdir reproduced
          tools/package-linux-release.sh "${{ needs.validate.outputs.version }}" x86_64-unknown-linux-gnu "${{ needs.validate.outputs.source-date-epoch }}" reproduced
          tools/package-linux-v3-release.sh \
            "${{ needs.validate.outputs.version }}" \
            target/forge-pgo-x86_64-v3/optimized/x86_64-unknown-linux-gnu/release/forge \
            "${{ needs.validate.outputs.source-date-epoch }}" \
            reproduced
          python tools/build-python-wheel.py \
            --library target/x86_64-unknown-linux-gnu/release/libforge_normalizer.so \
            --library-name libforge_normalizer.so \
            --platform manylinux_2_34_x86_64 \
            --outdir reproduced \
            --version "${{ needs.validate.outputs.version }}"
          cmp \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" \
            "reproduced/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz"
          cmp \
            "actual/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl" \
            "reproduced/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl"
          cmp \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.tar.gz" \
            "reproduced/forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.tar.gz"
          sha256sum \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" \
            "reproduced/forge-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" \
            "actual/forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.tar.gz" \
            "reproduced/forge-v${{ needs.validate.outputs.version }}-linux-x86_64-v3.tar.gz" \
            "actual/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl" \
            "reproduced/forge_normalizer-${{ needs.validate.outputs.version }}-py3-none-manylinux_2_34_x86_64.whl"

  reproducible-macos-aarch64:
    name: Reproduce macOS ARM64 PGO CLI
    needs: [validate, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0 and matching LLVM PGO tools
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: aarch64-apple-darwin
          components: llvm-tools-preview

      - name: Download published Apple Silicon candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: forge-macos-aarch64
          path: actual

      - name: Download published Apple Silicon PGO profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: apple-pgo-profile-macos-aarch64
          path: actual-profile

      - name: Independently rebuild and compare the PGO CLI
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          FORGE_PGO_FEATURES: opus-encoding,ffmpeg-encoding,lv2-plugin,clap-plugin,onnx-provider,grpc-service
          FORGE_PGO_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -Ctarget-feature=+neon,+aes,+sha2
        shell: bash
        run: |
          set -euo pipefail
          tools/build-pgo-forge.sh aarch64-apple-darwin
          mkdir -p actual/extracted
          tar -xzf \
            "actual/forge-v${{ needs.validate.outputs.version }}-macos-aarch64.tar.gz" \
            -C actual/extracted
          actual_forge="actual/extracted/forge-v${{ needs.validate.outputs.version }}-macos-aarch64/forge"
          reproduced_forge="target/forge-pgo-aarch64-apple-darwin/optimized/aarch64-apple-darwin/release/forge"
          reproduced_profile="target/forge-pgo-aarch64-apple-darwin/canonical-profile.txt"
          cmp "$actual_forge" "$reproduced_forge"
          cmp actual-profile/canonical-profile.txt "$reproduced_profile"
          shasum -a 256 \
            "$actual_forge" \
            "$reproduced_forge" \
            actual-profile/canonical-profile.txt \
            "$reproduced_profile"

  wasm:
    name: Build browser WASM package
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0 and the WebAssembly target
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build and test the browser package
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
        run: |
          mkdir first second
          tools/build-wasm-package.sh "${{ needs.validate.outputs.version }}" first
          node wasm/test/smoke.mjs
          tools/build-wasm-package.sh "${{ needs.validate.outputs.version }}" second
          cmp \
            "first/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz" \
            "second/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz"
          mv "first/forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz" .

      - name: Upload browser package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: forge-wasm-web
          path: forge-v${{ needs.validate.outputs.version }}-wasm-web.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build, build-linux-v3, reproducible-linux, reproducible-macos-aarch64, wasm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: forge-*
          path: dist
          merge-multiple: true

      - name: Generate package-manager manifests
        shell: bash
        run: tools/generate-package-metadata.sh "${{ needs.validate.outputs.version }}" dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/forge-v${{ needs.validate.outputs.version }}.spdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/forge-v${{ needs.validate.outputs.version }}.cdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate evidence and create checksums
        shell: bash
        run: |
          set -euo pipefail
          jq -e . "dist/forge-v${{ needs.validate.outputs.version }}.spdx.json" >/dev/null
          jq -e . "dist/forge-v${{ needs.validate.outputs.version }}.cdx.json" >/dev/null
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Verify SLSA provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          provenance="dist/forge-v${{ needs.validate.outputs.version }}.slsa.jsonl"
          cp "${{ steps.provenance.outputs.bundle-path }}" "$provenance"
          while read -r _ artifact; do
            gh attestation verify "dist/${artifact#./}" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$provenance" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done < dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Forge $TAG"
