name: DSD decode candidate benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/dsd-channel-benchmark.yml"
      - ".github/workflows/benchmark.yml"
      - "schema/performance-benchmark-v1.schema.json"
      - "src/dsd.rs"
      - "tools/benchmark.py"
      - "tools/test_benchmark.py"

permissions:
  contents: read

concurrency:
  group: dsd-decode-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Test the DSD fixture and exact decode contracts
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '' }}
        run: |
          set -euo pipefail
          python3 candidate/tools/test_benchmark.py
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            parallel_channel_blocks_match_serial_processing_bit_exactly \
            -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            mirrored_fir_history_matches_wrapping_reference_bit_exactly \
            -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            ordered_byte_batches_match_per_bit_reference_for_every_tail \
            -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib dsf_and_dsdiff_decode_the_same_signal \
            -- --nocapture

      - name: Build exact baseline and candidate
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc

      - name: Verify exact analysis and one-worker fallback
        shell: bash
        run: |
          set -euo pipefail
          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "${exact_dir}"
          EXACT_DIR="${exact_dir}" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import write_dsf, write_dsdiff

          root = Path(os.environ["EXACT_DIR"])
          write_dsf(root / "stereo.dsf", 3, 2)
          write_dsdiff(root / "stereo.dff", 3, 2)
          PY

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          for extension in dsf dff; do
            "${baseline}" "${exact_dir}/stereo.${extension}" --analyze --json \
              > "${exact_dir}/base-${extension}.json"
            "${candidate}" "${exact_dir}/stereo.${extension}" --analyze --json \
              > "${exact_dir}/candidate-${extension}.json"
            "${candidate}" "${exact_dir}/stereo.${extension}" --jobs 1 --analyze --json \
              > "${exact_dir}/candidate-one-${extension}.json"
            cmp "${exact_dir}/base-${extension}.json" \
              "${exact_dir}/candidate-${extension}.json"
            cmp "${exact_dir}/candidate-${extension}.json" \
              "${exact_dir}/candidate-one-${extension}.json"
          done

      - name: Run default-worker benchmarks in both orders
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --duration-seconds 10
            --iterations 5
            --case dsf-stereo-analyze
            --case dsdiff-stereo-analyze
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-base-first" \
            --output default-base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-candidate-second" \
            --output default-candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-candidate-first" \
            --output default-candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-base-second" \
            --output default-base-second.json "${common[@]}"

      - name: Run one-worker controls in both orders
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          common=(
            --duration-seconds 10
            --iterations 5
            --case dsf-stereo-analyze
            --case dsdiff-stereo-analyze
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-base-first" \
            --output one-base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-candidate-second" \
            --output one-candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-candidate-first" \
            --output one-candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-base-second" \
            --output one-base-second.json "${common[@]}"

      - name: Summarize pooled and per-order medians
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          summary = {"system": {}, "modes": {}}
          for mode in ("default", "one"):
              paths = {
                  "base_first": Path(f"{mode}-base-first.json"),
                  "candidate_second": Path(f"{mode}-candidate-second.json"),
                  "candidate_first": Path(f"{mode}-candidate-first.json"),
                  "base_second": Path(f"{mode}-base-second.json"),
              }
              documents = {name: json.loads(path.read_text()) for name, path in paths.items()}
              assert all(document["passed"] for document in documents.values())
              if not summary["system"]:
                  summary["system"] = documents["base_first"]["system"]
              indexed = {
                  name: {item["id"]: item for item in document["results"]}
                  for name, document in documents.items()
              }
              rows = []
              for case_id in indexed["base_first"]:
                  row = {"id": case_id, "samples_per_binary": 10}
                  for metric, key in (("wall", "wall_seconds"), ("cpu", None)):
                      values = {
                          name: [
                              sample[key] if key else sample["user_cpu_seconds"] + sample["system_cpu_seconds"]
                              for sample in cases[case_id]["samples"]
                          ]
                          for name, cases in indexed.items()
                      }
                      baseline = values["base_first"] + values["base_second"]
                      candidate = values["candidate_first"] + values["candidate_second"]
                      base_median = statistics.median(baseline)
                      candidate_median = statistics.median(candidate)
                      row[metric] = {
                          "base_first_median": statistics.median(values["base_first"]),
                          "candidate_second_median": statistics.median(values["candidate_second"]),
                          "candidate_first_median": statistics.median(values["candidate_first"]),
                          "base_second_median": statistics.median(values["base_second"]),
                          "baseline_pooled_median": base_median,
                          "candidate_pooled_median": candidate_median,
                          "change_percent": (candidate_median / base_median - 1.0) * 100.0,
                      }
                  rows.append(row)
              summary["modes"]["default" if mode == "default" else "jobs_1"] = rows

          Path("dsd-decode-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dsd-decode-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: |
            default-*.json
            one-*.json
            dsd-decode-summary.json
          if-no-files-found: error
          retention-days: 30
