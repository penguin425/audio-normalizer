name: AArch64 NEON candidate benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/aarch64-neon-benchmark.yml"
      - "examples/aarch64_quantizer_benchmark.rs"
      - "src/dsp/convert.rs"

permissions:
  contents: read

concurrency:
  group: aarch64-neon-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Add the identical quantizer harness to the baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/examples
          cp candidate/examples/aarch64_quantizer_benchmark.rs baseline/examples/

      - name: Prove candidate SIMD output against the scalar reference
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
          RUSTFLAGS: -Ctarget-feature=+neon,+aes,+sha2
        run: >-
          cargo test --locked --manifest-path candidate/Cargo.toml
          --lib dsp::convert::tests -- --nocapture

      - name: Build baseline and candidate after tests
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: -Ctarget-feature=+neon,+aes,+sha2
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --bin forge \
              --example aarch64_quantizer_benchmark
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --bin forge \
              --example aarch64_quantizer_benchmark

      - name: Run quantizer benchmarks in both orders
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/target-baseline/release/examples/aarch64_quantizer_benchmark" 9 > quantizer-base-first.json
          "${RUNNER_TEMP}/target-candidate/release/examples/aarch64_quantizer_benchmark" 9 > quantizer-candidate-first.json
          "${RUNNER_TEMP}/target-candidate/release/examples/aarch64_quantizer_benchmark" 9 > quantizer-candidate-second.json
          "${RUNNER_TEMP}/target-baseline/release/examples/aarch64_quantizer_benchmark" 9 > quantizer-base-second.json

      - name: Run end-to-end normalization benchmarks in both orders
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --duration-seconds 300
            --iterations 5
            --case wav-stereo-normalize
            --case wav-7.1-normalize
            --case wav-to-flac-verify
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --container-qc "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/bench-base-first" \
            --output normalize-base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --container-qc "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/bench-candidate-first" \
            --output normalize-candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --container-qc "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/bench-candidate-second" \
            --output normalize-candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --container-qc "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/bench-base-second" \
            --output normalize-base-second.json "${common[@]}"

      - name: Summarize pooled medians and verify checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          quantizer_files = {
              "baseline": [Path("quantizer-base-first.json"), Path("quantizer-base-second.json")],
              "candidate": [Path("quantizer-candidate-first.json"), Path("quantizer-candidate-second.json")],
          }
          normalize_files = {
              "baseline": [Path("normalize-base-first.json"), Path("normalize-base-second.json")],
              "candidate": [Path("normalize-candidate-first.json"), Path("normalize-candidate-second.json")],
          }

          def indexed(paths):
              documents = [json.loads(path.read_text()) for path in paths]
              return [{item["id"]: item for item in document["results"]} for document in documents]

          quantizer = {name: indexed(paths) for name, paths in quantizer_files.items()}
          normalization = {name: indexed(paths) for name, paths in normalize_files.items()}
          summary = {"quantizer": [], "normalization": []}

          for case_id in quantizer["baseline"][0]:
              base_items = [document[case_id] for document in quantizer["baseline"]]
              candidate_items = [document[case_id] for document in quantizer["candidate"]]
              checksums = {item["checksum"] for item in base_items + candidate_items}
              assert len(checksums) == 1, (case_id, checksums)
              base = statistics.median(value for item in base_items for value in item["seconds"])
              candidate = statistics.median(value for item in candidate_items for value in item["seconds"])
              summary["quantizer"].append({
                  "id": case_id,
                  "baseline_seconds": base,
                  "candidate_seconds": candidate,
                  "wall_change_percent": (candidate / base - 1.0) * 100.0,
                  "checksum": checksums.pop(),
              })

          for case_id in normalization["baseline"][0]:
              base_items = [document[case_id] for document in normalization["baseline"]]
              candidate_items = [document[case_id] for document in normalization["candidate"]]
              base = statistics.median(
                  sample["wall_seconds"] for item in base_items for sample in item["samples"]
              )
              candidate = statistics.median(
                  sample["wall_seconds"] for item in candidate_items for sample in item["samples"]
              )
              summary["normalization"].append({
                  "id": case_id,
                  "baseline_seconds": base,
                  "candidate_seconds": candidate,
                  "wall_change_percent": (candidate / base - 1.0) * 100.0,
              })

          Path("aarch64-neon-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: aarch64-neon-benchmark
          path: |
            quantizer-*.json
            normalize-*.json
            aarch64-neon-summary.json
          if-no-files-found: error
          retention-days: 30
