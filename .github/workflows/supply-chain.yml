name: Supply chain

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tools/check-workflow-pins.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-integrity:
    name: Immutable workflow dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Reject mutable external Action references
        run: python3 tools/check-workflow-pins.py

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Audit advisories, licences, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: "1.97.0"

  minimum-rust:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - name: Check minimum-supported Rust
        run: cargo check --locked --no-default-features --all-targets
