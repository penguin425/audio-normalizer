name: Supply chain

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "tools/check-workflow-pins.py"
      - "tools/run-pinned-container.py"
      - "tools/test_workflow_pins.py"
      - "tools/workflow-check-requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-integrity:
    name: Immutable workflow dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Select Python 3.12 for workflow structure checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-locked workflow structure checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          workflow_check_root="${RUNNER_TEMP}/forge-workflow-check"
          python3 -m venv "$workflow_check_root"
          workflow_check_python="$workflow_check_root/bin/python"
          "$workflow_check_python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --require-hashes \
            --only-binary=:all: \
            -r tools/workflow-check-requirements.lock
          echo "FORGE_WORKFLOW_CHECK_PYTHON=$workflow_check_python" >> "$GITHUB_ENV"

      - name: Reject mutable workflow dependencies and test the scanner
        run: |
          "$FORGE_WORKFLOW_CHECK_PYTHON" tools/check-workflow-pins.py
          "$FORGE_WORKFLOW_CHECK_PYTHON" -m unittest tools/test_workflow_pins.py

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Audit advisories, licences, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: "1.97.0"

  minimum-rust:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - name: Check minimum-supported Rust
        run: cargo check --locked --no-default-features --all-targets
