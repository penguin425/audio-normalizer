name: Symphonia packet coalescing benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/symphonia-packet-coalescing-benchmark.yml"
      - "src/decoder.rs"
      - "src/dsp/lufs.rs"
      - "src/normalize.rs"
      - "src/pcm_spool.rs"
      - "tools/benchmark.py"
      - "tools/paired_benchmark.py"
      - "tools/test_benchmark.py"

permissions:
  contents: read

concurrency:
  group: symphonia-packet-coalescing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          elif ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Test decoder and benchmark contracts
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
        run: |
          set -euo pipefail
          python3 candidate/tools/test_benchmark.py
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            symphonia_render_packets_coalesce_without_splitting_large_chunks \
            -- --nocapture

      - name: Build exact baseline and candidate
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '-Ctarget-cpu=native' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc

      - name: Verify revision-aware exact MP3, AAC, and Vorbis results
        shell: bash
        run: |
          set -euo pipefail
          baseline_revision="$(
            sed -n 's/^pub const MEASUREMENT_ALGORITHM_REVISION: &str = "\(.*\)";$/\1/p' \
              baseline/src/bound_analysis.rs
          )"
          candidate_revision="$(
            sed -n 's/^pub const MEASUREMENT_ALGORITHM_REVISION: &str = "\(.*\)";$/\1/p' \
              candidate/src/bound_analysis.rs
          )"
          test -n "${baseline_revision}"
          test -n "${candidate_revision}"
          require_baseline_identity=true
          if [[ "${baseline_revision}" != "${candidate_revision}" ]]; then
            if [[ "${baseline_revision}" != "forge-bs1770-5-r3" || \
                  "${candidate_revision}" != "forge-bs1770-5-r4" ]]; then
              echo "Unapproved measurement migration: ${baseline_revision} -> ${candidate_revision}" >&2
              exit 1
            fi
            require_baseline_identity=false
            echo "Using approved r3 -> r4 fixed-oracle migration fixture"
          fi

          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "${exact_dir}"
          EXACT_DIR="${exact_dir}" python3 - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import encode_fixture, write_pcm16_wave

          root = Path(os.environ["EXACT_DIR"])
          source = root / "source.wav"
          write_pcm16_wave(source, 60, 48_000, 2)
          ffmpeg = Path(shutil.which("ffmpeg"))
          fixtures = (
              (
                  "mp3",
                  [
                      "-map_metadata", "-1",
                      "-c:a", "libmp3lame",
                      "-b:a", "192k",
                      "-write_xing", "0",
                  ],
              ),
              (
                  "m4a",
                  ["-map_metadata", "-1", "-c:a", "aac", "-b:a", "192k"],
              ),
              (
                  "ogg",
                  [
                      "-map_metadata", "-1",
                      "-c:a", "vorbis",
                      "-strict", "-2",
                      "-q:a", "5",
                  ],
              ),
          )
          for extension, arguments in fixtures:
              encode_fixture(
                  ffmpeg,
                  source,
                  root / f"input.{extension}",
                  arguments,
                  1_800,
              )
          source.unlink()
          PY

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          for extension in mp3 m4a ogg; do
            input="${exact_dir}/input.${extension}"
            "${baseline}" "${input}" --analyze --json \
              > "${exact_dir}/base-${extension}.json"
            "${candidate}" "${input}" --analyze --json \
              > "${exact_dir}/candidate-${extension}.json"
            "${candidate}" "${input}" --jobs 1 --analyze --json \
              > "${exact_dir}/candidate-${extension}-one.json"
            cmp "${exact_dir}/candidate-${extension}.json" \
              "${exact_dir}/candidate-${extension}-one.json"
            if [[ "${require_baseline_identity}" == true ]]; then
              cmp "${exact_dir}/base-${extension}.json" \
                "${exact_dir}/candidate-${extension}.json"
            fi

            "${baseline}" "${input}" --overwrite \
              -o "${exact_dir}/base-${extension}.wav"
            "${candidate}" "${input}" --overwrite \
              -o "${exact_dir}/candidate-${extension}.wav"
            "${candidate}" "${input}" --jobs 1 --overwrite \
              -o "${exact_dir}/candidate-${extension}-one.wav"
            cmp "${exact_dir}/candidate-${extension}.wav" \
              "${exact_dir}/candidate-${extension}-one.wav"
            if [[ "${require_baseline_identity}" == true ]]; then
              cmp "${exact_dir}/base-${extension}.wav" \
                "${exact_dir}/candidate-${extension}.wav"
            fi
          done

      - name: Run thermally balanced interleaved MP3 benchmarks
        shell: bash
        env:
          BENCHMARK_ROOT: ${{ runner.temp }}/packet-coalescing-benchmark
          BENCHMARK_OUTPUT_PARENT: ${{ runner.os == 'Linux' && '/dev/shm' || runner.temp }}
          BASELINE_FORGE: ${{ runner.temp }}/target-baseline/release/forge
          CANDIDATE_FORGE: ${{ runner.temp }}/target-candidate/release/forge
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import shutil
          import statistics
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import (
              cpu_model,
              encode_fixture,
              run_measured,
              write_pcm16_wave,
          )
          from paired_benchmark import (
              alternating_schedule,
              paired_round_differences,
              paired_round_limit_exceedances,
              regression_reproduced,
          )

          DURATION_SECONDS = 600
          TIMEOUT_SECONDS = 1_800
          WARMUP_ROUNDS = 2
          MEASURED_ROUNDS = 7
          SAMPLES_PER_BINARY = MEASURED_ROUNDS * 2
          RSS_ROUND_LIMIT_BYTES = 4 * 1024 * 1024
          MODES = (
              ("default", []),
              ("jobs_1", ["--jobs", "1"]),
          )
          CASES = ("analyze", "normalize")

          root = Path(os.environ["BENCHMARK_ROOT"])
          root.mkdir()
          output_parent = Path(os.environ["BENCHMARK_OUTPUT_PARENT"])
          output_root = output_parent / f"forge-packet-output-{os.getpid()}"
          if shutil.disk_usage(output_parent).free < 256 * 1024 * 1024:
              raise RuntimeError(
                  f"benchmark output filesystem has less than 256 MiB free: "
                  f"{output_parent}"
              )
          output_root.mkdir()
          logs = root / "logs"
          logs.mkdir()
          source = root / "source.wav"
          input_path = root / "input.mp3"
          write_pcm16_wave(source, DURATION_SECONDS, 48_000, 2)
          encode_fixture(
              Path(shutil.which("ffmpeg")),
              source,
              input_path,
              [
                  "-map_metadata", "-1",
                  "-c:a", "libmp3lame",
                  "-b:a", "320k",
              ],
              TIMEOUT_SECONDS,
          )
          source.unlink()

          binaries = {
              "baseline": Path(os.environ["BASELINE_FORGE"]),
              "candidate": Path(os.environ["CANDIDATE_FORGE"]),
          }
          def measurement_revision(repository):
              prefix = 'pub const MEASUREMENT_ALGORITHM_REVISION: &str = "'
              for line in (repository / "src/bound_analysis.rs").read_text(
                  encoding="utf-8"
              ).splitlines():
                  if line.startswith(prefix) and line.endswith('";'):
                      return line[len(prefix):-2]
              raise AssertionError(f"missing measurement revision in {repository}")

          def package_version(repository):
              with (repository / "Cargo.toml").open("rb") as source_file:
                  return tomllib.load(source_file)["package"]["version"]

          def git_revision(repository):
              return subprocess.run(
                  ["git", "-C", str(repository), "rev-parse", "HEAD"],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              ).stdout.strip()

          baseline_repository = Path("baseline")
          candidate_repository = Path("candidate")
          versions = {
              "baseline": package_version(baseline_repository),
              "candidate": package_version(candidate_repository),
          }
          revisions = {
              "baseline": {
                  "git": git_revision(baseline_repository),
                  "measurement": measurement_revision(baseline_repository),
              },
              "candidate": {
                  "git": git_revision(candidate_repository),
                  "measurement": measurement_revision(candidate_repository),
              },
          }
          migrations = {
              "stable_input": (
                  not (baseline_repository / "src/stable_input.rs").is_file()
                  and (candidate_repository / "src/stable_input.rs").is_file()
              ),
              "measurement_r3_to_r4": (
                  revisions["baseline"]["measurement"] == "forge-bs1770-5-r3"
                  and revisions["candidate"]["measurement"]
                  == "forge-bs1770-5-r4"
              ),
              "durability_0_189_5_to_0_189_6": (
                  versions["baseline"] == "0.189.5"
                  and versions["candidate"] == "0.189.6"
              ),
          }
          normalization_aggregate_limit = (
              5.0
              if migrations["measurement_r3_to_r4"]
              else 3.0
              if migrations["stable_input"]
              else 2.0
              if migrations["durability_0_189_5_to_0_189_6"]
              else 1.0
          )
          configuration = {
              "fixture": {
                  "duration_seconds": DURATION_SECONDS,
                  "sample_rate_hz": 48_000,
                  "channels": 2,
                  "codec": "libmp3lame",
                  "bitrate": "320k",
              },
              "modes": {name: arguments for name, arguments in MODES},
              "cases": list(CASES),
              "warmup_rounds": WARMUP_ROUNDS,
              "measured_rounds": MEASURED_ROUNDS,
              "samples_per_binary_per_case": SAMPLES_PER_BINARY,
              "timeout_seconds": TIMEOUT_SECONDS,
              "rss_round_limit_bytes": RSS_ROUND_LIMIT_BYTES,
          }

          def validate_sample(sample):
              assert set(sample) == {
                  "exit_code",
                  "wall_seconds",
                  "user_cpu_seconds",
                  "system_cpu_seconds",
                  "cpu_percent",
                  "peak_rss_bytes",
              }, sample
              assert (
                  isinstance(sample["exit_code"], int)
                  and not isinstance(sample["exit_code"], bool)
                  and sample["exit_code"] == 0
              ), sample
              for key in (
                  "wall_seconds",
                  "user_cpu_seconds",
                  "system_cpu_seconds",
                  "cpu_percent",
                  "peak_rss_bytes",
              ):
                  value = sample[key]
                  assert (
                      isinstance(value, (int, float))
                      and not isinstance(value, bool)
                      and math.isfinite(value)
                  ), (key, value, sample)
              assert sample["wall_seconds"] > 0.0, sample
              assert sample["user_cpu_seconds"] >= 0.0, sample
              assert sample["system_cpu_seconds"] >= 0.0, sample
              assert sample["cpu_percent"] >= 0.0, sample
              assert (
                  isinstance(sample["peak_rss_bytes"], int)
                  and sample["peak_rss_bytes"] >= 0
              ), sample

          def summarize_case(samples, rounds):
              summary = {"samples_per_binary": len(samples["baseline"])}
              for label, getter in (
                  ("wall", lambda sample: sample["wall_seconds"]),
                  (
                      "cpu",
                      lambda sample: sample["user_cpu_seconds"]
                      + sample["system_cpu_seconds"],
                  ),
              ):
                  baseline = [getter(sample) for sample in samples["baseline"]]
                  candidate = [getter(sample) for sample in samples["candidate"]]
                  round_changes = []
                  for round_result in rounds:
                      baseline_round = statistics.median(
                          getter(sample)
                          for sample in round_result["samples"]["baseline"]
                      )
                      candidate_round = statistics.median(
                          getter(sample)
                          for sample in round_result["samples"]["candidate"]
                      )
                      round_changes.append(
                          (candidate_round / baseline_round - 1.0) * 100.0
                      )
                  baseline_median = statistics.median(baseline)
                  candidate_median = statistics.median(candidate)
                  summary[label] = {
                      "baseline_median": baseline_median,
                      "candidate_median": candidate_median,
                      "pooled_change_percent": (
                          candidate_median / baseline_median - 1.0
                      )
                      * 100.0,
                      "median_paired_round_change_percent": statistics.median(
                          round_changes
                      ),
                      "paired_round_changes_percent": round_changes,
                  }
              rss_round_differences = paired_round_differences(
                  rounds,
                  lambda sample: sample["peak_rss_bytes"],
                  reducer=max,
              )
              rss_exceeding_rounds = paired_round_limit_exceedances(
                  rss_round_differences, RSS_ROUND_LIMIT_BYTES
              )
              raw_rss_maxima = {
                  name: max(sample["peak_rss_bytes"] for sample in values)
                  for name, values in samples.items()
              }
              summary["peak_rss_bytes"] = {
                  # Retain raw/gross maxima as evidence. The memory gate uses
                  # the drift-resistant paired-round population below.
                  **raw_rss_maxima,
                  "raw_max_delta_bytes": (
                      raw_rss_maxima["candidate"] - raw_rss_maxima["baseline"]
                  ),
                  "paired_round_differences_bytes": rss_round_differences,
                  "paired_round_limit_bytes": RSS_ROUND_LIMIT_BYTES,
                  "paired_round_exceeding_indices": rss_exceeding_rounds,
                  "median_paired_round_difference_bytes": statistics.median(
                      rss_round_differences
                  ),
              }
              return summary

          def run_population(population):
              population_logs = logs / population
              population_logs.mkdir()
              population_modes = {}
              for mode, extra_args in MODES:
                  mode_cases = {}
                  for case in CASES:
                      samples = {"baseline": [], "candidate": []}
                      warmup_rounds = []
                      rounds = []
                      output_path = (
                          output_root / f"{population}-{mode}-{case}-output.wav"
                      )

                      def command(name):
                          if case == "analyze":
                              return [
                                  str(binaries[name]),
                                  str(input_path),
                                  *extra_args,
                                  "--analyze",
                                  "--json",
                              ]
                          output_path.unlink(missing_ok=True)
                          return [
                              str(binaries[name]),
                              str(input_path),
                              *extra_args,
                              "--overwrite",
                              "-o",
                              str(output_path),
                          ]

                      def measure(name, label):
                          sample = run_measured(
                              command(name),
                              TIMEOUT_SECONDS,
                              population_logs
                              / f"{mode}-{case}-{label}-{name}.out",
                              population_logs
                              / f"{mode}-{case}-{label}-{name}.err",
                          )
                          output_path.unlink(missing_ok=True)
                          validate_sample(sample)
                          return sample

                      # Each population settles executable/input pages and the
                      # hosted runner independently. Warm-up samples remain as
                      # raw evidence but are excluded from every statistic.
                      warmup_schedule = alternating_schedule(WARMUP_ROUNDS)
                      for warmup_index in range(WARMUP_ROUNDS):
                          order = warmup_schedule[
                              warmup_index * 4 : (warmup_index + 1) * 4
                          ]
                          round_samples = {"baseline": [], "candidate": []}
                          for position, name in enumerate(order):
                              sample = measure(
                                  name,
                                  f"warm-{warmup_index:02d}-{position}",
                              )
                              round_samples[name].append(sample)
                          warmup_rounds.append(
                              {"order": order, "samples": round_samples}
                          )

                      measured_schedule = alternating_schedule(MEASURED_ROUNDS)
                      for round_index in range(MEASURED_ROUNDS):
                          order = measured_schedule[
                              round_index * 4 : (round_index + 1) * 4
                          ]
                          round_samples = {"baseline": [], "candidate": []}
                          for position, name in enumerate(order):
                              sample = measure(name, f"{round_index:02d}-{position}")
                              samples[name].append(sample)
                              round_samples[name].append(sample)
                          rounds.append({"order": order, "samples": round_samples})

                      mode_cases[case] = {
                          "summary": summarize_case(samples, rounds),
                          "samples": samples,
                          "warmup_rounds": warmup_rounds,
                          "rounds": rounds,
                      }
                  population_modes[mode] = mode_cases
              return population_modes

          def normalization_aggregates(modes):
              pooled = []
              paired = []
              for mode, _extra_args in MODES:
                  summary = modes[mode]["normalize"]["summary"]
                  for metric in ("wall", "cpu"):
                      pooled.append(summary[metric]["pooled_change_percent"])
                      paired.append(
                          summary[metric][
                              "median_paired_round_change_percent"
                          ]
                      )
              assert len(pooled) == 4, pooled
              assert len(paired) == 4, paired
              assert all(math.isfinite(value) for value in pooled), pooled
              assert all(math.isfinite(value) for value in paired), paired
              return {
                  "pooled": statistics.fmean(pooled),
                  "paired": statistics.fmean(paired),
              }

          initial_modes = run_population("initial")
          initial_aggregates = normalization_aggregates(initial_modes)
          # Only an aggregate boundary crossing earns a second population.
          # Individual case and RSS limits remain initial-population tripwires
          # in the enforcement step below.
          requested_statistics = [
              statistic
              for statistic, change in initial_aggregates.items()
              if change > normalization_aggregate_limit
          ]
          confirmation_modes = None
          confirmation_aggregates = None
          if requested_statistics:
              confirmation_modes = run_population("confirmation")
              confirmation_aggregates = normalization_aggregates(
                  confirmation_modes
              )
          reproduced = {
              statistic: (
                  confirmation_aggregates is not None
                  and regression_reproduced(
                      initial_aggregates[statistic],
                      confirmation_aggregates[statistic],
                      normalization_aggregate_limit,
                  )
              )
              for statistic in ("pooled", "paired")
          }
          result = {
              "schema_version": 2,
              "method": (
                  "each independent population uses two unmeasured balanced "
                  "warm-up blocks followed by 7-round ABBA/BAAB on one "
                  "pre-encoded 600-second MP3 fixture; 14 measured samples "
                  "per binary, mode, and case"
              ),
              "configuration": configuration,
              "versions": versions,
              "revisions": revisions,
              "migrations": migrations,
              "system": {
                  "platform": sys.platform,
                  "cpu_model": cpu_model(),
                  "cpu_count": os.cpu_count(),
                  "output_storage": (
                      "memory-backed" if sys.platform.startswith("linux")
                      else "runner-temp"
                  ),
              },
              "modes": initial_modes,
              "confirmation_modes": confirmation_modes,
              "normalization_aggregate_confirmation": {
                  "limit_percent": normalization_aggregate_limit,
                  "requested_statistics": requested_statistics,
                  "initial": initial_aggregates,
                  "confirmation": confirmation_aggregates,
                  "reproduced": reproduced,
              },
          }

          output_root.rmdir()

          Path("symphonia-packet-coalescing-interleaved.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path("symphonia-packet-coalescing-summary.md").open(
              "w", encoding="utf-8"
          ) as output:
              output.write("## Symphonia packet coalescing benchmark\n\n")
              output.write(
                  "Each independent population uses two unmeasured balanced "
                  "warm-up blocks, then seven measured ABBA/BAAB rounds; "
                  "14 samples per binary, mode, and case.\n"
              )

              def write_population(title, modes):
                  output.write(f"\n### {title} population\n")
                  for mode, cases in modes.items():
                      output.write(f"\n#### {mode}\n\n")
                      output.write(
                          "| Case | Pooled wall | Paired wall | Pooled CPU "
                          "| Paired CPU | Paired RSS delta | RSS rounds >4 MiB "
                          "| Raw max RSS delta |\n"
                      )
                      output.write(
                          "|---|---:|---:|---:|---:|---:|---:|---:|\n"
                      )
                      for case, case_result in cases.items():
                          summary = case_result["summary"]
                          rss = summary["peak_rss_bytes"]
                          output.write(
                              f"| {case} "
                              f"| {summary['wall']['pooled_change_percent']:+.3f}% "
                              f"| {summary['wall']['median_paired_round_change_percent']:+.3f}% "
                              f"| {summary['cpu']['pooled_change_percent']:+.3f}% "
                              f"| {summary['cpu']['median_paired_round_change_percent']:+.3f}% "
                              f"| {rss['median_paired_round_difference_bytes']:+.0f} B "
                              f"| {len(rss['paired_round_exceeding_indices'])}/7 "
                              f"| {rss['raw_max_delta_bytes']:+d} B |\n"
                          )

              write_population("Initial", result["modes"])
              if result["confirmation_modes"] is not None:
                  write_population(
                      "Independent confirmation", result["confirmation_modes"]
                  )

              confirmation = result["normalization_aggregate_confirmation"]
              output.write("\n### Normalization aggregate confirmation\n\n")
              output.write(
                  "| Statistic | Initial | Confirmation | Limit | Reproduced |\n"
              )
              output.write("|---|---:|---:|---:|:---:|\n")
              for statistic in ("pooled", "paired"):
                  confirmation_value = (
                      "n/a"
                      if confirmation["confirmation"] is None
                      else f"{confirmation['confirmation'][statistic]:+.3f}%"
                  )
                  output.write(
                      f"| {statistic} "
                      f"| {confirmation['initial'][statistic]:+.3f}% "
                      f"| {confirmation_value} "
                      f"| {confirmation['limit_percent']:.3f}% "
                      f"| {confirmation['reproduced'][statistic]} |\n"
                  )
          print(json.dumps({
              "initial": result["normalization_aggregate_confirmation"]["initial"],
              "confirmation": result["normalization_aggregate_confirmation"][
                  "confirmation"
              ],
              "limit_percent": normalization_aggregate_limit,
              "reproduced": reproduced,
          }, indent=2))
          PY
          cat symphonia-packet-coalescing-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: symphonia-packet-coalescing-${{ matrix.os }}-${{ runner.arch }}
          path: |
            symphonia-packet-coalescing-interleaved.json
            symphonia-packet-coalescing-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce performance and memory gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import statistics
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from paired_benchmark import (
              alternating_schedule,
              paired_round_differences,
              paired_round_limit_exceedances,
              paired_round_single_outlier_ratchet_passes,
              regression_reproduced,
          )

          evidence = json.loads(
              Path("symphonia-packet-coalescing-interleaved.json").read_text(
                  encoding="utf-8"
              )
          )
          DURATION_SECONDS = 600
          TIMEOUT_SECONDS = 1_800
          WARMUP_ROUNDS = 2
          MEASURED_ROUNDS = 7
          SAMPLES_PER_BINARY = 14
          RSS_ROUND_LIMIT_BYTES = 4 * 1024 * 1024
          MODES = {
              "default": [],
              "jobs_1": ["--jobs", "1"],
          }
          CASES = ("analyze", "normalize")
          expected_configuration = {
              "fixture": {
                  "duration_seconds": DURATION_SECONDS,
                  "sample_rate_hz": 48_000,
                  "channels": 2,
                  "codec": "libmp3lame",
                  "bitrate": "320k",
              },
              "modes": MODES,
              "cases": list(CASES),
              "warmup_rounds": WARMUP_ROUNDS,
              "measured_rounds": MEASURED_ROUNDS,
              "samples_per_binary_per_case": SAMPLES_PER_BINARY,
              "timeout_seconds": TIMEOUT_SECONDS,
              "rss_round_limit_bytes": RSS_ROUND_LIMIT_BYTES,
          }

          stable_input_migration = (
              not Path("baseline/src/stable_input.rs").is_file()
              and Path("candidate/src/stable_input.rs").is_file()
          )

          def measurement_revision(root):
              prefix = 'pub const MEASUREMENT_ALGORITHM_REVISION: &str = "'
              for line in (root / "src/bound_analysis.rs").read_text(
                  encoding="utf-8"
              ).splitlines():
                  if line.startswith(prefix) and line.endswith('";'):
                      return line[len(prefix):-2]
              raise AssertionError(f"missing measurement revision in {root}")

          def package_version(root):
              with (root / "Cargo.toml").open("rb") as source:
                  return tomllib.load(source)["package"]["version"]

          def git_revision(root):
              return subprocess.run(
                  ["git", "-C", str(root), "rev-parse", "HEAD"],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              ).stdout.strip()

          baseline_root = Path("baseline")
          candidate_root = Path("candidate")
          baseline_revision = measurement_revision(baseline_root)
          candidate_revision = measurement_revision(candidate_root)
          versions = {
              "baseline": package_version(baseline_root),
              "candidate": package_version(candidate_root),
          }
          revisions = {
              "baseline": {
                  "git": git_revision(baseline_root),
                  "measurement": baseline_revision,
              },
              "candidate": {
                  "git": git_revision(candidate_root),
                  "measurement": candidate_revision,
              },
          }
          measurement_migration = (
              baseline_revision == "forge-bs1770-5-r3"
              and candidate_revision == "forge-bs1770-5-r4"
          )
          durability_migration = (
              versions["baseline"] == "0.189.5"
              and versions["candidate"] == "0.189.6"
          )
          migrations = {
              "stable_input": stable_input_migration,
              "measurement_r3_to_r4": measurement_migration,
              "durability_0_189_5_to_0_189_6": durability_migration,
          }

          assert set(evidence) == {
              "schema_version",
              "method",
              "configuration",
              "versions",
              "revisions",
              "migrations",
              "system",
              "modes",
              "confirmation_modes",
              "normalization_aggregate_confirmation",
          }, evidence.keys()
          assert evidence["schema_version"] == 2, evidence.get("schema_version")
          assert evidence["configuration"] == expected_configuration, (
              evidence.get("configuration"),
              expected_configuration,
          )
          assert evidence["versions"] == versions, (evidence.get("versions"), versions)
          assert evidence["revisions"] == revisions, (
              evidence.get("revisions"),
              revisions,
          )
          assert evidence["migrations"] == migrations, (
              evidence.get("migrations"),
              migrations,
          )

          # v0.189.3 deliberately adds a private copy plus content hashes and
          # live-source revalidation around the pre-existing decode work. Give
          # that one-time integrity migration a measured, bounded allowance;
          # once StableInput is present in the base, the original tight
          # regression limits automatically apply again.
          # v0.189.5 similarly permits at most 5% on aggregate for the one-time
          # r3 -> r4 numerically stable accumulation migration. Use the same
          # 8% isolated tripwire as the PCM gate to absorb hosted-runner noise;
          # the four-value aggregate below still enforces the 5% budget.
          # v0.189.6 adds durable output and directory publication. Its fixed
          # sync cost is bounded per normalization case and to 2% across the
          # four normalization wall/CPU values; later comparisons return to
          # the original 3%/1% limits. Candidate self-parity and the exact
          # revision/version pairs are enforced earlier in this job.
          analysis_limit = (
              5.0 if stable_input_migration or measurement_migration else 3.0
          )
          normalization_case_limit = (
              8.0
              if measurement_migration
              else 8.0 if durability_migration else 3.0
          )
          normalization_aggregate_limit = (
              5.0
              if measurement_migration
              else 3.0
              if stable_input_migration
              else 2.0 if durability_migration else 1.0
          )

          def require_finite(value, label):
              assert (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and math.isfinite(value)
              ), (label, value)
              return value

          def validate_sample(sample, label):
              assert set(sample) == {
                  "exit_code",
                  "wall_seconds",
                  "user_cpu_seconds",
                  "system_cpu_seconds",
                  "cpu_percent",
                  "peak_rss_bytes",
              }, (label, sample)
              assert (
                  isinstance(sample["exit_code"], int)
                  and not isinstance(sample["exit_code"], bool)
                  and sample["exit_code"] == 0
              ), (label, sample)
              wall = require_finite(sample["wall_seconds"], (label, "wall"))
              user = require_finite(
                  sample["user_cpu_seconds"], (label, "user CPU")
              )
              system = require_finite(
                  sample["system_cpu_seconds"], (label, "system CPU")
              )
              cpu_percent = require_finite(
                  sample["cpu_percent"], (label, "CPU percent")
              )
              rss = require_finite(
                  sample["peak_rss_bytes"], (label, "peak RSS")
              )
              assert wall > 0.0, (label, wall)
              assert user >= 0.0 and system >= 0.0, (label, user, system)
              assert cpu_percent >= 0.0, (label, cpu_percent)
              assert isinstance(rss, int) and rss >= 0, (label, rss)

          def validate_rounds(rounds, count, label):
              assert isinstance(rounds, list) and len(rounds) == count, (
                  label,
                  len(rounds) if isinstance(rounds, list) else rounds,
              )
              expected_schedule = alternating_schedule(count)
              flattened = {"baseline": [], "candidate": []}
              for round_index, round_result in enumerate(rounds):
                  assert set(round_result) == {"order", "samples"}, (
                      label,
                      round_index,
                      round_result,
                  )
                  expected_order = expected_schedule[
                      round_index * 4 : (round_index + 1) * 4
                  ]
                  assert round_result["order"] == expected_order, (
                      label,
                      round_index,
                      round_result["order"],
                      expected_order,
                  )
                  round_samples = round_result["samples"]
                  assert set(round_samples) == {"baseline", "candidate"}, (
                      label,
                      round_index,
                      round_samples,
                  )
                  for binary in ("baseline", "candidate"):
                      values = round_samples[binary]
                      assert isinstance(values, list) and len(values) == 2, (
                          label,
                          round_index,
                          binary,
                          values,
                      )
                      for sample_index, sample in enumerate(values):
                          validate_sample(
                              sample,
                              (label, round_index, binary, sample_index),
                          )
                      flattened[binary].extend(values)
              return flattened

          def recompute_summary(samples, rounds, label):
              summary = {"samples_per_binary": SAMPLES_PER_BINARY}
              for metric, getter in (
                  ("wall", lambda sample: sample["wall_seconds"]),
                  (
                      "cpu",
                      lambda sample: sample["user_cpu_seconds"]
                      + sample["system_cpu_seconds"],
                  ),
              ):
                  baseline = [getter(sample) for sample in samples["baseline"]]
                  candidate = [getter(sample) for sample in samples["candidate"]]
                  assert len(baseline) == SAMPLES_PER_BINARY, (label, metric)
                  assert len(candidate) == SAMPLES_PER_BINARY, (label, metric)
                  for binary, values in (
                      ("baseline", baseline),
                      ("candidate", candidate),
                  ):
                      for sample_index, value in enumerate(values):
                          require_finite(
                              value,
                              (label, metric, binary, sample_index),
                          )
                  round_changes = []
                  for round_index, round_result in enumerate(rounds):
                      baseline_round = statistics.median(
                          getter(sample)
                          for sample in round_result["samples"]["baseline"]
                      )
                      candidate_round = statistics.median(
                          getter(sample)
                          for sample in round_result["samples"]["candidate"]
                      )
                      assert baseline_round > 0.0, (
                          label,
                          metric,
                          round_index,
                          baseline_round,
                      )
                      round_changes.append(
                          (candidate_round / baseline_round - 1.0) * 100.0
                      )
                  baseline_median = statistics.median(baseline)
                  candidate_median = statistics.median(candidate)
                  assert baseline_median > 0.0, (label, metric, baseline_median)
                  summary[metric] = {
                      "baseline_median": baseline_median,
                      "candidate_median": candidate_median,
                      "pooled_change_percent": (
                          candidate_median / baseline_median - 1.0
                      )
                      * 100.0,
                      "median_paired_round_change_percent": statistics.median(
                          round_changes
                      ),
                      "paired_round_changes_percent": round_changes,
                  }
              rss_round_differences = paired_round_differences(
                  rounds,
                  lambda sample: sample["peak_rss_bytes"],
                  reducer=max,
              )
              for round_index, difference in enumerate(rss_round_differences):
                  require_finite(difference, (label, "RSS difference", round_index))
              rss_exceeding_rounds = paired_round_limit_exceedances(
                  rss_round_differences, RSS_ROUND_LIMIT_BYTES
              )
              raw_rss_maxima = {
                  binary: max(
                      sample["peak_rss_bytes"] for sample in binary_samples
                  )
                  for binary, binary_samples in samples.items()
              }
              summary["peak_rss_bytes"] = {
                  **raw_rss_maxima,
                  "raw_max_delta_bytes": (
                      raw_rss_maxima["candidate"] - raw_rss_maxima["baseline"]
                  ),
                  "paired_round_differences_bytes": rss_round_differences,
                  "paired_round_limit_bytes": RSS_ROUND_LIMIT_BYTES,
                  "paired_round_exceeding_indices": rss_exceeding_rounds,
                  "median_paired_round_difference_bytes": statistics.median(
                      rss_round_differences
                  ),
              }
              return summary

          def validate_population(modes, population):
              assert isinstance(modes, dict), (population, modes)
              assert set(modes) == set(MODES), (population, modes.keys())
              for mode in MODES:
                  cases = modes[mode]
                  assert set(cases) == set(CASES), (
                      population,
                      mode,
                      cases.keys(),
                  )
                  for case in CASES:
                      case_result = cases[case]
                      label = (population, mode, case)
                      assert set(case_result) == {
                          "summary",
                          "samples",
                          "warmup_rounds",
                          "rounds",
                      }, (label, case_result.keys())
                      warmup_samples = validate_rounds(
                          case_result["warmup_rounds"],
                          WARMUP_ROUNDS,
                          (*label, "warmup"),
                      )
                      assert all(
                          len(warmup_samples[binary]) == WARMUP_ROUNDS * 2
                          for binary in ("baseline", "candidate")
                      ), (label, warmup_samples)
                      measured_samples = validate_rounds(
                          case_result["rounds"],
                          MEASURED_ROUNDS,
                          (*label, "measured"),
                      )
                      assert case_result["samples"] == measured_samples, (
                          label,
                          case_result["samples"],
                          measured_samples,
                      )
                      computed_summary = recompute_summary(
                          measured_samples,
                          case_result["rounds"],
                          label,
                      )
                      assert case_result["summary"] == computed_summary, (
                          label,
                          case_result["summary"],
                          computed_summary,
                      )

          def normalization_aggregates(modes):
              pooled = []
              paired = []
              for mode in MODES:
                  summary = modes[mode]["normalize"]["summary"]
                  for metric in ("wall", "cpu"):
                      pooled.append(summary[metric]["pooled_change_percent"])
                      paired.append(
                          summary[metric][
                              "median_paired_round_change_percent"
                          ]
                      )
              assert len(pooled) == 4, pooled
              assert len(paired) == 4, paired
              for statistic, values in (("pooled", pooled), ("paired", paired)):
                  for index, value in enumerate(values):
                      require_finite(value, ("aggregate", statistic, index))
              aggregates = {
                  "pooled": statistics.fmean(pooled),
                  "paired": statistics.fmean(paired),
              }
              for statistic, value in aggregates.items():
                  require_finite(value, ("aggregate", statistic))
              return aggregates

          validate_population(evidence["modes"], "initial")
          normalization_pooled = []
          normalization_paired = []
          for mode in MODES:
              for case in CASES:
                  summary = evidence["modes"][mode][case]["summary"]
                  for metric in ("wall", "cpu"):
                      values = summary[metric]
                      pooled = values["pooled_change_percent"]
                      paired = values["median_paired_round_change_percent"]
                      limit = (
                          analysis_limit
                          if case == "analyze"
                          else normalization_case_limit
                      )
                      assert pooled <= limit, (mode, case, metric, "pooled", pooled)
                      assert paired <= limit, (mode, case, metric, "paired", paired)
                      if case == "normalize":
                          normalization_pooled.append(pooled)
                          normalization_paired.append(paired)
                  rss = summary["peak_rss_bytes"]
                  rss_limit = RSS_ROUND_LIMIT_BYTES
                  rss_delta = rss["median_paired_round_difference_bytes"]
                  assert rss_delta <= rss_limit, (
                      mode,
                      case,
                      "median paired-round RSS delta",
                      rss_delta,
                  )
                  rss_round_differences = rss["paired_round_differences_bytes"]
                  assert len(rss_round_differences) == 7, (
                      mode,
                      case,
                      "paired RSS round count",
                      len(rss_round_differences),
                  )
                  assert rss["paired_round_limit_bytes"] == rss_limit, (
                      mode,
                      case,
                      "paired RSS round limit",
                      rss["paired_round_limit_bytes"],
                  )
                  rss_exceeding_rounds = paired_round_limit_exceedances(
                      rss_round_differences, rss_limit
                  )
                  assert (
                      rss["paired_round_exceeding_indices"] == rss_exceeding_rounds
                  ), (
                      mode,
                      case,
                      "paired RSS exceedance evidence",
                      rss["paired_round_exceeding_indices"],
                      rss_exceeding_rounds,
                  )
                  assert paired_round_single_outlier_ratchet_passes(
                      rss_round_differences, rss_limit
                  ), (
                      mode,
                      case,
                      "repeated paired-round RSS regression",
                      rss_exceeding_rounds,
                      rss_round_differences,
                  )
          initial_aggregates = normalization_aggregates(evidence["modes"])
          assert initial_aggregates == {
              "pooled": statistics.fmean(normalization_pooled),
              "paired": statistics.fmean(normalization_paired),
          }, (initial_aggregates, normalization_pooled, normalization_paired)
          confirmation_record = evidence["normalization_aggregate_confirmation"]
          assert set(confirmation_record) == {
              "limit_percent",
              "requested_statistics",
              "initial",
              "confirmation",
              "reproduced",
          }, confirmation_record
          assert (
              confirmation_record["limit_percent"]
              == normalization_aggregate_limit
          ), (
              confirmation_record["limit_percent"],
              normalization_aggregate_limit,
          )
          assert confirmation_record["initial"] == initial_aggregates, (
              confirmation_record["initial"],
              initial_aggregates,
          )
          requested_statistics = [
              statistic
              for statistic in ("pooled", "paired")
              if initial_aggregates[statistic] > normalization_aggregate_limit
          ]
          assert (
              confirmation_record["requested_statistics"]
              == requested_statistics
          ), (
              confirmation_record["requested_statistics"],
              requested_statistics,
          )
          if requested_statistics:
              confirmation_modes = evidence["confirmation_modes"]
              validate_population(confirmation_modes, "confirmation")
              confirmation_aggregates = normalization_aggregates(
                  confirmation_modes
              )
              assert (
                  confirmation_record["confirmation"]
                  == confirmation_aggregates
              ), (
                  confirmation_record["confirmation"],
                  confirmation_aggregates,
              )
          else:
              assert evidence["confirmation_modes"] is None, (
                  "unexpected aggregate confirmation population",
                  evidence["confirmation_modes"],
              )
              assert confirmation_record["confirmation"] is None, (
                  "unexpected aggregate confirmation statistics",
                  confirmation_record["confirmation"],
              )
              confirmation_aggregates = None

          expected_reproduced = {
              statistic: (
                  confirmation_aggregates is not None
                  and regression_reproduced(
                      initial_aggregates[statistic],
                      confirmation_aggregates[statistic],
                      normalization_aggregate_limit,
                  )
              )
              for statistic in ("pooled", "paired")
          }
          assert confirmation_record["reproduced"] == expected_reproduced, (
              confirmation_record["reproduced"],
              expected_reproduced,
          )
          # The packet-coalescing speedup landed in v0.167.0, so both sides of
          # later pull-request comparisons already contain it. Keep this as a
          # tight end-to-end regression sentinel. An independent population
          # may clear runner noise, but the same statistic crossing the same
          # unchanged limit twice remains a regression.
          for statistic in requested_statistics:
              assert not expected_reproduced[statistic], (
                  f"{statistic} normalization aggregate regression reproduced",
                  initial_aggregates[statistic],
                  confirmation_aggregates[statistic],
                  normalization_aggregate_limit,
              )
          if stable_input_migration:
              print("applied one-time StableInput integrity migration limits")
          if measurement_migration:
              print("applied one-time r3 -> r4 measurement migration limits")
          if durability_migration:
              print("applied one-time v0.189.5 -> v0.189.6 durability limits")
          print(
              "initial pooled normalization change: "
              f"{initial_aggregates['pooled']:+.3f}%"
          )
          print(
              "initial paired normalization change: "
              f"{initial_aggregates['paired']:+.3f}%"
          )
          if confirmation_aggregates is not None:
              print(
                  "confirmation pooled normalization change: "
                  f"{confirmation_aggregates['pooled']:+.3f}%"
              )
              print(
                  "confirmation paired normalization change: "
                  f"{confirmation_aggregates['paired']:+.3f}%"
              )
          PY
