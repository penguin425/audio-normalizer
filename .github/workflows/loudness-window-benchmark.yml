name: Loudness window candidate benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/loudness-window-benchmark.yml"
      - "src/dsp/lufs.rs"
      - "tools/benchmark.py"

permissions:
  contents: read

concurrency:
  group: loudness-window-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Test exact running-window arithmetic
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '' }}
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            shared_loudness_windows_match_two_vecdeque_sums_bit_exactly \
            -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            incomplete_trailing_hop_does_not_create_a_block \
            -- --nocapture
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --no-default-features --lib \
            stereo_streaming_measurement_matches_whole_buffer \
            -- --nocapture

      - name: Build exact baseline and candidate
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-Ctarget-feature=+neon,+aes,+sha2' || '' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --no-default-features --bin forge --bin forge-container-qc

      - name: Verify exact analysis and rendered output
        shell: bash
        run: |
          set -euo pipefail
          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "${exact_dir}"
          EXACT_DIR="${exact_dir}" python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import write_pcm16_wave

          write_pcm16_wave(Path(os.environ["EXACT_DIR"]) / "stereo.wav", 30, 48_000, 2)
          PY

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          "${baseline}" "${exact_dir}/stereo.wav" --analyze --json \
            > "${exact_dir}/base.json"
          "${candidate}" "${exact_dir}/stereo.wav" --analyze --json \
            > "${exact_dir}/candidate.json"
          "${candidate}" "${exact_dir}/stereo.wav" --jobs 1 --analyze --json \
            > "${exact_dir}/candidate-one.json"
          cmp "${exact_dir}/base.json" "${exact_dir}/candidate.json"
          cmp "${exact_dir}/candidate.json" "${exact_dir}/candidate-one.json"

          "${baseline}" "${exact_dir}/stereo.wav" --verify --overwrite \
            -o "${exact_dir}/base.wav"
          "${candidate}" "${exact_dir}/stereo.wav" --verify --overwrite \
            -o "${exact_dir}/candidate.wav"
          cmp "${exact_dir}/base.wav" "${exact_dir}/candidate.wav"

      - name: Run default-worker benchmarks in both orders
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --duration-seconds 300
            --iterations 5
            --case wav-stereo-analyze
            --case wav-stereo-batch-normalize
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-base-first" \
            --output default-base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-candidate-second" \
            --output default-candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-candidate-first" \
            --output default-candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-base-second" \
            --output default-base-second.json "${common[@]}"

      - name: Run one-worker analysis in both orders
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          common=(
            --duration-seconds 600
            --iterations 5
            --case wav-stereo-analyze
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-base-first" \
            --output one-base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-candidate-second" \
            --output one-candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-candidate-first" \
            --output one-candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-base-second" \
            --output one-base-second.json "${common[@]}"

      - name: Summarize pooled and per-order medians
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          summary = {"modes": {}}
          for mode in ("default", "one"):
              names = ("base-first", "candidate-second", "candidate-first", "base-second")
              documents = {
                  name: json.loads(Path(f"{mode}-{name}.json").read_text())
                  for name in names
              }
              assert all(document["passed"] for document in documents.values())
              indexed = {
                  name: {item["id"]: item for item in document["results"]}
                  for name, document in documents.items()
              }
              rows = []
              for case_id in indexed["base-first"]:
                  row = {"id": case_id, "samples_per_binary": 10}
                  for metric in ("wall", "cpu", "rss"):
                      def values(name):
                          samples = indexed[name][case_id]["samples"]
                          if metric == "wall":
                              return [sample["wall_seconds"] for sample in samples]
                          if metric == "cpu":
                              return [
                                  sample["user_cpu_seconds"] + sample["system_cpu_seconds"]
                                  for sample in samples
                              ]
                          return [sample["peak_rss_bytes"] for sample in samples]

                      base_first = values("base-first")
                      candidate_second = values("candidate-second")
                      candidate_first = values("candidate-first")
                      base_second = values("base-second")
                      baseline = base_first + base_second
                      candidate = candidate_first + candidate_second
                      reducer = max if metric == "rss" else statistics.median
                      base_value = reducer(baseline)
                      candidate_value = reducer(candidate)
                      row[metric] = {
                          "base_first": reducer(base_first),
                          "candidate_second": reducer(candidate_second),
                          "candidate_first": reducer(candidate_first),
                          "base_second": reducer(base_second),
                          "baseline_pooled": base_value,
                          "candidate_pooled": candidate_value,
                          "change_percent": (candidate_value / base_value - 1.0) * 100.0,
                      }
                  assert row["wall"]["change_percent"] <= 3.0, row
                  rows.append(row)
              summary["modes"]["default" if mode == "default" else "jobs_1"] = rows

          Path("loudness-window-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: loudness-window-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: |
            default-*.json
            one-*.json
            loudness-window-summary.json
          if-no-files-found: error
          retention-days: 30
