name: Opus decode buffer benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/opus-decode-benchmark.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "schema/performance-benchmark-v1.schema.json"
      - "src/opus.rs"
      - "tools/benchmark.py"
      - "tools/test_benchmark.py"

permissions:
  contents: read

concurrency:
  group: opus-decode-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Check out exact pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          elif ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Test benchmark and Opus allocation contracts
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-candidate-tests
        run: |
          set -euo pipefail
          python3 candidate/tools/test_benchmark.py
          cargo test --locked --manifest-path candidate/Cargo.toml \
            --features opus-encoding --lib \
            decoder_reuses_packet_and_planar_allocations -- --nocapture

      - name: Build exact baseline and candidate
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-baseline" \
            cargo build --locked --release --manifest-path baseline/Cargo.toml \
              --features opus-encoding --bin forge --bin forge-container-qc
          CARGO_TARGET_DIR="${RUNNER_TEMP}/target-candidate" \
            cargo build --locked --release --manifest-path candidate/Cargo.toml \
              --features opus-encoding --bin forge --bin forge-container-qc

      - name: Verify byte-exact analysis and normalized output
        shell: bash
        run: |
          set -euo pipefail
          exact_dir="${RUNNER_TEMP}/exact-output"
          mkdir "${exact_dir}"
          EXACT_DIR="${exact_dir}" python3 - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          sys.path.insert(0, "candidate/tools")
          from benchmark import encode_fixture, write_pcm16_wave

          root = Path(os.environ["EXACT_DIR"])
          source = root / "source.wav"
          write_pcm16_wave(source, 300, 48_000, 2)
          encode_fixture(
              Path(shutil.which("ffmpeg")),
              source,
              root / "input.opus",
              [
                  "-map_metadata", "-1",
                  "-c:a", "libopus",
                  "-b:a", "128k",
                  "-vbr", "off",
                  "-application", "audio",
                  "-frame_duration", "20",
              ],
              1_800,
          )
          source.unlink()
          PY

          baseline="${RUNNER_TEMP}/target-baseline/release/forge"
          candidate="${RUNNER_TEMP}/target-candidate/release/forge"
          "${baseline}" "${exact_dir}/input.opus" --analyze --json \
            > "${exact_dir}/base.json"
          "${candidate}" "${exact_dir}/input.opus" --analyze --json \
            > "${exact_dir}/candidate.json"
          "${candidate}" "${exact_dir}/input.opus" --jobs 1 --analyze --json \
            > "${exact_dir}/candidate-one.json"
          cmp "${exact_dir}/base.json" "${exact_dir}/candidate.json"
          cmp "${exact_dir}/candidate.json" "${exact_dir}/candidate-one.json"

          "${baseline}" "${exact_dir}/input.opus" --overwrite \
            -o "${exact_dir}/base.wav"
          "${candidate}" "${exact_dir}/input.opus" --overwrite \
            -o "${exact_dir}/candidate.wav"
          cmp "${exact_dir}/base.wav" "${exact_dir}/candidate.wav"

      - name: Run default-worker benchmarks in both orders
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --ffmpeg "$(command -v ffmpeg)"
            --duration-seconds 600
            --iterations 5
            --case opus-stereo-analyze
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-base-first" \
            --output default-base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-candidate-second" \
            --output default-candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-candidate-first" \
            --output default-candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/default-base-second" \
            --output default-base-second.json "${common[@]}"

      - name: Run one-worker controls in both orders
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          common=(
            --ffmpeg "$(command -v ffmpeg)"
            --duration-seconds 600
            --iterations 5
            --case opus-stereo-analyze
          )
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-base-first" \
            --output one-base-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-candidate-second" \
            --output one-candidate-second.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-candidate/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-candidate-first" \
            --output one-candidate-first.json "${common[@]}"
          python3 candidate/tools/benchmark.py \
            --forge "${RUNNER_TEMP}/target-baseline/release/forge" \
            --work-dir "${RUNNER_TEMP}/one-base-second" \
            --output one-base-second.json "${common[@]}"

      - name: Summarize pooled and per-order medians
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          summary = {"system": {}, "modes": {}}
          for mode in ("default", "one"):
              paths = {
                  "base_first": Path(f"{mode}-base-first.json"),
                  "candidate_second": Path(f"{mode}-candidate-second.json"),
                  "candidate_first": Path(f"{mode}-candidate-first.json"),
                  "base_second": Path(f"{mode}-base-second.json"),
              }
              documents = {
                  name: json.loads(path.read_text())
                  for name, path in paths.items()
              }
              assert all(document["passed"] for document in documents.values())
              if not summary["system"]:
                  summary["system"] = documents["base_first"]["system"]
              indexed = {
                  name: {item["id"]: item for item in document["results"]}
                  for name, document in documents.items()
              }
              rows = []
              for case_id in indexed["base_first"]:
                  row = {"id": case_id, "samples_per_binary": 10}
                  for metric, key in (("wall", "wall_seconds"), ("cpu", None)):
                      values = {
                          name: [
                              sample[key] if key else (
                                  sample["user_cpu_seconds"]
                                  + sample["system_cpu_seconds"]
                              )
                              for sample in cases[case_id]["samples"]
                          ]
                          for name, cases in indexed.items()
                      }
                      baseline_values = values["base_first"] + values["base_second"]
                      candidate_values = values["candidate_first"] + values["candidate_second"]
                      base_median = statistics.median(baseline_values)
                      candidate_median = statistics.median(candidate_values)
                      row[metric] = {
                          "base_first_median": statistics.median(values["base_first"]),
                          "candidate_second_median": statistics.median(values["candidate_second"]),
                          "candidate_first_median": statistics.median(values["candidate_first"]),
                          "base_second_median": statistics.median(values["base_second"]),
                          "baseline_pooled_median": base_median,
                          "candidate_pooled_median": candidate_median,
                          "change_percent": (
                              candidate_median / base_median - 1.0
                          ) * 100.0,
                      }
                  rows.append(row)
              summary["modes"][
                  "default" if mode == "default" else "jobs_1"
              ] = rows

          Path("opus-decode-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: opus-decode-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: |
            default-*.json
            one-*.json
            opus-decode-summary.json
          if-no-files-found: error
          retention-days: 30
