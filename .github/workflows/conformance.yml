name: Standards conformance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ebu-test-set-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the official EBU Loudness Test Set v5
        run: ./tools/test-ebu-conformance.sh

  itu-bs2217:
    name: ITU BS.2217 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache official ITU-R BS.2217-2 material
        uses: actions/cache@v6
        with:
          path: ~/.cache/forge-normalizer/bs2217-2
          key: itu-bs2217-2-core-v1

      - name: Run the official ITU-R BS.2217-2 conformance tests
        run: ./tools/test-itu-conformance.sh
