name: Standards conformance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ebu-test-set-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Run the official EBU Loudness Test Set v5
        run: ./tools/test-ebu-conformance.sh

  itu-bs2217:
    name: ITU BS.2217 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Cache official ITU-R BS.2217-2 material
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/forge-normalizer/bs2217-2
          key: itu-bs2217-2-core-v1

      - name: Run the official ITU-R BS.2217-2 conformance tests
        run: ./tools/test-itu-conformance.sh

  ebu-qc-report-2026-04:
    name: EBU QC report 2026-04
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Install XML Schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils

      - name: Verify pinned schemas and generated Scenario 1 report
        run: |
          (cd schema/ebu-qc-2026-04 && sha256sum --check SHA256SUMS)
          xmllint --noout --schema schema/ebu-qc-2026-04/forge-validation.xsd \
            schema/ebu-qc-2026-04/qc-reports/qc-report-generic-sample.xml
          cargo test --locked --test cli ebu_qc_writes_scenario1_2026_04_catalogue_xml

  iamf-interoperability:
    name: AOMedia OAR/IAMF interoperability matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0

      - name: Cache pinned AOMedia libiamf vectors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/forge-normalizer/iamf-f06e919e2ad5502a2adc4bdd4e146f2e7e7ffb63
          key: iamf-libiamf-v1.1.0-oar-matrix-v2

      - name: Run OAR/IAMF interoperability matrix
        run: ./tools/test-iamf-conformance.sh
