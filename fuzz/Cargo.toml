[package]
name = "forge-normalizer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
forge-normalizer = { path = "..", features = ["opus-encoding"] }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"

[[bin]]
name = "wave_reader"
path = "fuzz_targets/wave_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "container_qc"
path = "fuzz_targets/container_qc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "adm_profile"
path = "fuzz_targets/adm_profile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_compare"
path = "fuzz_targets/manifest_compare.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hls_qc"
path = "fuzz_targets/hls_qc.rs"
test = false
doc = false
bench = false
