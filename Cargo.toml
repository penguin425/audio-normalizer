[package]
name = "forge-normalizer"
version = "0.180.0"
edition = "2021"
rust-version = "1.89"
description = "Forge: a SIMD-accelerated EBU R128 / ITU-R BS.1770-5 loudness normalizer (WAV/MP3/FLAC/Opus/AAC/Vorbis)"
license = "MIT"
repository = "https://github.com/penguin425/audio-normalizer"

[package.metadata.binstall]
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-linux-x86_64.tar.gz"
bin-dir = "forge-v{ version }-linux-x86_64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-macos-x86_64.tar.gz"
bin-dir = "forge-v{ version }-macos-x86_64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-macos-aarch64.tar.gz"
bin-dir = "forge-v{ version }-macos-aarch64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-windows-x86_64.zip"
bin-dir = "forge-v{ version }-windows-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[lib]
name = "forge_normalizer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffmpeg-encoding = []
aac-encoding = ["ffmpeg-encoding"]
mp3-encoding = []
opus-encoding = ["dep:audiopus_sys", "dep:opus"]
lv2-plugin = []
clap-plugin = ["dep:clack-plugin", "dep:clack-extensions"]
onnx-provider = ["dep:ndarray", "dep:ort"]
grpc-service = ["dep:prost", "dep:tokio", "dep:tonic", "dep:tonic-prost"]
cuda-truepeak = ["dep:cudarc"]

[[bin]]
name = "forge"
path = "src/main.rs"

[[bin]]
name = "forge-live"
path = "src/bin/forge-live.rs"

[[bin]]
name = "forge-compare"
path = "src/bin/forge-compare.rs"

[[bin]]
name = "forge-audio-compare"
path = "src/bin/forge-audio-compare.rs"

[[bin]]
name = "forge-container-qc"
path = "src/bin/forge-container-qc.rs"

[[bin]]
name = "forge-streaming-qc"
path = "src/bin/forge-streaming-qc.rs"

[[bin]]
name = "forge-presentation-qc"
path = "src/bin/forge-presentation-qc.rs"

[[bin]]
name = "forge-adm-presentation-qc"
path = "src/bin/forge-adm-presentation-qc.rs"

[[bin]]
name = "forge-downmix-qc"
path = "src/bin/forge-downmix-qc.rs"

[[bin]]
name = "forge-binaural-qc"
path = "src/bin/forge-binaural-qc.rs"

[[bin]]
name = "forge-remediate"
path = "src/bin/forge-remediate.rs"

[[bin]]
name = "forge-metadata-repair"
path = "src/bin/forge-metadata-repair.rs"

[[bin]]
name = "forge-sadm-qc"
path = "src/bin/forge-sadm-qc.rs"

[[bin]]
name = "forge-dialogue-provider"
path = "src/bin/forge-dialogue-provider.rs"

[[bin]]
name = "forge-anomaly-provider"
path = "src/bin/forge-anomaly-provider.rs"

[[bin]]
name = "forge-onnx-provider"
path = "src/bin/forge-onnx-provider.rs"
required-features = ["onnx-provider"]

[[bin]]
name = "forge-provenance-qc"
path = "src/bin/forge-provenance-qc.rs"

[[bin]]
name = "forge-imf-qc"
path = "src/bin/forge-imf-qc.rs"

[[bin]]
name = "forge-aes31-qc"
path = "src/bin/forge-aes31-qc.rs"

[[bin]]
name = "forge-rtp-qc"
path = "src/bin/forge-rtp-qc.rs"

[[bin]]
name = "forge-nmos-qc"
path = "src/bin/forge-nmos-qc.rs"

[[bin]]
name = "forge-st2022-7-qc"
path = "src/bin/forge-st2022-7-qc.rs"

[[bin]]
name = "forge-report"
path = "src/bin/forge-report.rs"

[[bin]]
name = "forge-multi-delivery"
path = "src/bin/forge-multi-delivery.rs"

[[bin]]
name = "forge-segment-normalize"
path = "src/bin/forge-segment-normalize.rs"

[[bin]]
name = "forge-ac4-qc"
path = "src/bin/forge-ac4-qc.rs"

[[bin]]
name = "forge-mpegh-qc"
path = "src/bin/forge-mpegh-qc.rs"

[[bin]]
name = "forge-dts-qc"
path = "src/bin/forge-dts-qc.rs"

[[bin]]
name = "forge-remote-qc"
path = "src/bin/forge-remote-qc.rs"

[[bin]]
name = "forge-service"
path = "src/bin/forge-service.rs"

[dependencies]
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
symphonia = { version = "0.6", features = ["mp3", "isomp4", "aac", "alac", "flac", "vorbis", "pcm"] }
symphonia-alac-qc = { package = "symphonia-codec-alac", version = "0.6" }
symphonia-core-alac-qc = { package = "symphonia-core", version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
crc32fast = "1"
cfb = "0.14"
toml = "1.1"
lofty = "0.25"
quick-xml = "0.42"
base64 = "0.23"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
clack-plugin = { version = "0.1", optional = true }
clack-extensions = { version = "0.1", optional = true, features = ["audio-ports", "params", "state", "render", "latency", "clack-plugin"] }
flacenc = { version = "0.5.1", default-features = false }
flate2 = "1"
tempfile = "3"
audiopus_sys = { version = "0.2.2", features = ["static"], optional = true }
ogg = "0.9.2"
opus = { version = "0.4.0", optional = true }
httpdate = "1"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2.5"
rubato = { version = "5.0.0", default-features = false, features = ["fft_resampler"] }
jsonschema = { version = "0.52.0", default-features = false }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
ndarray = { version = "0.17", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic"], optional = true }
prost = { version = "0.14.4", optional = true }
tokio = { version = "1.53.1", optional = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", optional = true, default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = { version = "0.14.6", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc = { version = "=0.19.9", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-11040"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
clack-host = { version = "0.1", features = ["clack-plugin"] }
proptest = "1.7"
uuid = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
