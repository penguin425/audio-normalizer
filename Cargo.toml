[package]
name = "forge-normalizer"
version = "0.88.0"
edition = "2021"
rust-version = "1.89"
description = "Forge: a SIMD-accelerated EBU R128 / ITU-R BS.1770-5 loudness normalizer (WAV/MP3/FLAC/Opus/AAC/Vorbis)"
license = "MIT"
repository = "https://github.com/penguin425/audio-normalizer"

[package.metadata.binstall]
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-linux-x86_64.tar.gz"
bin-dir = "forge-v{ version }-linux-x86_64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-macos-x86_64.tar.gz"
bin-dir = "forge-v{ version }-macos-x86_64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-macos-aarch64.tar.gz"
bin-dir = "forge-v{ version }-macos-aarch64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/forge-v{ version }-windows-x86_64.zip"
bin-dir = "forge-v{ version }-windows-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[lib]
name = "forge_normalizer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffmpeg-encoding = []
aac-encoding = ["ffmpeg-encoding"]
mp3-encoding = []
opus-encoding = ["dep:audiopus_sys", "dep:opus"]
lv2-plugin = []
clap-plugin = ["dep:clack-plugin", "dep:clack-extensions"]

[[bin]]
name = "forge"
path = "src/main.rs"

[[bin]]
name = "forge-live"
path = "src/bin/forge-live.rs"

[[bin]]
name = "forge-compare"
path = "src/bin/forge-compare.rs"

[[bin]]
name = "forge-audio-compare"
path = "src/bin/forge-audio-compare.rs"

[[bin]]
name = "forge-container-qc"
path = "src/bin/forge-container-qc.rs"

[[bin]]
name = "forge-streaming-qc"
path = "src/bin/forge-streaming-qc.rs"

[[bin]]
name = "forge-presentation-qc"
path = "src/bin/forge-presentation-qc.rs"

[[bin]]
name = "forge-sadm-qc"
path = "src/bin/forge-sadm-qc.rs"

[[bin]]
name = "forge-dialogue-provider"
path = "src/bin/forge-dialogue-provider.rs"

[[bin]]
name = "forge-provenance-qc"
path = "src/bin/forge-provenance-qc.rs"

[[bin]]
name = "forge-imf-qc"
path = "src/bin/forge-imf-qc.rs"

[[bin]]
name = "forge-aes31-qc"
path = "src/bin/forge-aes31-qc.rs"

[[bin]]
name = "forge-rtp-qc"
path = "src/bin/forge-rtp-qc.rs"

[[bin]]
name = "forge-nmos-qc"
path = "src/bin/forge-nmos-qc.rs"

[[bin]]
name = "forge-st2022-7-qc"
path = "src/bin/forge-st2022-7-qc.rs"

[dependencies]
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
symphonia = { version = "0.5", features = ["mp3", "isomp4", "aac", "alac", "flac", "vorbis", "pcm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
crc32fast = "1"
cfb = "0.14"
toml = "1.1"
lofty = "0.24"
quick-xml = "0.41"
base64 = "0.23"
sha1 = "0.11"
sha2 = "0.11"
clack-plugin = { version = "0.1", optional = true }
clack-extensions = { version = "0.1", optional = true, features = ["audio-ports", "params", "state", "render", "latency", "clack-plugin"] }
flacenc = { version = "0.5.1", default-features = false }
flate2 = "1"
tempfile = "3"
audiopus_sys = { version = "0.2.2", features = ["static"], optional = true }
ogg = "0.9.2"
opus = { version = "0.3.1", optional = true }
httpdate = "1"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2.5"
rubato = { version = "0.16.2", default-features = false }

[build-dependencies]

[dev-dependencies]
jsonschema = { version = "0.49.1", default-features = false }
clack-host = { version = "0.1", features = ["clack-plugin"] }
proptest = "1.7"
uuid = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
