[package]
name = "forge-normalizer"
version = "0.10.0"
edition = "2021"
description = "Forge: a SIMD-accelerated EBU R128 / ITU-R BS.1770-5 loudness normalizer (WAV/MP3/FLAC/Opus/AAC/Vorbis)"
license = "MIT"
repository = "https://github.com/penguin425/audio-normalizer"

[lib]
name = "forge_normalizer"
path = "src/lib.rs"

[features]
default = []
aac-encoding = []
mp3-encoding = []
opus-encoding = ["dep:audiopus_sys", "dep:ogg", "dep:opus", "dep:rubato"]

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
symphonia = { version = "0.5", features = ["mp3", "isomp4", "aac", "flac", "vorbis", "pcm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "1.1"
lofty = "0.24"
flacenc = { version = "0.5.1", default-features = false }
tempfile = "3"
audiopus_sys = { version = "0.2.2", features = ["static"], optional = true }
ogg = { version = "0.9.2", optional = true }
opus = { version = "0.3.1", optional = true }
rubato = { version = "0.16.2", default-features = false, optional = true }

[build-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
