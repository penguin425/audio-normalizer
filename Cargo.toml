[package]
name = "forge-normalizer"
version = "0.2.0"
edition = "2021"
description = "Forge: a SIMD-accelerated EBU R128 / ITU-R BS.1770-4 loudness normalizer (WAV/MP3/FLAC/AAC/Vorbis)"
license = "MIT"
repository = "https://github.com/penguin425/audio-normalizer"

[lib]
name = "forge_normalizer"
path = "src/lib.rs"

[features]
default = []
mp3-encoding = []

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
symphonia = { version = "0.5", features = ["mp3", "isomp4", "aac", "flac", "vorbis", "pcm"] }

[build-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
