[build-system]
requires = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "forge-normalizer"
dynamic = ["version"]
description = "Python bindings for the versioned Forge loudness-analysis C ABI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "KAORU" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/penguin425/audio-normalizer"
Documentation = "https://github.com/penguin425/audio-normalizer/blob/main/PYTHON-API.md"
Issues = "https://github.com/penguin425/audio-normalizer/issues"
Repository = "https://github.com/penguin425/audio-normalizer"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "forge_normalizer._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge_normalizer = [
  "lib/*",
  "py.typed",
]
