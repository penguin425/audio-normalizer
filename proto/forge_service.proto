syntax = "proto3";

package forge.service.v1;

// Stateless bounded audio analysis service.  The request and response fields
// deliberately mirror the REST service while keeping the report JSON payload
// versioned by the existing service-analysis schema.
service ForgeAnalysis {
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

// Additive v3 analysis surface. The original ForgeAnalysis service and its
// messages remain frozen so existing generated clients and server trait
// implementations stay source compatible. Cancellation shares the same
// request-ID registry as ForgeAnalysis.
service ForgeAnalysisV3 {
  rpc Analyze(AnalyzeV3Request) returns (AnalyzeV3Response);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

// Kept as a separate service so adding observability does not require
// downstream implementations of ForgeAnalysis to add a new method.
service ForgeMetrics {
  rpc Metrics(MetricsRequest) returns (MetricsResponse);
}

message AnalyzeRequest {
  bytes audio = 1;
  string filename = 2;
  string content_type = 3;
  string profile = 4;
  // A caller supplied opaque identifier used by Cancel.  It is bounded by the
  // server and must be unique while the request is active.
  string request_id = 5;
}

message AnalyzeResponse {
  string schema = 1;
  string generator = 2;
  string filename = 3;
  string content_type = 4;
  uint64 bytes_received = 5;
  string report_json = 6;
  string request_id = 7;
}

message AnalyzeV3Request {
  bytes audio = 1;
  string filename = 2;
  string content_type = 3;
  string profile = 4;
  // A caller supplied opaque identifier used by Cancel. It is bounded by the
  // server and must be unique across both analysis services while active.
  string request_id = 5;
  // Optional versioned ChannelLayoutDescriptor JSON. An empty string uses
  // container/decoder evidence; overrides must use explicit-override origin.
  string channel_layout_json = 6;
}

message AnalyzeV3Response {
  string schema = 1;
  string generator = 2;
  string filename = 3;
  string content_type = 4;
  uint64 bytes_received = 5;
  string report_json = 6;
  string request_id = 7;
  // Exact descriptor used by the measurement, serialized as canonical JSON.
  string channel_layout_json = 8;
}

message CancelRequest {
  string request_id = 1;
}

message CancelResponse {
  bool cancelled = 1;
}

message HealthRequest {}

message HealthResponse {
  string schema = 1;
  string generator = 2;
  string status = 3;
}

message MetricsRequest {}

message MetricsResponse {
  string content_type = 1;
  string prometheus_text = 2;
}
