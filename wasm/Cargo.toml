[package]
name = "forge-normalizer-wasm"
version = "0.129.0"
edition = "2021"
rust-version = "1.89"
description = "Local browser analysis bindings for Forge"
license = "MIT"
repository = "https://github.com/penguin425/audio-normalizer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
rubato = { version = "4.0.0", default-features = false, features = ["fft_resampler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
