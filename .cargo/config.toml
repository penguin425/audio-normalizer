# Build configuration for Forge.
# Local developer builds target the host CPU so LLVM can auto-vectorize around
# the hand-written runtime-dispatched SIMD kernels. Such builds are host-specific
# and are not portable. Release CI overrides RUSTFLAGS with the baseline target;
# its AVX2/FMA kernels retain explicit runtime detection and scalar fallbacks.
[target.'cfg(not(target_arch = "wasm32"))']
rustflags = ["-C", "target-cpu=native"]
